<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>暴力摩托 · ROAD RASH</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
</head>
<body>
<style>
  /* 世嘉复古：颜色全部显式声明，不跟随宿主主题 */
  :root{
    --black:#07070c; --dark:#12121e; --panel:#1b1b2c;
    --line:#3a3a58;
    --white:#f4f0e4; --dim:#8a8aa8;
    --red:#e03c28; --orange:#f08820; --yellow:#f8d038;
    --green:#38c058; --cyan:#38c8e0; --blue:#3858d8;
    --mono:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{background:#000;color:var(--white);font-family:var(--ui);
    overflow:hidden;touch-action:none;overscroll-behavior:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}

  /* ---------- 舞台：像素画布 + 贴在它上面的 HUD ---------- */
  #stage{position:relative;flex:0 0 auto;background:#000;overflow:hidden;}
  #px{display:block;width:100%;height:100%;}

  .layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}

  /* ---------- HUD ---------- */
  #hud{z-index:6;font-family:var(--mono);}
  #hud.off{display:none;}
  #hud .box{position:absolute;}

  /* 名次 */
  #posBox{left:2.2%;top:3%;}
  #posNum{font-size:clamp(20px,4.6vmin,44px);font-weight:800;line-height:1;color:var(--yellow);
    text-shadow:2px 2px 0 #000,0 0 12px rgba(248,208,56,.5);}
  #posNum small{font-size:.44em;color:var(--dim);text-shadow:1px 1px 0 #000;}
  #posLbl{margin-top:2px;font-size:clamp(7px,1.5vmin,12px);letter-spacing:.24em;color:var(--dim);}

  /* 剩余距离 */
  #distBox{left:50%;top:3%;transform:translateX(-50%);text-align:center;}
  #distNum{font-size:clamp(13px,3vmin,28px);font-weight:800;color:var(--white);
    text-shadow:2px 2px 0 #000;letter-spacing:.04em;}
  #distBar{margin:3px auto 0;width:clamp(70px,22vmin,190px);height:clamp(3px,.8vmin,6px);
    background:rgba(0,0,0,.55);border:1px solid var(--line);}
  #distFill{height:100%;width:0%;background:var(--cyan);box-shadow:0 0 8px rgba(56,200,224,.7);}
  #lapLbl{margin-top:3px;font-size:clamp(7px,1.5vmin,12px);letter-spacing:.22em;color:var(--dim);}

  /* 时间 / 赛道名 */
  #trackBox{right:2.2%;top:3%;text-align:right;}
  #trackName{font-family:var(--ui);font-size:clamp(9px,2vmin,17px);font-weight:800;
    letter-spacing:.16em;color:var(--orange);text-shadow:2px 2px 0 #000;}
  #clock{margin-top:2px;font-size:clamp(11px,2.4vmin,22px);font-weight:800;color:var(--white);
    text-shadow:2px 2px 0 #000;}

  /* 伤害条 */
  #dmgBox{left:2.2%;bottom:4%;}
  #dmgLbl{font-size:clamp(7px,1.5vmin,12px);letter-spacing:.22em;color:var(--dim);margin-bottom:3px;}
  #dmgBar{width:clamp(74px,24vmin,210px);height:clamp(7px,1.9vmin,15px);
    background:rgba(0,0,0,.6);border:2px solid var(--line);position:relative;}
  #dmgFill{position:absolute;inset:0;width:100%;
    background:linear-gradient(90deg,var(--green),#8ee08a);transition:width .12s linear;}
  #dmgFill.mid{background:linear-gradient(90deg,var(--yellow),#ffe98a);}
  #dmgFill.low{background:linear-gradient(90deg,var(--red),#ff8a70);animation:pulse .5s steps(2,start) infinite;}
  @keyframes pulse{50%{opacity:.35}}
  #nitroLbl{font-size:clamp(7px,1.5vmin,12px);letter-spacing:.22em;color:var(--dim);margin:5px 0 3px;}
  #nitroBar{width:clamp(74px,24vmin,210px);height:clamp(6px,1.6vmin,12px);
    background:rgba(0,0,0,.6);border:2px solid var(--line);position:relative;}
  #nitroFill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#2a8cff,#7ee8ff);}
  #nitroBar i{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(0,0,0,.7);}
  #nitroBar.ready{border-color:#7ee8ff;box-shadow:0 0 10px rgba(126,232,255,.6);}
  #nitroBar.on #nitroFill{animation:pulse .2s steps(2,start) infinite;}
  #wep{margin-top:5px;font-size:clamp(8px,1.7vmin,13px);letter-spacing:.14em;color:var(--orange);}
  #wep.none{color:var(--dim);}

  /* 速度表 */
  #spdBox{right:2.2%;bottom:4%;text-align:right;}
  #spdNum{font-size:clamp(26px,6.4vmin,60px);font-weight:800;line-height:.9;color:var(--white);
    text-shadow:3px 3px 0 #000;font-variant-numeric:tabular-nums;}
  #spdNum.fast{color:var(--yellow);text-shadow:3px 3px 0 #000,0 0 16px rgba(248,208,56,.55);}
  #spdNum.red{color:var(--red);text-shadow:3px 3px 0 #000,0 0 18px rgba(224,60,40,.6);}
  #spdUnit{font-size:clamp(7px,1.5vmin,12px);letter-spacing:.3em;color:var(--dim);margin-top:1px;}
  #gear{margin-top:3px;font-size:clamp(8px,1.8vmin,14px);letter-spacing:.2em;color:var(--orange);}

  /* 屏幕中央提示 */
  #toast{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);
    font-family:var(--ui);font-weight:900;letter-spacing:.14em;text-align:center;
    font-size:clamp(15px,4vmin,38px);color:var(--yellow);
    text-shadow:3px 3px 0 #000,0 0 20px rgba(248,208,56,.55);opacity:0;}
  #toast.show{animation:toastIn 1.5s ease-out forwards;}
  #toast.warn{color:var(--red);text-shadow:3px 3px 0 #000,0 0 22px rgba(224,60,40,.7);}
  @keyframes toastIn{
    0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
    12%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    70%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
  }

  /* 警察警示条 */
  #copBar{position:absolute;left:0;right:0;top:0;height:clamp(3px,.9vmin,7px);
    background:var(--red);opacity:0;box-shadow:0 0 14px rgba(224,60,40,.9);}
  #copBar.on{animation:copFlash .42s steps(2,start) infinite;}
  @keyframes copFlash{0%{opacity:.9;background:var(--red)}50%{opacity:.9;background:var(--blue)}}

  /* ---------- 全屏面板 ---------- */
  .sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(7,7,12,.9);padding:3%;}
  .sheet.off{display:none;}
  .card{width:min(560px,94%);max-height:94%;overflow:auto;text-align:center;
    background:var(--dark);border:3px solid var(--line);
    box-shadow:0 0 0 3px #000,0 18px 50px rgba(0,0,0,.8);padding:clamp(12px,3.2vmin,28px);}
  .card h1{margin:0 0 2px;font-size:clamp(24px,7vmin,54px);font-weight:900;letter-spacing:.1em;
    color:var(--red);text-shadow:3px 3px 0 #000,6px 6px 0 rgba(240,136,32,.35);}
  .card h2{margin:0 0 10px;font-size:clamp(14px,3.4vmin,26px);font-weight:900;letter-spacing:.12em;color:var(--yellow);}
  .card .sub{font-family:var(--mono);font-size:clamp(8px,1.7vmin,12px);letter-spacing:.34em;color:var(--dim);margin-bottom:14px;}
  .card p{margin:6px 0;font-size:clamp(11px,2.1vmin,14px);line-height:1.75;color:#c8c8dc;}
  .card .go{margin-top:16px;font-size:clamp(11px,2.3vmin,16px);font-weight:800;letter-spacing:.24em;
    color:var(--green);animation:pulse 1.1s steps(2,start) infinite;}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:4px 16px;
    margin:12px 0 4px;text-align:left;}
  .keys div{font-size:clamp(10px,1.9vmin,13px);color:#c8c8dc;white-space:nowrap;}
  kbd{display:inline-block;min-width:18px;padding:1px 5px;margin-right:6px;
    border:1px solid var(--line);border-bottom-width:2px;background:#000;color:var(--white);
    font-family:var(--mono);font-size:.85em;text-align:center;}

  /* 成绩表 */
  table.res{width:100%;border-collapse:collapse;margin:8px 0;font-family:var(--mono);
    font-size:clamp(10px,1.9vmin,14px);}
  table.res td{padding:3px 5px;border-bottom:1px solid rgba(58,58,88,.5);text-align:left;color:#c8c8dc;}
  table.res td.n{text-align:right;color:var(--white);}
  table.res tr.me td{color:var(--yellow);font-weight:800;background:rgba(248,208,56,.08);}

  /* 车行 */
  .shop{display:grid;gap:7px;margin:10px 0;}
  /* 车行五台车：卡片放宽、两列排，「上路」不至于被挤到滚动区外面 */
  .card.wide{width:min(800px,96%);}
  .card.wide .shop{grid-template-columns:1fr 1fr;}
  .card.wide .bike canvas{width:clamp(44px,8.5vmin,64px);}
  .bike .pr{white-space:nowrap;}
  .bike{display:flex;align-items:center;gap:10px;padding:7px 9px;text-align:left;
    background:var(--panel);border:2px solid var(--line);cursor:pointer;pointer-events:auto;}
  .bike.own{border-color:var(--green);}
  .bike.cant{opacity:.42;}
  .bike.sel{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(248,208,56,.3);}
  .bike canvas{width:clamp(52px,12vmin,84px);height:auto;flex:0 0 auto;}
  .bike .nm{font-weight:800;font-size:clamp(11px,2.1vmin,15px);color:var(--white);letter-spacing:.06em;}
  .bike .st{font-family:var(--mono);font-size:clamp(8px,1.6vmin,11px);color:var(--dim);margin-top:2px;letter-spacing:.06em;}
  .bike .pr{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:clamp(10px,2vmin,14px);color:var(--yellow);}
  .bike .pr.own{color:var(--green);}
  .money{font-family:var(--mono);font-size:clamp(12px,2.4vmin,18px);font-weight:800;color:var(--green);letter-spacing:.1em;}

  /* 难度：车行里一排小按钮，选难度页是一张张卡片 */
  .diffRow{display:flex;align-items:center;justify-content:center;gap:5px;margin:8px 0 0;flex-wrap:wrap;}
  .diffRow .lbl{font-size:clamp(9px,1.8vmin,12px);letter-spacing:.2em;color:var(--dim);margin-right:3px;}
  .dbtn{pointer-events:auto;cursor:pointer;padding:3px 10px;font-weight:800;font-size:clamp(10px,2vmin,14px);letter-spacing:.1em;
    background:var(--panel);color:var(--dim);border:2px solid var(--line);user-select:none;}
  .dbtn.sel{border-color:var(--yellow);color:var(--white);box-shadow:0 0 0 2px rgba(248,208,56,.25);}
  .dbtn.lock{opacity:.4;cursor:default;}
  .dpick{display:grid;gap:7px;margin:10px 0;}
  .dcard{padding:8px 11px;text-align:left;background:var(--panel);border:2px solid var(--line);cursor:pointer;pointer-events:auto;}
  .dcard.sel{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(248,208,56,.25);}
  .dcard.lock{opacity:.42;cursor:default;}
  .dcard .nm{font-weight:900;font-size:clamp(13px,2.6vmin,18px);letter-spacing:.12em;}
  .dcard .nm small{font-family:var(--mono);font-size:.58em;color:var(--dim);letter-spacing:.2em;margin-left:8px;font-weight:700;}
  .dcard .st{font-size:clamp(10px,1.9vmin,13px);color:#c8c8dc;margin-top:2px;line-height:1.5;}
  .d0 .nm,.dbtn.d0.sel{color:var(--green);} .d1 .nm,.dbtn.d1.sel{color:var(--cyan);}
  .d2 .nm,.dbtn.d2.sel{color:var(--orange);} .d3 .nm,.dbtn.d3.sel{color:var(--red);}

  .btn{display:inline-block;margin:8px 5px 0;padding:8px 20px;pointer-events:auto;cursor:pointer;
    font-weight:800;letter-spacing:.16em;font-size:clamp(11px,2.2vmin,15px);
    background:var(--red);color:#fff;border:2px solid #000;
    box-shadow:0 4px 0 #7a1a10;user-select:none;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1a10;}
  .btn.alt{background:var(--panel);color:var(--white);box-shadow:0 4px 0 #000;border-color:var(--line);}

  /* 横屏手机只有 360~430 像素高：车行四台车竖着排，"上路"按钮被挤到面板外面，
     还没有任何滚动提示。矮屏幕下车行改两列、结算表收紧，一屏放得下 */
  @media (max-height: 520px) {
    .sheet{padding:2% 3%;}
    .card{width:min(780px,96%);max-height:97%;padding:8px 14px;}
    .card h1{font-size:clamp(20px,6vmin,40px);}
    .card h2{margin:0 0 2px;}
    .card .sub{margin-bottom:4px;}
    .card p{margin:3px 0;line-height:1.5;}
    .shop{grid-template-columns:1fr 1fr;gap:5px;margin:5px 0;}
    .bike{padding:3px 7px;gap:6px;}
    .bike canvas,.card.wide .bike canvas{width:40px;}
    .card.wide .shop{grid-template-columns:1fr 1fr 1fr;}
    .bike .st .more{display:none;}
    .dpick{grid-template-columns:1fr 1fr;gap:5px;margin:5px 0;}
    .dcard{padding:4px 8px;}
    .diffRow{margin:4px 0 0;}
    .keys{margin:6px 0 2px;}
    table.res{margin:4px 0;}
    table.res td{padding:1px 5px;}
    .btn{margin:5px 5px 0;padding:6px 18px;}
  }

  /* ---------- 触屏手柄 ---------- */
  #pad{position:fixed;inset:0;z-index:12;pointer-events:none;display:none;}
  #pad.on{display:block;}
  .k{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    font-family:var(--ui);font-weight:900;letter-spacing:.06em;color:var(--white);
    background:rgba(27,27,44,.5);border:2px solid rgba(244,240,228,.3);
    border-radius:50%;user-select:none;text-shadow:1px 1px 0 #000;}
  .k.sq{border-radius:10px;}
  .k.hit{background:rgba(224,60,40,.62);border-color:rgba(255,180,160,.7);}
  .k:active,.k.dn{background:rgba(240,136,32,.75);border-color:#fff;}
  /* 手柄布局的两条规矩：
     1. 手机上油门是自动的。左手只管方向，右手管踹人、刹车、氮气 —— 原来油门要一直按着，
        右踹得松油门、左踹得松方向，两根拇指永远在抢键。
     2. 按键不能压在「够得着踹的对手」身上。横屏时贴身对手画在屏宽约 29%~39% 和
        61%~71% 的位置，所以摇杆收在左边 27% 以内，右手一簇收在右边 25% 以内。 */
  /* 变向：左下一个圆形摇杆。按住圆的哪一侧就往哪边转，手指左右推就能换向，不用抬手。
     原来是一条横着的细滑块，只有六十来像素高，拇指很容易压到上下沿外面去。
     #steerZone 是比圆大得多的隐形触控区：落在圆外稍远的地方，摇杆会挪到拇指底下
     （见 steerGrab），所以左下这一大块按哪儿都算数。 */
  #steerZone{left:0;bottom:0;width:27vw;height:72vh;border:0;border-radius:0;background:none;}
  #kSteer{--d:34vmin;position:absolute;left:3vw;bottom:5vh;width:var(--d);height:var(--d);border-radius:50%;
    background:rgba(27,27,44,.5);border:2px solid rgba(244,240,228,.3);pointer-events:none;}
  #kSteer .arr{position:absolute;top:50%;transform:translateY(-50%);font-size:calc(var(--d) * .15);font-weight:900;
    color:var(--white);opacity:.5;text-shadow:1px 1px 0 #000;line-height:1;}
  #kSteer .arr.l{left:calc(var(--d) * .07);}  #kSteer .arr.r{right:calc(var(--d) * .07);}
  #kSteer .knob{position:absolute;left:50%;top:50%;width:calc(var(--d) * .42);height:calc(var(--d) * .42);
    margin:calc(var(--d) * -.21) 0 0 calc(var(--d) * -.21);border-radius:50%;
    background:rgba(244,240,228,.22);border:2px solid rgba(244,240,228,.55);}
  #steerZone.dn #kSteer{background:rgba(27,27,44,.7);border-color:rgba(244,240,228,.6);}
  #steerZone.dn .knob{background:rgba(240,136,32,.85);border-color:#fff;}
  #steerZone.dn .arr.on{opacity:1;color:var(--yellow);}
  #kAtkR{right:3vw;bottom:5vh;width:18vmin;height:18vmin;font-size:4.2vmin;}
  #kAtkL{right:calc(3vw + 20vmin);bottom:5vh;width:18vmin;height:18vmin;font-size:4.2vmin;}
  #kBrk{right:3vw;bottom:calc(5vh + 21vmin);width:15vmin;height:12vmin;font-size:3.4vmin;}
  #kNitro{right:calc(3vw + 21.5vmin);bottom:calc(5vh + 21vmin);width:15vmin;height:15vmin;font-size:3.4vmin;
    background:rgba(20,50,90,.55);border-color:rgba(126,232,255,.3);color:#bfefff;}
  #kNitro.ready{background:rgba(40,140,255,.72);border-color:#7ee8ff;box-shadow:0 0 14px rgba(126,232,255,.7);color:#fff;}
  #kPause{right:2.2vw;top:3vh;width:10vmin;height:10vmin;font-size:3.6vmin;letter-spacing:0;}

  /* 竖屏：画面在上、手柄在下。按键尺寸改按屏宽算 */
  body.portrait #pad .k{background:rgba(27,27,44,.85);}
  body.portrait #pad #steerZone{background:none;width:52vw;height:calc(6vh + 38vw + 16vw);}
  body.portrait #pad #kSteer{--d:38vw;background:rgba(27,27,44,.85);left:6vw;bottom:6vh;}
  body.portrait #pad #kAtkR{right:4vw;bottom:6vh;width:19vw;height:19vw;font-size:4.4vw;background:rgba(224,60,40,.8);}
  body.portrait #pad #kAtkL{right:calc(4vw + 21vw);bottom:6vh;width:19vw;height:19vw;font-size:4.4vw;background:rgba(224,60,40,.8);}
  body.portrait #pad #kBrk{right:4vw;bottom:calc(6vh + 22vw);width:15vw;height:12vw;font-size:3.6vw;}
  body.portrait #pad #kNitro{right:calc(4vw + 23vw);bottom:calc(6vh + 22vw);width:15vw;height:15vw;font-size:3.6vw;}
  body.portrait #pad #kNitro.ready{background:rgba(40,140,255,.85);}
  /* 触屏：右上角让给暂停键；左下、右下两个 HUD 框挪到按键上方 */
  body.touch #trackBox{right:calc(2.2vw + 12vmin);}
  body.touch:not(.portrait) #dmgBox{bottom:calc(5vh + 34vmin + 4vmin);}
  body.touch:not(.portrait) #spdBox{bottom:calc(5vh + 36vmin + 5vmin);}
  body.portrait #stage{margin-top:env(safe-area-inset-top,0px);}
  /* 竖屏的画面只有屏幕上半截那么高，菜单塞在里面得来回滚；菜单时手柄用不上，直接铺满整屏 */
  body.portrait .sheet{position:fixed;}
  body.portrait .card.wide .shop{grid-template-columns:1fr;}
  /* 竖屏画面左右被裁窄了，底部两角正好是贴身对手的位置，HUD 框挪到上方两侧 */
  body.portrait #dmgBox{top:18%;bottom:auto;}
  body.portrait #spdBox{top:18%;bottom:auto;}
</style>

<div id="stage">
  <canvas id="px"></canvas>

  <div id="hud" class="layer off">
    <div id="copBar"></div>
    <div class="box" id="posBox"><div id="posNum">1<small>/8</small></div><div id="posLbl">POS</div></div>
    <div class="box" id="distBox"><div id="distNum">0.0 KM</div><div id="distBar"><div id="distFill"></div></div><div id="lapLbl">TO FINISH</div></div>
    <div class="box" id="trackBox"><div id="trackName">市中心</div><div id="clock">0:00</div></div>
    <div class="box" id="dmgBox"><div id="dmgLbl">DAMAGE</div><div id="dmgBar"><div id="dmgFill"></div></div>
      <div id="nitroLbl">NITRO</div><div id="nitroBar"><div id="nitroFill"></div><i style="left:33%"></i><i style="left:66%"></i></div>
      <div id="wep" class="none">徒手</div></div>
    <div class="box" id="spdBox"><div id="spdNum">0</div><div id="spdUnit">KM/H</div><div id="gear">GEAR 1</div></div>
    <div id="toast"></div>
  </div>

  <div id="sheet" class="sheet"><div class="card" id="cardBody"></div></div>
</div>

<div id="pad">
  <div class="k" id="steerZone"><div id="kSteer">
    <span class="arr l">◀</span><span class="arr r">▶</span><span class="knob"></span>
  </div></div>
  <div class="k sq" id="kBrk">刹车</div>
  <div class="k" id="kNitro">氮气</div>
  <div class="k hit" id="kAtkL">◀踹</div>

<script>
'use strict';
/* ==========================================================================
   0. 工具
   ========================================================================== */
const PI = Math.PI, TAU = PI * 2;

const lerp  = (a, b, t) => a + (b - a) * t;
const sign  = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const easeIn  = (a, b, p) => a + (b - a) * p * p;
const easeOut = (a, b, p) => a + (b - a) * (1 - (1 - p) * (1 - p));
const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * PI) / 2 + .5);

function makeRng(seed) {
  let s = (seed >>> 0) || 1;
  return function () {
    s ^= s << 13; s >>>= 0;

    return s / 4294967296;

const PLAYER_PAL = { j:'#2c4cd0', j2:'#18265e', h:'#e03c28', b:'#3a68f0', nm:'你' };
const COP_PAL    = { j:'#101828', j2:'#080c14', h:'#f4f0e4', b:'#f4f0e4', nm:'警察' };

/* ==========================================================================
   2. 像素画布
   ========================================================================== */
const stage = document.getElementById('stage');
const cvs   = document.getElementById('px');
const ctx   = cvs.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = true;

/* 画布按设备像素跑满，不再有低分辨率缓冲。
   PX 是「设计单位」：这份代码里所有以像素为单位的常数都是按 H=360 调的，
   乘上 PX 就跟着分辨率走 —— 描边粗细、火花大小、震屏幅度都靠它。 */

let portrait = false;
const MAX_H = 1080;                    // 4K 屏上别真去铺 2160 行

function layout() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  const aspect = vw / vh;
  portrait = aspect < 1.15;
  document.body.classList.toggle('portrait', portrait);

  let sw, sh, cw;
  if (portrait) {
    /* 竖屏：画面顶在上方，下面留给手柄。
       原来是一条 16:9 的窄条，只占屏幕高度四分之一。现在把画面拉到比正方形略高，
       画布仍按 16:9 渲染、左右各裁掉一截 —— 投影不用改，贴身的对手也还在画面里。 */
    sw = vw; sh = Math.round(Math.min(vw * 1.1, vh * .6));
    cw = Math.round(sh * 16 / 9);
    document.body.style.justifyContent = 'flex-start';
  } else {
    sw = vw; sh = vh; cw = vw;
    document.body.style.justifyContent = '';
  }
  stage.style.width = sw + 'px';
  stage.style.height = sh + 'px';
  stage.style.marginBottom = '0px';
  cvs.style.width = cw + 'px';
  cvs.style.marginLeft = Math.round((sw - cw) / 2) + 'px';

  let dpr = Math.min(2, window.devicePixelRatio || 1);
  if (sh * dpr > MAX_H) dpr = MAX_H / sh;
  const nw = Math.max(320, Math.round(cw * dpr)), nh = Math.max(180, Math.round(sh * dpr));
  if (cvs.width !== nw || cvs.height !== nh) { cvs.width = nw; cvs.height = nh; }
  W = cvs.width; H = cvs.height;
  PX = H / 360;
  ctx.imageSmoothingEnabled = true;
  if (typeof onResized === 'function') onResized();
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));

/* 触屏检测 */
const TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ==========================================================================
   3. 输入
   ========================================================================== */
const Input = {
  left:0, right:0, gas:0, brake:0,       // 模拟量 0..1
  atkL:false, atkR:false, nitro:false,   // 边沿触发
  atkLHeld:false, atkRHeld:false,
  _keys:Object.create(null),
};
function keyDown(e) {
  const k = e.key.toLowerCase();
  if (Input._keys[k]) return;            // 忽略自动重复
  Input._keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright','w','s'].includes(k)) touchMode = false;
  if (k === 'a' || k === 'j' || k === 'z') Input.atkL = true;
  if (k === 'd' || k === 'k' || k === 'x') Input.atkR = true;
  if (k === 'n' || k === 'shift' || (k === ' ' && Game.state === 'race')) Input.nitro = true;
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'r' && (Game.state === 'race' || Game.state === 'down')) restartRace();
  if (k === 'm') toggleMute();
  if (k === 'enter' || k === ' ') sheetConfirm();
  // 别让方向键滚页面
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  audioUnlock();
}
function keyUp(e) { Input._keys[e.key.toLowerCase()] = false; }
window.addEventListener('keydown', keyDown);
window.addEventListener('keyup', keyUp);
window.addEventListener('blur', () => { Input._keys = Object.create(null); });

const K = k => !!Input._keys[k];

/* 触屏按钮：按住式 */
const padEl = document.getElementById('pad');
const touchState = { steer:0, brk:false };   // steer 是模拟量 -1..1
/* 自动油门：手机上默认一直给油，按刹车才松。用键盘方向键就切回手动 ——
   有触屏的笔记本也会被判成 TOUCH，不能让键盘玩家的车自己往前冲。 */
let touchMode = TOUCH;
window.addEventListener('touchstart', () => { touchMode = true; }, { passive:true });
function bindPad(id, on, off) {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); el.classList.add('dn'); on(); audioUnlock(); };
  const up   = e => { e.preventDefault(); el.classList.remove('dn'); if (off) off(); };
  el.addEventListener('touchstart', down, { passive:false });
  el.addEventListener('touchend', up, { passive:false });
  el.addEventListener('touchcancel', up, { passive:false });
  el.addEventListener('mousedown', down);
  window.addEventListener('mouseup', up);
}

/* 变向摇杆：一根手指按住，横向偏离圆心多少就转多少，左右推动连续变化；上下不管。
   中间 STEER_DEAD 以内不转，推到半径的 STEER_FULL 就是满舵 —— 不用推到圆边上，
   只在中间留一点比例区做微调。用 touch identifier 认手指，右手按别的键不会串。 */
const STEER_DEAD = .1, STEER_FULL = .6;
const STEER_FLOAT = 1.2;         // 拇指落点离圆心超过这么多个半径，就把摇杆挪过去
const steerZone = document.getElementById('steerZone'), steerEl = document.getElementById('kSteer');
const steerKnob = steerEl.querySelector('.knob');
const steerArrL = steerEl.querySelector('.arr.l'), steerArrR = steerEl.querySelector('.arr.r');
let steerId = null;
/* 按下的那一下：落在圆里（或者圆边附近）就按落点算，按右半边立刻往右转；
   落在圆外更远的地方，说明拇指没对准 —— 把摇杆挪到拇指底下，从回中开始推 */
function steerGrab(x, y) {
  const r = steerEl.getBoundingClientRect(), R = r.width / 2;
  if (Math.hypot(x - (r.left + R), y - (r.top + R)) > R * STEER_FLOAT) {
    const z = steerZone.getBoundingClientRect();
    steerEl.style.left = clamp(x - z.left - R, 0, Math.max(0, z.width - 2 * R)).toFixed(0) + 'px';
    steerEl.style.top = clamp(y - z.top - R, 0, Math.max(0, z.height - 2 * R)).toFixed(0) + 'px';
    steerEl.style.bottom = 'auto';
  }
  steerAt(x, y);
}
function steerAt(x, y) {
  const r = steerEl.getBoundingClientRect(), R = Math.max(1, r.width / 2);
  const dx = x - (r.left + R), dy = y - (r.top + R);
  const v = clamp(dx / R, -1, 1), a = Math.abs(v);
  touchState.steer = a < STEER_DEAD ? 0 : sign(v) * Math.min(1, (a - STEER_DEAD) / (STEER_FULL - STEER_DEAD));
  if (steerKnob) {                                   // 旋钮跟着拇指走，但不出圆
    const lim = Math.max(0, R - steerKnob.offsetWidth / 2 - 2), d = Math.hypot(dx, dy), k = d > lim ? lim / d : 1;
    steerKnob.style.transform = 'translate(' + (dx * k).toFixed(1) + 'px,' + (dy * k).toFixed(1) + 'px)';
  }
  if (steerArrL) steerArrL.classList.toggle('on', touchState.steer < 0);
  if (steerArrR) steerArrR.classList.toggle('on', touchState.steer > 0);
}
function steerRelease() {
  steerId = null; touchState.steer = 0;
  steerZone.classList.remove('dn');
  steerEl.style.left = steerEl.style.top = steerEl.style.bottom = '';   // 摇杆回到原位
  if (steerKnob) steerKnob.style.transform = '';
  if (steerArrL) steerArrL.classList.remove('on');
  if (steerArrR) steerArrR.classList.remove('on');
}
steerZone.addEventListener('touchstart', e => {
  e.preventDefault();
  if (steerId !== null) return;                       // 已经有一根手指在上面了
  const t = e.changedTouches[0];
  steerId = t.identifier; steerZone.classList.add('dn'); steerGrab(t.clientX, t.clientY); audioUnlock();
}, { passive:false });
steerZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === steerId) steerAt(t.clientX, t.clientY);
}, { passive:false });
const steerEnd = e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === steerId) steerRelease();
};
steerZone.addEventListener('touchend', steerEnd, { passive:false });
steerZone.addEventListener('touchcancel', steerEnd, { passive:false });
steerZone.addEventListener('mousedown', e => { e.preventDefault(); steerId = 'mouse'; steerZone.classList.add('dn'); steerGrab(e.clientX, e.clientY); audioUnlock(); });
window.addEventListener('mousemove', e => { if (steerId === 'mouse') steerAt(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (steerId === 'mouse') steerRelease(); });
window.addEventListener('blur', steerRelease);
bindPad('kBrk', () => touchState.brk = true, () => touchState.brk = false);
bindPad('kAtkL',() => Input.atkL = true);
bindPad('kAtkR',() => Input.atkR = true);
bindPad('kNitro',() => Input.nitro = true);
bindPad('kPause',() => togglePause());

function readInput() {
  Input.left  = K('arrowleft')  ? 1 : Math.max(0, -touchState.steer);
  Input.right = K('arrowright') ? 1 : Math.max(0,  touchState.steer);
  Input.gas   = (K('arrowup')    || K('w') || (touchMode && !touchState.brk)) ? 1 : 0;
  Input.brake = (K('arrowdown')  || K('s') || touchState.brk) ? 1 : 0;
  Input.atkLHeld = K('a') || K('j') || K('z');
  Input.atkRHeld = K('d') || K('k') || K('x');
}
function clearEdges() { Input.atkL = false; Input.atkR = false; Input.nitro = false; }
/* ==========================================================================
   4. 像素绘制原语
   所有形状都按「整行填充」画出来，天然没有抗锯齿 —— 硬边缘就是这么来的
   ========================================================================== */
/* 逐级面积平均，开局烤好几档缩图。
   为什么要这个：最近邻缩到 3px 时，是从源图 52 列里挑 3 列画出来 —— 挑中哪几列
   全看四舍五入，一辆橙色巴士可能整个采成挡风玻璃的深蓝色，而且距离每帧在变，
   远处的车会一路闪烁变色。有了 mip，颜色是平均出来的，稳。 */
function mipify(sp) {
  sp.mips = [{ c: sp.c, w: sp.w, h: sp.h }];
  let cur = sp.mips[0];
  while (cur.w > 8 && cur.h > 8) {
    const w = Math.max(1, cur.w >> 1), h = Math.max(1, cur.h >> 1);
    const src = cur.c.getContext('2d').getImageData(0, 0, cur.w, cur.h).data;
    const nx = cur.w / w, ny = cur.h / h;
    const out = mkCanvas(w, h);
    const img = out.g.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let r = 0, g2 = 0, b = 0, a = 0, n = 0;
      const x0 = Math.floor(x * nx), x1 = Math.min(cur.w, Math.max(x0 + 1, Math.floor((x + 1) * nx)));
      const y0 = Math.floor(y * ny), y1 = Math.min(cur.h, Math.max(y0 + 1, Math.floor((y + 1) * ny)));
      for (let v = y0; v < y1; v++) for (let u = x0; u < x1; u++) {
        const i = (v * cur.w + u) * 4, al = src[i + 3] / 255;
        r += src[i] * al; g2 += src[i + 1] * al; b += src[i + 2] * al; a += al; n++;
      }
      const o = (y * w + x) * 4;
      if (n && a > 0) { d[o] = r / a; d[o + 1] = g2 / a; d[o + 2] = b / a; d[o + 3] = (a / n) * 255; }
    }
    out.g.putImageData(img, 0, 0);
    cur = { c: out.c, w, h };
    sp.mips.push(cur);
  }
  return sp;
}

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { c, g, w: c.width, h: c.height };
}
function box(g, x, y, w, h, col) {
  if (w <= 0 || h <= 0) return;
  g.fillStyle = col; g.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0));
}
/* 上下两条边宽度不同的梯形，逐行填 */
function trap(g, y0, y1, l0, r0, l1, r1, col) {
  y0 = Math.round(y0); y1 = Math.round(y1);
  if (y1 <= y0) return;
  g.fillStyle = col;
  for (let y = y0; y < y1; y++) {
    const t = (y - y0) / (y1 - y0);
    const a = Math.round(lerp(l0, l1, t)), b = Math.round(lerp(r0, r1, t));
    if (b > a) g.fillRect(a, y, b - a, 1);
  }
}
function ellipse(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = Math.round(cy - ry); y <= Math.round(cy + ry); y++) {
    const dy = (y - cy) / ry;
    const k = 1 - dy * dy; if (k <= 0) continue;
    const hw = Math.round(rx * Math.sqrt(k));
    if (hw > 0) g.fillRect(Math.round(cx - hw), y, hw * 2, 1);
  }
}
/* 同一个颜色调亮/调暗一档：受光面、转折面、阴影都从底色推出来 */
function shade(hex, amt) {
  const [r, g, b] = hex2rgb(hex);
  const f = amt < 0 ? 1 + amt : 1, t = amt > 0 ? amt : 0;
  const m = v => Math.round(v * f + (255 - v * f) * t);
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}

/* 粗线段（用于电线、链条、栏杆斜撑） */
function line(g, x0, y0, x1, y1, t, col) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;
  g.fillStyle = col;
  for (let i = 0; i <= n; i++) {
    const p = n ? i / n : 0;
    g.fillRect(Math.round(lerp(x0, x1, p)), Math.round(lerp(y0, y1, p)), t, t);
  }
}

/* ==========================================================================
   5. 车手 · 摩托 · 车辆：矢量现画
   不再烤贴图。所有形状在一个「宽 100、脚踩 y=0、头朝 -y」的单位空间里描出来，
   贴到画面上时只是一次 scale —— 所以任意距离都是现算的：
   没有 mipmap、没有采样丢失、不需要最小尺寸下限那种作弊，
   一辆车缩到 6px 也还是一辆车的轮廓，而不是 6 列被挑剩的像素。
   ========================================================================== */
const INK = '#141420';                         // 统一的深色描边
const RIDER_WW = 350;                          // 车加人在世界里有多宽（路面全宽 4000）

/* 圆角矩形 */
function rr(g, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);       g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r);   g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h);       g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r);           g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}
/* 一条闭合折线 */
function poly(g, pts) {
  g.beginPath();
  for (let i = 0; i < pts.length; i += 2) i ? g.lineTo(pts[i], pts[i+1]) : g.moveTo(pts[i], pts[i+1]);
  g.closePath();
}
/* 填一次，再按需描一圈。ink<=0 表示这东西已经小到不该有描边了 */
function paint(g, col, ink, noStroke) {
  g.fillStyle = col; g.fill();
  if (ink > 0 && !noStroke) { g.lineWidth = ink; g.strokeStyle = INK; g.stroke(); }
}
function oval(g, cx, cy, rx, ry) { g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); }

/* ---------- 车手 + 摩托（后视） ----------
   单位空间：宽 100、脚踩 y=0、头朝 -y，整体高约 105。
   排布的要点是躯干只占上半截（-80..-43），底下留给车：整流罩、尾灯、
   排气、后轮都得露出来，否则后视图就成了「一个人站在一堵墙后面」。
   o: { tilt -1..1, atk -1|0|1, wind -1|0|1（蓄力朝哪边）, wep 0拳脚/1棍/2链, brake, hit, cop, flash, nitro } */
function drawRider(g, pal, o, ink) {
  o = o || {};
  const tilt = o.tilt || 0, atk = o.atk || 0, wep = o.wep || 0, hit = !!o.hit;
  const jk = pal.j, jd = pal.j2, hl = pal.h;
  const jkL = shade(jk, .24);
  /* 车架一律深色炭灰，车主的颜色只做一块面板 —— 车壳跟夹克同色的话，
     人和车会糊成一整块，后视图就分不出哪是人哪是车了 */
  const bd = '#262632', bdD = '#191922', bdL = '#3a3a4a', accent = pal.b;

  g.save();
  g.rotate(tilt * .16);                        // 压车：绕轮胎触地点转

  /* 排气：从整流罩底下往两边斜出去 */
  for (const s of [-1, 1]) {
    g.save(); g.scale(s, 1);
    poly(g, [12, -26, 26, -21, 26, -9, 13, -12]);  paint(g, '#9aa2ac', ink);
    poly(g, [12, -26, 18, -24, 18, -11, 13, -12]); paint(g, '#6c747e', 0);
    rr(g, 22, -20, 5, 10, 2.5);                    paint(g, '#33333e', ink * .6);
    g.restore();
  }
  if (o.nitro) {                                 // 氮气尾焰：从两根排气口喷出来
    const f = (frameCount & 3) * .12;
    for (const s of [-1, 1]) {
      oval(g, 25 * s, -12, 8 + f * 10, 10 + f * 12); g.fillStyle = 'rgba(90,190,255,.55)'; g.fill();
      oval(g, 25 * s, -13, 4.5 + f * 5, 6 + f * 6);  g.fillStyle = 'rgba(235,250,255,.95)'; g.fill();
    }
  }
  /* 后轮 */
  rr(g, -11, -30, 22, 30, 9);   paint(g, '#1b1b25', ink);
  rr(g, -6.5, -26, 13, 21, 6);  paint(g, '#30303c', 0);
  for (let i = 0; i < 3; i++) { rr(g, -6.5, -24 + i * 7, 13, 2.4, 1); paint(g, '#131319', 0); }
  /* 车尾整流罩：深色车架 + 一块车主配色的面板 */
  poly(g, [-13, -47, 13, -47, 9, -13, -9, -13]);   paint(g, bd, ink);
  poly(g, [-13, -47, -5, -47, -3.5, -13, -9, -13]); paint(g, bdD, 0);
  poly(g, [-10, -45, 10, -45, 7.5, -26, -7.5, -26]); paint(g, accent, ink * .6);
  poly(g, [4, -44, 9, -44, 7, -28, 3.5, -28]);      paint(g, shade(accent, .3), 0);
  /* 尾灯：坐垫下面那一道，躯干够不着，所以永远看得见 */
  rr(g, -8, -36, 16, 9, 3.5);
  paint(g, o.brake ? '#ff6a55' : '#d8281c', ink * .8);
  rr(g, -5, -34, 10, 5, 2.2);  paint(g, o.brake ? '#ffe4d8' : '#ff9484', 0);
  rr(g, -11, -50, 22, 8, 3.5); paint(g, '#17171f', ink * .7);      // 座垫
  if (o.cop) {                                   // 警灯：红蓝轮闪
    rr(g, -16, -58, 14, 8, 3); paint(g, o.flash ? '#4a68ff' : '#242038', ink * .6);
    rr(g, 2, -58, 14, 8, 3);   paint(g, o.flash ? '#3a1620' : '#ff3020', ink * .6);
  }

  /* 腿：跨在油箱两侧，膝盖朝外 */
  const kick = (atk && wep === 0) ? atk : 0;
  const cock = (!atk && o.wind && wep === 0) ? o.wind : 0;   // 蓄力：腿收起来，膝盖顶高
  for (const s of [-1, 1]) {
    g.save(); g.scale(s, 1);
    if (cock === s) {
      poly(g, [7, -50, 24, -62, 30, -52, 10, -40]);  paint(g, jd, ink);
      rr(g, 22, -64, 13, 12, 4.5);                   paint(g, '#191922', ink);
    } else if (kick === s) {                     // 踹出去的那条
      poly(g, [7, -48, 34, -36, 37, -25, 9, -31]);   paint(g, jd, ink);
      poly(g, [11, -44, 31, -34, 32, -29, 12, -35]); paint(g, shade(jd, .2), 0);
      rr(g, 31, -37, 14, 12, 4.5);                   paint(g, '#191922', ink);
    } else {
      poly(g, [7, -50, 22, -45, 20, -18, 9, -16]);   paint(g, jd, ink);
      poly(g, [12, -43, 21, -40, 19.5, -22, 13, -21]); paint(g, shade(jd, .22), 0);
      rr(g, 7, -18, 15, 16, 5);                      paint(g, '#191922', ink);
    }
    g.restore();
  }

  /* 躯干：只到 -43，底下让给车 */
  const slump = hit ? 5 : 0;
  poly(g, [-14.5, -80 + slump, 14.5, -80 + slump, 8.5, -44, -8.5, -44]);  paint(g, jk, ink);
  poly(g, [-14.5, -80 + slump, -5.5, -80 + slump, -3.5, -44, -8.5, -44]); paint(g, jd, 0);
  poly(g, [6.5, -77 + slump, 13.5, -77 + slump, 8.5, -53, 4.5, -53]);     paint(g, jkL, 0);
  rr(g, -12.5, -76 + slump, 25, 3.5, 1.6); paint(g, shade(jk, -.32), 0);   // 肩缝
  rr(g, -9, -60, 18, 5.5, 2.5);          paint(g, hl, 0);                // 背后那道横条

  /* 手臂 */
  const sh = -74 + slump;
  if (!atk && o.wind && wep > 0) {                // 蓄力：家伙举过头顶
    const s = o.wind;
    g.save(); g.scale(s, 1);
    poly(g, [11, sh, 20, sh - 22, 28, sh - 20, 16, sh + 8]);  paint(g, jk, ink);
    if (wep === 1) { g.save(); g.translate(24, sh - 22); g.rotate(-.5);
                     rr(g, -4.5, -30, 9, 32, 3.5); paint(g, '#a8763c', ink); g.restore(); }
    else if (wep === 3) {                          // 双节棍：一节握在手里举起来，另一节垂着晃
      g.save(); g.translate(24, sh - 22); g.rotate(-.35); rr(g, -3.5, -24, 7, 24, 3); paint(g, '#26262e', ink); g.restore();
      for (let i = 0; i < 3; i++) { oval(g, 21 + i * 3.5, sh - 47 + i * 4.5, 2.2, 2.2); paint(g, '#b8bcc4', 0); }
      g.save(); g.translate(33, sh - 36); g.rotate(.55); rr(g, -3.5, 0, 7, 24, 3); paint(g, '#26262e', ink); g.restore();
    }
    else if (wep === 4) {                          // 撬棍：抡过头顶，弯钩朝后
      g.save(); g.translate(24, sh - 22); g.rotate(-.7);
      rr(g, -3, -34, 6, 38, 2.5); paint(g, '#4a525c', ink);
      poly(g, [-3, -34, -12, -42, -9, -46, 3, -36]); paint(g, '#c02820', ink);
      g.restore();
    }
    else { for (let i = 0; i < 6; i++) { oval(g, 26 - i * 2.5, sh - 26 - i * 6.5, 3.6, 3.6);
                                        paint(g, i === 5 ? '#d8dce4' : '#98a0aa', 0); } }
    rr(g, 18, sh - 28, 12, 10, 3.5); paint(g, '#191922', ink);
    g.restore();
    g.save(); g.scale(-s, 1);
    poly(g, [11, sh, 26, sh + 8, 29, sh + 18, 13, sh + 13]);   paint(g, jk, ink);
    rr(g, 21, sh + 15, 14, 9, 3.5); paint(g, '#191922', ink);
    g.restore();
  } else if (atk && wep > 0) {
    const s = atk;
    g.save(); g.scale(s, 1);
    poly(g, [11, sh, 35, sh + 3, 37, sh + 13, 12, sh + 12]);  paint(g, jk, ink);
    if (wep === 1) { rr(g, 34, sh, 24, 9, 3.5);  paint(g, '#a8763c', ink);
                     rr(g, 52, sh - 2, 9, 13, 3.5); paint(g, '#6a4620', ink); }
    else if (wep === 3) {
      rr(g, 33, sh + 2, 17, 7, 3); paint(g, '#26262e', ink);
      for (let i = 0; i < 3; i++) { oval(g, 52 + i * 4, sh + 5 + i * 2, 2.2, 2.2); paint(g, '#b8bcc4', 0); }
      g.save(); g.translate(63, sh + 10); g.rotate(.8); rr(g, -3, -3.5, 19, 7, 3); paint(g, '#26262e', ink); g.restore();
    }
    else if (wep === 4) {
      rr(g, 33, sh + 3, 36, 6, 2.5); paint(g, '#4a525c', ink);
      poly(g, [67, sh + 3, 74, sh - 7, 78, sh - 4, 71, sh + 9]); paint(g, '#c02820', ink);
    }
    else { for (let i = 0; i < 6; i++) { oval(g, 36 + i * 7, sh + 6 + (i & 1) * 5, 3.6, 3.6);
                                        paint(g, i === 5 ? '#d8dce4' : '#98a0aa', 0); } }
    g.restore();
    g.save(); g.scale(-s, 1);
    poly(g, [11, sh, 25, sh + 8, 28, sh + 18, 13, sh + 13]);  paint(g, jk, ink);
    rr(g, 21, sh + 14, 13, 9, 3.5);  paint(g, '#191922', ink);
    g.restore();
  } else if (hit) {
    for (const s of [-1, 1]) { g.save(); g.scale(s, 1);
      poly(g, [11, sh - 2, 33, sh - 10, 35, sh, 12, sh + 9]);  paint(g, jk, ink);
      g.restore(); }
  } else {
    for (const s of [-1, 1]) {
      g.save(); g.scale(s, 1);
      poly(g, [11, sh, 26, sh + 8, 29, sh + 18, 13, sh + 13]);   paint(g, jk, ink);
      poly(g, [14, sh + 3, 24, sh + 9, 25, sh + 14, 16, sh + 11]); paint(g, jkL, 0);
      rr(g, 27, sh + 10, 8, 4, 2);   paint(g, '#6a7280', ink * .6);   // 把手末端
      rr(g, 21, sh + 15, 14, 9, 3.5); paint(g, '#191922', ink);       // 手套
      g.restore();
    }
  }

  /* 头盔 */
  const hx = hit ? (tilt > 0 ? -8 : 8) : 0, hy = -92 + slump;
  oval(g, hx, hy, 12.5, 13);     paint(g, hl, ink);
  g.beginPath(); g.ellipse(hx, hy, 12.5, 13, 0, PI * .04, PI * .96); g.closePath();
  paint(g, shade(hl, -.36), 0);
  oval(g, hx - 3.5, hy - 4.5, 6, 4.6);  paint(g, shade(hl, .36), 0);
  rr(g, hx - 10.5, hy + 1, 21, 8, 3);   paint(g, o.cop ? '#c02020' : '#15151f', 0);  // 镜片带
  rr(g, hx - 5, hy + 11.5, 10, 6, 2.5); paint(g, '#c89870', 0);                      // 露出的脖子
  g.restore();
}

/* ---------- 摔出去的人 ---------- */
function drawTumble(g, pal, t, ink) {
  const jk = pal.j, jd = pal.j2, hl = pal.h;
  g.save();
  g.translate(0, -30);
  g.rotate(t * TAU);
  const curl = .55 + .45 * Math.abs(Math.cos(t * TAU));
  for (const s of [-1, 1]) { g.save(); g.scale(s, 1);
    poly(g, [4, 6 * curl, 24, 14 * curl, 26, 24 * curl, 6, 20 * curl]); paint(g, jd, ink);  // 腿
    rr(g, 21, 18 * curl, 12, 9, 4); paint(g, '#1a1a24', ink);
    poly(g, [5, -12, 26, -20 * curl, 28, -10 * curl, 7, -3]); paint(g, jk, ink);            // 臂
    g.restore(); }
  oval(g, 0, 0, 16, 21);       paint(g, jk, ink);
  oval(g, -5, -5, 8, 10);      paint(g, shade(jk, .2), 0);
  rr(g, -14, 6, 28, 6, 3);     paint(g, jd, 0);
  oval(g, -1, -26, 12.5, 12.5); paint(g, hl, ink);
  oval(g, -4, -30, 6, 4.5);    paint(g, shade(hl, .32), 0);
  g.restore();
}

/* ---------- 侧滑停下的车 ---------- */
function drawWreck(g, pal, ink) {
  const bd = pal.b;
  poly(g, [-46, -30, 30, -34, 46, -14, -44, -8]);  paint(g, bd, ink);
  poly(g, [-46, -30, -6, -32, -4, -10, -44, -8]);  paint(g, shade(bd, -.3), 0);
  rr(g, -44, -26, 12, 8, 3);   paint(g, '#d8281c', ink * .7);
  for (const x of [-24, 22]) { oval(g, x, -14, 15, 15); paint(g, '#1c1c26', ink);
                               oval(g, x, -14, 6, 6);   paint(g, '#9aa2ac', 0); }
  rr(g, 30, -36, 16, 5, 2.5);  paint(g, '#9aa2ac', ink * .7);
}

/* ---------- 徒步跑回车边的自己 ---------- */
function drawRunner(g, pal, f, ink) {
  const jk = pal.j, jd = pal.j2, hl = pal.h;
  const sw = f === 1 ? 1 : (f === 2 ? -1 : 0);
  for (const s of [-1, 1]) {
    const st = sw * s;
    g.save(); g.scale(s, 1);
    poly(g, [3, -30, 15, -30, 13 + st * 8, -6, 3 + st * 8, -6]);  paint(g, jd, ink);   // 腿：左右错开
    rr(g, 1 + st * 8, -9, 15, 8, 3.5);  paint(g, '#191922', ink);
    poly(g, [3, -54 + st * 5, 16, -52 + st * 8, 15, -34 + st * 8, 5, -34]); paint(g, jk, ink);  // 臂
    g.restore();
  }
  poly(g, [-16, -58, 16, -58, 12, -28, -12, -28]);  paint(g, jk, ink);
  poly(g, [-16, -58, -6, -58, -5, -28, -12, -28]);  paint(g, jd, 0);
  oval(g, 0, -68, 11.5, 12);   paint(g, hl, ink);
  oval(g, -3, -72, 5.5, 4);    paint(g, shade(hl, .34), 0);
  rr(g, -9, -65, 18, 7, 3);    paint(g, '#15151f', 0);
}

/* ---------- 掉在地上的武器 ---------- */
function drawPickup(g, wep, ink) {
  if (wep === 1) { rr(g, -34, -16, 54, 12, 5); paint(g, '#a8763c', ink);
                   rr(g, 12, -19, 18, 18, 6);  paint(g, '#6a4620', ink); }
  else if (wep === 3) { rr(g, -34, -15, 26, 10, 4); paint(g, '#26262e', ink); rr(g, 8, -13, 26, 10, 4); paint(g, '#26262e', ink);
                        for (let i = 0; i < 3; i++) { oval(g, -4 + i * 4.5, -10 + (i & 1) * 2, 2.6, 2.6); paint(g, '#c8ccd4', 0); } }
  else if (wep === 4) { rr(g, -36, -13, 58, 9, 3.5); paint(g, '#4a525c', ink);
                        poly(g, [20, -13, 30, -25, 36, -21, 25, -4]); paint(g, '#c02820', ink); }
  else { for (let i = 0; i < 7; i++) { oval(g, -30 + i * 10, -10 + (i & 1) * 6, 6.5, 6.5);
                                       paint(g, i === 6 ? '#d8dce4' : '#98a0aa', ink * .6); } }
}

/* ---------- 车辆 ----------
   在宽 100、脚踩 y=0 的空间里画；spec.hh 是车高（同一单位） */
/* 集装箱卡车：从后面看就是一整面箱门，从前面看是车头顶着高出一截的箱子 */
function drawRig(g, spec, front, ink, night) {
  const H2 = spec.hh, col = spec.col, dk = shade(col, -.36), lt = shade(col, .22);
  for (const x of [-46, -30, 16, 32]) { rr(g, x, -15, 14, 15, 5); paint(g, '#1a1a24', ink); }
  if (front) {
    rr(g, -44, -H2, 88, H2 * .34, 3); paint(g, col, ink);                        // 车头上面露出来的箱顶
    for (let x = -38; x < 40; x += 8) { rr(g, x, -H2 + 4, 2, H2 * .26, 1); paint(g, dk, 0); }
    rr(g, -47, -H2 * .68, 94, H2 * .62, 8); paint(g, '#d8d4c8', ink);          // 驾驶室
    rr(g, -47, -H2 * .68, 14, H2 * .62, 8); paint(g, '#a8a498', 0);
    rr(g, -40, -H2 * .62, 80, H2 * .22, 4); paint(g, '#1b2436', ink * .7);     // 挡风玻璃
    rr(g, -36, -H2 * .60, 40, H2 * .06, 2); paint(g, '#40608a', 0);
    rr(g, -20, -H2 * .34, 40, H2 * .18, 3); paint(g, '#3a3e48', ink * .7);     // 格栅
    for (const s of [-1, 1]) { rr(g, s > 0 ? 26 : -44, -H2 * .30, 18, 11, 4); paint(g, '#fff6cc', ink * .8); }
  } else {
    rr(g, -50, -H2, 100, H2 - 12, 3); paint(g, col, ink);                        // 箱门
    for (let x = -44; x < 46; x += 7) { rr(g, x, -H2 + 5, 2, H2 - 22, 1); paint(g, dk, 0); }
    rr(g, -50, -H2, 100, 4, 2); paint(g, lt, 0);
    rr(g, -1.5, -H2 + 3, 3, H2 - 18, 1); paint(g, shade(col, -.55), 0);        // 两扇门的缝
    for (const x of [-22, -12, 10, 20]) { rr(g, x, -H2 + 6, 3, H2 - 24, 1.5); paint(g, '#b8bcc4', 0); }   // 锁杆
    rr(g, -48, -16, 96, 5, 2); paint(g, '#5a616c', 0);                          // 防钻撞杠
    for (const s of [-1, 1]) { rr(g, s > 0 ? 34 : -46, -24, 12, 7, 3); paint(g, '#d8281c', ink * .8); }
  }
  if (night) {
    g.globalAlpha = .3;
    for (const s of [-1, 1]) { oval(g, s * 36, front ? -H2 * .25 : -21, 24, 16); paint(g, front ? '#ffe8a0' : '#ff3020', 0); }
    g.globalAlpha = 1;
  }
}
function drawCar(g, spec, front, ink, night) {
  if (spec.type === 'rig') { drawRig(g, spec, front, ink, night); return; }
  const H2 = spec.hh, bodyY = -H2 * spec.body, roofY = -H2;
  const col = spec.col, dk = shade(col, -.34), lt = shade(col, .2);
  const glass = '#1b2436', glassL = '#40608a';
  const rw = spec.type === 'car' ? 40 : 47;

  for (const x of [-38, 24]) { rr(g, x, -15, 14, 15, 5); paint(g, '#1a1a24', ink); }   // 轮子
  // 车厢
  poly(g, [-rw + 4, roofY, rw - 4, roofY, rw, bodyY, -rw, bodyY]);  paint(g, col, ink);
  poly(g, [-rw + 4, roofY, -rw + 14, roofY, -rw + 10, bodyY, -rw, bodyY]); paint(g, dk, 0);
  // 玻璃
  const gw = rw - 9;
  poly(g, [-gw + 3, roofY + H2 * .09, gw - 3, roofY + H2 * .09, gw - 1, bodyY - H2 * .07, -gw + 1, bodyY - H2 * .07]);
  paint(g, glass, ink * .7);
  poly(g, [-gw + 5, roofY + H2 * .11, gw - 8, roofY + H2 * .11, gw - 7, roofY + H2 * .2, -gw + 4, roofY + H2 * .2]);
  paint(g, glassL, 0);
  if (spec.type === 'bus') for (let i = 0; i < 4; i++) {
    rr(g, -rw + 5 + i * (rw * 2 - 10) / 4, roofY + H2 * .1, (rw * 2 - 10) / 4 - 3, H2 * .3, 2);
    paint(g, glass, 0);
  }
  // 车身
  rr(g, -50, bodyY, 100, -bodyY - 2, 7);  paint(g, col, ink);
  rr(g, -50, bodyY, 16, -bodyY - 2, 7);   paint(g, dk, 0);
  rr(g, -46, bodyY + 3, 92, 4, 2);        paint(g, lt, 0);
  // 灯
  const ly = bodyY + Math.abs(bodyY) * .28;
  for (const s of [-1, 1]) {
    g.save(); g.scale(s, 1);
    rr(g, 22, ly - 7, 22, 14, 5);
    paint(g, front ? '#fff6cc' : '#d8281c', ink * .8);
    rr(g, 26, ly - 4, 14, 8, 3);
    paint(g, front ? '#ffffff' : '#ff9484', 0);
    g.restore();
  }
  if (front) { rr(g, -16, ly - 6, 32, 12, 3); paint(g, '#1a1a24', ink * .7); }
  else { rr(g, -15, ly - 5, 30, 10, 2); paint(g, '#c8c4b8', ink * .7); }
  rr(g, -44, -10, 88, 5, 2);  paint(g, '#5a616c', 0);                 // 保险杠
  if (spec.taxi) { rr(g, -14, roofY - 11, 28, 11, 4); paint(g, '#f0b820', ink);
                   rr(g, -10, roofY - 8, 20, 5, 2);   paint(g, '#f4ecc0', 0); }
  if (night) {                                                        // 夜里灯有一圈晕
    g.globalAlpha = .3;
    for (const s of [-1, 1]) { oval(g, s * 33, ly, 26, 18);
      paint(g, front ? '#ffe8a0' : '#ff3020', 0); }
    g.globalAlpha = 1;
  }
}

const RIG_SPECS = ['#b83a28', '#2a58a0', '#2e7a5a', '#d88a18', '#8a2a4a'].map(col => ({ hh:118, body:1, type:'rig', col, ww:940 }));
/* 这条街的车流按主题配：港口一半是集装箱卡车 */
function pickCarSpec(rnd) {
  const t = Road.theme;
  if (t && t.rigs && rnd() < t.rigs) return RIG_SPECS[(rnd() * RIG_SPECS.length) | 0];
  return CAR_SPECS[(rnd() * CAR_SPECS.length) | 0];

    }
}
