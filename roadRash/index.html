   21. 比赛流程
   ========================================================================== */
const Game = {
  state:'title',            // title | shop | pre | race | down | over | results | busted
  track:0, money:0, bike:0, owned:[true, false, false, false],
  time:0, pre:0, crashes:0, hits:0, takedowns:0, copDone:false,
  order:[], paused:false, muted:false, best:[null,null,null,null,null],
};
/* 名次奖：只有冲在前面才拿得到大头。 */
const PRIZE = [ [1500,850,450,180,120,80,40,0], [2200,1250,650,260,170,110,60,0],
                [3000,1700,900,360,240,160,80,0], [3800,2150,1150,460,300,200,100,0],
                [5000,2800,1500,600,400,260,130,0] ];
/* 完赛费：只要过线就有，跟名次无关。
   没有这一档的时候，第一场跑砸就等于出局 —— 前四之外一分钱没有，换不了车，
   换不了车就永远跑不进前四，后面每一场都是 $0。那不是难，是死角。
   现在垫底也能拿一场的完赛费，跑三场就够换第二台车：输了只是慢，不是断。 */
const FINISH_FEE = [380, 480, 600, 750, 900];

const $ = id => document.getElementById(id);
const hudEl = $('hud'), sheetEl = $('sheet'), cardEl = $('cardBody'), toastEl = $('toast');

function toast(txt, warn) {
  toastEl.textContent = txt;
  toastEl.className = warn ? 'warn' : '';
  void toastEl.offsetWidth;                       // 重启动画
  toastEl.classList.add('show');
  if (warn) toastEl.classList.add('warn');
}
function updateHpHud() {
  const f = $('dmgFill'), p = clamp(Player.hp / Player.maxHp, 0, 1);
  f.style.width = (p * 100).toFixed(1) + '%';
  f.className = p < .3 ? 'low' : p < .6 ? 'mid' : '';
}
function updateWepHud() {

}
function copHud(t, on) {
  const b = $('copBar');
  b.style.opacity = t > .02 ? String(clamp(t + .2, 0, 1)) : '0';

}

function computeRank() {
  const all = [Player, ...Rivals];
  all.sort((a, b) => (b.done ? 1e12 - b.doneT : b.z) - (a.done ? 1e12 - a.doneT : a.z));
  for (let i = 0; i < all.length; i++) all[i].rank = i + 1;
  return all;
}

function resetPlayerForRace() {
  const B = BIKES[Game.bike], P = Player;
  P.maxSpeed = B.top; P.acc = B.acc; P.hand = B.hand; P.arm = B.arm;
  P.maxHp = 100; P.hp = 100; P.wep = 0;
  P.z = 0; P.x = 0; P.speed = 0; P.y = 0; P.vy = 0; P.lastGroundY = 0; P.airTime = 0; P.air = 0;
  P.state = 'ride'; P.lean = 0; P.steer = 0; P.atkT = 0; P.atkCd = 0; P.stun = 0; P.hitFlash = 0;
  P.done = false; P.doneT = 0; P.rank = 8; P.brake = false; P.downT = 0;
  PlayerWreck = null; Pickups.length = 0;
  Cam.x = 0; Cam.shakeT = 0; Cam.look = 0;
}

function startRace(idx) {
  Game.track = idx; Game.time = 0; Game.crashes = 0; Game.hits = 0;
  Game.takedowns = 0; Game.copDone = false; Cop = null;
  buildTrack(idx); prepFog();
  Road.bgX = 0;
  Road.starRng = new Float32Array(92);
  { const r = makeRng(77 + idx); for (let i = 0; i < 92; i++) Road.starRng[i] = r(); }
  Road.finishZ = (Road.segs.length - 60) * SEG_LEN;
  resetPlayerForRace();
  spawnRivals(idx);
  spawnTraffic(idx);

function restartRace() { if (Game.state === 'race' || Game.state === 'down') startRace(Game.track); }

function finishRace() {
  Player.done = true; Player.doneT = Game.time;
  const all = computeRank();
  const place = Player.rank;

  Game.money += prize;

function busted() {

    '<h1>被 逮 了</h1><div class="sub">BUSTED</div>' +

    '<p>下次看见警灯就变道甩开 —— 或者一棍把他抡下去。</p>' +
    '<div class="btn" data-act="retry">再 来 一 次</div>' +

let sheetAction = null;
function showSheet(html, onConfirm) {
  cardEl.innerHTML = html;
  sheetEl.classList.remove('off');
  sheetAction = onConfirm || null;
  cardEl.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); audioUnlock(); doAct(el.dataset.act, el.dataset.arg); });
  });
}
function hideSheet() { sheetEl.classList.add('off'); sheetAction = null; }
function sheetConfirm() {
  if (sheetEl.classList.contains('off')) return;
  const b = cardEl.querySelector('[data-act]');
  if (b) doAct(b.dataset.act, b.dataset.arg);
}
function doAct(act, arg) {
  if (act === 'resume') { if (Game.paused) togglePause(); }
  else if (act === 'start') { showShop(); }
  else if (act === 'race') { startRace(Game.track); }
  else if (act === 'retry') { Game.paused = false; musicDuck(false); startRace(Game.track); }
  else if (act === 'shop') { showShop(); }
  else if (act === 'next') { Game.track = Math.min(4, Game.track + 1); showShop(); }
  else if (act === 'buy') { buyBike(+arg); }
  else if (act === 'sel') { if (Game.owned[+arg]) { Game.bike = +arg; sfx('pickup'); showShop(); } }
  else if (act === 'title') { showTitle(); }
  else if (act === 'reset') { Game.money = 0; Game.bike = 0; Game.owned = [true,false,false,false]; Game.track = 0; showShop(); }
}

function showTitle() {
  Game.state = 'title';
  hudEl.classList.add('off');
  musicSet('menu');

/* ==========================================================================
   23. 声音 —— 全部 Web Audio 现场合成，仓库里没有一个音频文件
   ========================================================================== */
let AC = null, master = null, noiseBuf = null;
let engA = [], engFilt = null, engGain = null, windSrc = null, windGain = null, windFilt = null;
let musicGain = null, sfxGain = null;

function makeNoise(sec) {
  const n = Math.floor(AC.sampleRate * sec), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function audioUnlock() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = Game.muted ? 0 : .85; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = .30; musicGain.connect(master);
  sfxGain   = AC.createGain(); sfxGain.gain.value = .85;  sfxGain.connect(master);
  noiseBuf = makeNoise(2);

  // 引擎：三只失谐锯齿波 + 一枚低通，转速直接映到频率
  engGain = AC.createGain(); engGain.gain.value = 0; engGain.connect(master);
  engFilt = AC.createBiquadFilter(); engFilt.type = 'lowpass';
  engFilt.frequency.value = 700; engFilt.Q.value = 4; engFilt.connect(engGain);
  for (const d of [0, 7, -5, 12]) {
    const o = AC.createOscillator(); o.type = d === 12 ? 'square' : 'sawtooth';
    o.frequency.value = 60; o.detune.value = d * 6;
    const g = AC.createGain(); g.gain.value = d === 12 ? .18 : .34;
    o.connect(g); g.connect(engFilt); o.start();
    engA.push(o);
  }
  // 风噪
  windSrc = AC.createBufferSource(); windSrc.buffer = noiseBuf; windSrc.loop = true;
  windFilt = AC.createBiquadFilter(); windFilt.type = 'bandpass';
  windFilt.frequency.value = 700; windFilt.Q.value = .7;
  windGain = AC.createGain(); windGain.gain.value = 0;
  windSrc.connect(windFilt); windFilt.connect(windGain); windGain.connect(master);
  windSrc.start();
  musicNext = AC.currentTime + .05;
}
function toggleMute() {
  Game.muted = !Game.muted;
  if (master) master.gain.setTargetAtTime(Game.muted ? 0 : .85, AC.currentTime, .02);
  toast(Game.muted ? '静音' : '开声');
}
function musicDuck(on) { if (musicGain) musicGain.gain.setTargetAtTime(on ? .06 : .30, AC.currentTime, .05); }

/* 引擎随速度换挡：转速到顶就掉一截，跟真车一样一格一格往上爬 */
const GEARS = 6;
function updateEngine(dt) {
  if (!AC) return;
  const P = Player, on = (Game.state === 'race' || Game.state === 'pre' || Game.state === 'down');
  if (!on) { engGain.gain.setTargetAtTime(0, AC.currentTime, .08); windGain.gain.setTargetAtTime(0, AC.currentTime, .1); return; }
  const sp = clamp(P.speed / P.maxSpeed, 0, 1);
  const g = Game.gear - 1;
  const rpm = clamp(sp * GEARS - g, 0, 1);
  const idle = (Game.state === 'pre' && Input.gas) ? .55 : 0;
  const base = 52 + (rpm * .82 + idle) * 118 + g * 5;
  const t = AC.currentTime;
  for (let i = 0; i < engA.length; i++)
    engA[i].frequency.setTargetAtTime(base * (i === 3 ? 2 : 1), t, .035);
  engFilt.frequency.setTargetAtTime(420 + sp * 2400 + (Input.gas ? 500 : 0), t, .05);
  engGain.gain.setTargetAtTime(.13 + sp * .12, t, .06);
  windGain.gain.setTargetAtTime(sp * sp * .17, t, .12);
  windFilt.frequency.setTargetAtTime(500 + sp * 1500, t, .12);
}

/* ---------- 一次性音效 ---------- */
function env(node, t0, a, d, peak) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + a);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + a + d);
  node.connect(g); return g;
}
function noiseBurst(t0, dur, type, freq, Q, peak, out) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  s.playbackRate.value = .8 + Math.random() * .5;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = Q;
  s.connect(f);
  const g = env(f, t0, .004, dur, peak);
  g.connect(out || sfxGain);
  s.start(t0); s.stop(t0 + dur + .05);
  return f;
}
function tone(t0, f0, f1, dur, type, peak, out) {
  const o = AC.createOscillator(); o.type = type || 'square';
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = env(o, t0, .006, dur, peak);
  g.connect(out || sfxGain);
  o.start(t0); o.stop(t0 + dur + .05);
  return o;
}
function sfx(name, vol) {
  if (!AC || Game.muted) return;
  const t = AC.currentTime, v = vol == null ? 1 : vol;
  switch (name) {
    case 'kick':  noiseBurst(t, .09, 'bandpass', 900, 1.4, .30 * v); tone(t, 150, 70, .09, 'sine', .22 * v); break;
    case 'club':  noiseBurst(t, .07, 'bandpass', 480, 2.2, .34 * v); tone(t, 180, 60, .13, 'triangle', .30 * v); break;
    case 'chain': for (let i = 0; i < 4; i++) tone(t + i * .018, 1400 + i * 340, 900, .06, 'square', .10 * v); break;
    case 'hit':   noiseBurst(t, .13, 'lowpass', 1600, 1, .42 * v); tone(t, 260, 55, .16, 'sine', .34 * v); break;
    case 'hurt':  noiseBurst(t, .2, 'lowpass', 900, 1, .40 * v); tone(t, 180, 48, .24, 'sawtooth', .22 * v); break;
    case 'whiff': noiseBurst(t, .13, 'bandpass', 2600, .8, .10 * v); break;
    case 'crash': noiseBurst(t, .55, 'lowpass', 2600, .6, .55 * v);
                  tone(t, 120, 32, .5, 'sawtooth', .34 * v);
                  for (let i = 0; i < 7; i++) noiseBurst(t + .02 + i * .045, .1, 'bandpass', 1800 + Math.random() * 2400, 3, .16 * v);
                  break;
    case 'scrape':noiseBurst(t, .1, 'bandpass', 3400, 6, .13 * v); break;
    case 'cone':  tone(t, 620, 240, .1, 'square', .2 * v); noiseBurst(t, .08, 'highpass', 2200, 1, .16 * v); break;
    case 'land':  noiseBurst(t, .11, 'lowpass', 700, 1, .3 * v); tone(t, 90, 40, .12, 'sine', .26 * v); break;
    case 'horn':  tone(t, 420, 400, .42, 'square', .09 * v); tone(t + .005, 528, 500, .42, 'square', .07 * v); break;
    case 'siren': for (let i = 0; i < 6; i++) tone(t + i * .28, i & 1 ? 760 : 520, i & 1 ? 760 : 520, .26, 'square', .11 * v); break;
    case 'bust':  for (let i = 0; i < 4; i++) tone(t + i * .3, i & 1 ? 800 : 540, i & 1 ? 800 : 540, .28, 'square', .16);
                  noiseBurst(t, .4, 'lowpass', 1200, 1, .34); break;
    case 'pickup':tone(t, 520, 1040, .12, 'square', .18 * v); tone(t + .06, 780, 1560, .1, 'square', .14 * v); break;
    case 'buy':   [523, 659, 784, 1046].forEach((f, i) => tone(t + i * .07, f, f, .12, 'square', .15)); break;
    case 'win':   [392, 523, 659, 784, 1046].forEach((f, i) => tone(t + i * .11, f, f, .3, 'square', .17)); break;
    case 'lose':  [392, 349, 294, 233].forEach((f, i) => tone(t + i * .15, f, f, .3, 'sawtooth', .15)); break;
    case 'beep':  tone(t, 660, 660, .14, 'square', .22); break;
    case 'go':    tone(t, 990, 990, .34, 'square', .26); tone(t, 1320, 1320, .34, 'square', .14); break;
    case 'start': tone(t, 70, 190, .5, 'sawtooth', .2); break;
  }
}

/* ---------- 背景乐：前瞻调度的 16 分音符序列 ---------- */
let musicNext = 0, musicStep = 0, musicMode = 'menu';
const BPM = 152;
const nt = n => 110 * Math.pow(2, n / 12);
// Am - F - G - Em，每小节一个和弦
const PROG = [0, -4, -2, 7];
const BASS = [0,0,12,0, 0,7,0,3, 0,0,12,7, 0,3,7,10];
const LEAD = [12,15,19,15, 22,19,15,12, 12,15,19,22, 24,22,19,15];
function musicSet(m) { musicMode = m; }
function musicTick() {
  if (!AC || Game.muted) return;
  const spb = 60 / BPM / 4;
  while (musicNext < AC.currentTime + .14) {
    playStep(musicStep, musicNext);
    musicStep = (musicStep + 1) % 64;
    musicNext += spb;
  }
}
function playStep(s, t) {
  const race = musicMode === 'race' && (Game.state === 'race' || Game.state === 'pre' || Game.state === 'down');
  const bar = (s >> 4) & 3, k = s & 15;
  const root = PROG[bar];
  if (race) {
    // 鼓
    if (k === 0 || k === 6 || k === 8 || k === 14) { tone(t, 150, 45, .12, 'sine', .5, musicGain); }
    if (k === 4 || k === 12) { noiseBurst(t, .11, 'highpass', 1400, .8, .30, musicGain); tone(t, 220, 160, .06, 'triangle', .16, musicGain); }
    if (k % 2 === 0) noiseBurst(t, .028, 'highpass', 7000, 1, .075, musicGain);
    // 贝斯
    const b = BASS[k];
    tone(t, nt(root + b - 12), nt(root + b - 12), .12, 'sawtooth', .30, musicGain);
    // 主旋律：每两小节冒一次头
    if (bar % 2 === 1 && k % 2 === 0) {
      const l = LEAD[k];
      tone(t, nt(root + l), nt(root + l), .1, 'square', .09, musicGain);
    }
  } else {
    if (k === 0) tone(t, nt(root - 12), nt(root - 12), .5, 'triangle', .16, musicGain);
    if (k === 8) tone(t, nt(root - 5), nt(root - 5), .4, 'triangle', .12, musicGain);
    if (k === 0 || k === 8) noiseBurst(t, .04, 'highpass', 6000, 1, .05, musicGain);
  }
}
/* ==========================================================================
   24. 每帧把动态物件挂到所在路段上，渲染才知道谁在谁前面
   ========================================================================== */
const bucketed = [];
function bucketActors() {
  for (let i = 0; i < bucketed.length; i++) bucketed[i].actors.length = 0;
  bucketed.length = 0;
  const camZ = Player.z - PLAYER_Z, far = camZ + DRAW_DIST * SEG_LEN;
  const put = a => {
    if (!a || a.z < camZ - SEG_LEN * 2 || a.z > far) return;
    const s = segAt(a.z);
    if (!s.actors.length) bucketed.push(s);
    s.actors.push(a);
  };
  for (const c of Traffic) put(c);
  for (const p of Pickups) put(p);
  for (const r of Rivals) put(r);
  if (Cop) put(Cop);
  put(PlayerWreck);
  put(Player);                                     // 最后放，保证压在同段其他人上面
}

   25. 每帧更新
   ========================================================================== */
let hudCache = {};
function setTxt(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }

function updateHud() {
  const P = Player;
  const pn = $('posNum');
  const s = String(P.rank) + '<small>/8</small>';
  if (hudCache.pos !== s) { hudCache.pos = s; pn.innerHTML = s; }

  setTxt('clock', fmtTime(Game.time));

  setTxt('spdNum', String(kmh));

  if (sn.className !== cls) sn.className = cls;

}

function update(dt) {
  readInput();

  if (Game.state === 'pre') {
    const before = Math.ceil(Game.pre - .4);
    Game.pre -= dt;
    const after = Math.ceil(Game.pre - .4);
    if (after !== before) {
      if (after >= 1 && after <= 3) { toast(String(after)); sfx('beep'); }
      else if (after <= 0) { toast('冲！'); sfx('go'); }
    }
    if (Game.pre <= 0) { Game.state = 'race'; }
    Player.speed = 0;
    // 起跑前对手在原地热身
    for (const r of Rivals) { r.lean = Math.sin(frameCount * .1 + r.z) * .2; }
  } else if (Game.state === 'race') {
    Game.time += dt;
    Player.zPrev = Player.z;

    if (Input.atkL) doAttack(Player, -1);
    if (Input.atkR) doAttack(Player, 1);

    updatePlayer(dt);
    for (let i = 0; i < Rivals.length; i++) updateRival(Rivals[i], dt, i);
    updateTraffic(dt);
    maybeSpawnCop(dt);
    updateCop(dt);
    checkCollisions(dt);

    // 冲线
    for (const r of Rivals) if (!r.done && r.z >= Road.finishZ) { r.done = true; r.doneT = Game.time; }
    computeRank();
    if (!Player.done && Player.z >= Road.finishZ) { finishRace(); }
    updateHud();
  } else if (Game.state === 'busted') {
    Player.downT += dt; Player.speed = approach(Player.speed, 0, 3, dt);
  }

  /* 相机横向跟随。
     直接 approach(Cam.x, Player.x) 有个不明显的毛病：一阶滞后的稳态误差正比于
     横向速度（满速约 0.16 条路宽）。换向时这段误差得先被"走完"相机才肯反向 ——
     实测按下反方向键后，车 0.03 秒就往回走了，画面要 0.22 秒才跟着反，
     手感上就是"打了方向没反应"。调快跟随只是把它按比例缩小，还是有。
     加一项速度前馈把稳态误差抵掉，再故意留一个封顶的横滑当手感：
     稳态下相机落后玩家 CAM_SLIDE（跟速度无关），换向时前馈项瞬间翻号，画面立刻反。 */
  const vxLag = (Player.vx || 0) / CAM_RATE;
  const slide = clamp(vxLag, -CAM_SLIDE, CAM_SLIDE);
  Cam.x = approach(Cam.x, clamp(Player.x, -1.4, 1.4) + vxLag - slide, CAM_RATE, dt);
  updateLook(dt);
  // 远景视差
  const seg = segAt(Player.z);
  Road.bgX += seg.curve * (Player.speed * dt / SEG_LEN) * 2.4;

  // 挡位跟音频无关，单独算 —— 静音了也得显示
  Game.gear = Math.min(GEARS, Math.floor(clamp(Player.speed / Player.maxSpeed, 0, 1) * GEARS) + 1);
  for (let i = Pickups.length - 1; i >= 0; i--)      // 甩在身后老远的就别留着了
    if (Pickups[i].z < Player.z - 20000) Pickups.splice(i, 1);
  updateFx(dt);
  updateEngine(dt);
  if (flash > 0) flash = Math.max(0, flash - dt * 3.2);
  bucketActors();
}

/* ==========================================================================
   26. 主循环
   ========================================================================== */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000;
  if (!last) { last = now; return; }
  let dt = Math.min(.05, now - last);
  last = now;
  musicTick();
  if (Game.paused) { render(); clearEdges(); return; }
  if (freezeT > 0) { freezeT -= dt; dt = 0; }      // 命中顿帧：画面还在，逻辑停一下
  update(dt);
  render();
  clearEdges();
}

/* ==========================================================================
   27. 启动
   ========================================================================== */
function boot() {
  layout();
  // 标题页背后也要有画面：先摆一条市中心的路
  buildTrack(0); prepFog();
  Road.bgX = 0; Road.starRng = new Float32Array(92);
  { const r = makeRng(77); for (let i = 0; i < 92; i++) Road.starRng[i] = r(); }
  Road.finishZ = (Road.segs.length - 60) * SEG_LEN;
  resetPlayerForRace();
  spawnRivals(0); spawnTraffic(0);
  Player.speed = 6200;
  if (TOUCH) padEl.classList.add('on');
  showTitle();
  requestAnimationFrame(frame);
}

// 标题页让画面自己往前滑，别是一张死图
const _origUpdate = update;
update = function (dt) {
  if (Game.state === 'title' || Game.state === 'shop' || Game.state === 'results') {
    Player.z += 6200 * dt;
    Player.x = Math.sin(Player.z * .000018) * .45;
    Player.speed = 6200;
    Player.hp = Player.maxHp; Player.state = 'ride'; Player.stun = 0;
    riderGravity(Player, dt);
    for (const r of Rivals) updateRival(r, dt, 0);
    updateTraffic(dt);
    Cam.x = approach(Cam.x, Player.x, 8, dt);
    const seg = segAt(Player.z);
    Road.bgX += seg.curve * (Player.speed * dt / SEG_LEN) * 2.4;
    if (Player.z > Road.finishZ) Player.z = 3000;
    Game.gear = 4;
    updateFx(dt); updateEngine(dt);
    bucketActors();
    return;
  }
  _origUpdate(dt);
};

boot();
</script>
