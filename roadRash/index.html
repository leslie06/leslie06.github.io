function musicDuck(on) { if (musicGain) musicGain.gain.setTargetAtTime(on ? .06 : .30, AC.currentTime, .05); }

/* 引擎随速度换挡：转速到顶就掉一截，跟真车一样一格一格往上爬 */
const GEARS = 6;
function updateEngine(dt) {
  if (!AC) return;
  const P = Player, on = (Game.state === 'race' || Game.state === 'pre' || Game.state === 'down');
  rainGain.gain.setTargetAtTime(Road.theme && Road.theme.rain && Game.state !== 'title' ? (on ? .10 : .04) : 0, AC.currentTime, .3);
  if (!on) { engGain.gain.setTargetAtTime(0, AC.currentTime, .08); windGain.gain.setTargetAtTime(0, AC.currentTime, .1); return; }
  const sp = clamp(P.speed / P.maxSpeed, 0, 1);
  const g = Game.gear - 1;
  const rpm = clamp(sp * GEARS - g, 0, 1);
  const idle = (Game.state === 'pre' && Input.gas) ? .55 : 0;
  const base = 52 + (rpm * .82 + idle) * 118 + g * 5;
  const t = AC.currentTime;
  for (let i = 0; i < engA.length; i++)
    engA[i].frequency.setTargetAtTime(base * (i === 3 ? 2 : 1), t, .035);
  const boost = P.boostT > 0 ? 1 : 0;
  engFilt.frequency.setTargetAtTime(420 + sp * 2400 + (Input.gas ? 500 : 0) + boost * 1400, t, .05);
  engGain.gain.setTargetAtTime(.13 + sp * .12 + boost * .05, t, .06);
  windGain.gain.setTargetAtTime(sp * sp * .17 + boost * .1, t, .12);
  windFilt.frequency.setTargetAtTime(500 + sp * 1500, t, .12);

/* ---------- 一次性音效 ---------- */
function env(node, t0, a, d, peak) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + a);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + a + d);
  node.connect(g); return g;
}
function noiseBurst(t0, dur, type, freq, Q, peak, out) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  s.playbackRate.value = .8 + Math.random() * .5;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = Q;
  s.connect(f);
  const g = env(f, t0, .004, dur, peak);
  g.connect(out || sfxGain);
  s.start(t0); s.stop(t0 + dur + .05);
  return f;
}
function tone(t0, f0, f1, dur, type, peak, out) {
  const o = AC.createOscillator(); o.type = type || 'square';
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = env(o, t0, .006, dur, peak);
  g.connect(out || sfxGain);
  o.start(t0); o.stop(t0 + dur + .05);
  return o;
}
function sfx(name, vol, delay) {
  if (!AC || Game.muted) return;
  const t = AC.currentTime, v = vol == null ? 1 : vol;
  switch (name) {

    case 'club':  noiseBurst(t, .07, 'bandpass', 480, 2.2, .34 * v); tone(t, 180, 60, .13, 'triangle', .30 * v); break;
    case 'chain': for (let i = 0; i < 4; i++) tone(t + i * .018, 1400 + i * 340, 900, .06, 'square', .10 * v); break;
    case 'hit':   noiseBurst(t, .13, 'lowpass', 1600, 1, .42 * v); tone(t, 260, 55, .16, 'sine', .34 * v); break;
    case 'hurt':  noiseBurst(t, .2, 'lowpass', 900, 1, .40 * v); tone(t, 180, 48, .24, 'sawtooth', .22 * v); break;
    case 'whiff': noiseBurst(t, .13, 'bandpass', 2600, .8, .10 * v); break;
    case 'nitro': { const f = noiseBurst(t, .9, 'bandpass', 300, 1.2, .42 * v);

    case 'charge':  tone(t, 880, 1320, .08, 'square', .09 * v); tone(t + .07, 1320, 1760, .1, 'square', .08 * v); break;
    case 'windup': { const f = noiseBurst(t, .3, 'bandpass', 500, 3, .16 * v);

    case 'horn':  tone(t, 420, 400, .42, 'square', .09 * v); tone(t + .005, 528, 500, .42, 'square', .07 * v); break;
    case 'siren': for (let i = 0; i < 6; i++) tone(t + i * .28, i & 1 ? 760 : 520, i & 1 ? 760 : 520, .26, 'square', .11 * v); break;

    case 'pickup':tone(t, 520, 1040, .12, 'square', .18 * v); tone(t + .06, 780, 1560, .1, 'square', .14 * v); break;
    case 'buy':   [523, 659, 784, 1046].forEach((f, i) => tone(t + i * .07, f, f, .12, 'square', .15)); break;
    case 'win':   [392, 523, 659, 784, 1046].forEach((f, i) => tone(t + i * .11, f, f, .3, 'square', .17)); break;
    case 'lose':  [392, 349, 294, 233].forEach((f, i) => tone(t + i * .15, f, f, .3, 'sawtooth', .15)); break;
    case 'beep':  tone(t, 660, 660, .14, 'square', .22); break;

    case 'bar':   noiseBurst(t, .12, 'bandpass', 380, 1.8, .36 * v); tone(t, 140, 48, .16, 'triangle', .32 * v);
                  tone(t + .01, 1800, 1400, .08, 'square', .05 * v); break;
    case 'wall':  noiseBurst(t, .16, 'bandpass', 2800, 5, .3 * v); tone(t, 700, 260, .14, 'square', .12 * v); tone(t, 110, 50, .12, 'sine', .3 * v); break;
    case 'skid':  { const f = noiseBurst(t, .45, 'bandpass', 2200, 6, .22 * v); f.frequency.exponentialRampToValueAtTime(900, t + .45); break; }
    case 'splash':noiseBurst(t, .3, 'lowpass', 1400, .8, .34 * v); noiseBurst(t + .03, .22, 'highpass', 4200, .8, .12 * v); break;

/* ---------- 背景乐：前瞻调度的 16 分音符序列 ---------- */
let musicNext = 0, musicStep = 0, musicMode = 'menu';
const BPM = 152;
const nt = n => 110 * Math.pow(2, n / 12);
// Am - F - G - Em，每小节一个和弦
const PROG = [0, -4, -2, 7];
const BASS = [0,0,12,0, 0,7,0,3, 0,0,12,7, 0,3,7,10];
const LEAD = [12,15,19,15, 22,19,15,12, 12,15,19,22, 24,22,19,15];
function musicSet(m) { musicMode = m; }
function musicTick() {
  if (!AC || Game.muted) return;
  const spb = 60 / ((musicMode === 'race' && Road.theme && Road.theme.bpm) || BPM) / 4;
  while (musicNext < AC.currentTime + .14) {
    playStep(musicStep, musicNext);
    musicStep = (musicStep + 1) % 64;
    musicNext += spb;
  }
}
function playStep(s, t) {
  const race = musicMode === 'race' && (Game.state === 'race' || Game.state === 'pre' || Game.state === 'down');
  const bar = (s >> 4) & 3, k = s & 15;
  const root = ((race && Road.theme.prog) || PROG)[bar];
  if (race) {
    // 鼓
    if (k === 0 || k === 6 || k === 8 || k === 14) { tone(t, 150, 45, .12, 'sine', .5, musicGain); }
    if (k === 4 || k === 12) { noiseBurst(t, .11, 'highpass', 1400, .8, .30, musicGain); tone(t, 220, 160, .06, 'triangle', .16, musicGain); }
    if (k % 2 === 0) noiseBurst(t, .028, 'highpass', 7000, 1, .075, musicGain);
    // 贝斯
    const b = BASS[k];
    tone(t, nt(root + b - 12), nt(root + b - 12), .12, 'sawtooth', .30, musicGain);
    // 主旋律：每两小节冒一次头
    if (bar % 2 === 1 && k % 2 === 0) {
      const l = LEAD[k];
      tone(t, nt(root + l), nt(root + l), .1, 'square', .09, musicGain);
    }
  } else {
    if (k === 0) tone(t, nt(root - 12), nt(root - 12), .5, 'triangle', .16, musicGain);
    if (k === 8) tone(t, nt(root - 5), nt(root - 5), .4, 'triangle', .12, musicGain);
    if (k === 0 || k === 8) noiseBurst(t, .04, 'highpass', 6000, 1, .05, musicGain);
  }
}
/* ==========================================================================
   24. 每帧把动态物件挂到所在路段上，渲染才知道谁在谁前面
   ========================================================================== */
const bucketed = [];
function bucketActors() {
  for (let i = 0; i < bucketed.length; i++) bucketed[i].actors.length = 0;
  bucketed.length = 0;
  const camZ = Player.z - PLAYER_Z, far = camZ + DRAW_DIST * SEG_LEN;
  const put = a => {
    if (!a || a.z < camZ - SEG_LEN * 2 || a.z > far) return;
    const s = segAt(a.z);
    if (!s.actors.length) bucketed.push(s);
    s.actors.push(a);
  };
  for (const c of Traffic) put(c);
  for (const p of Pickups) put(p);
  for (const r of Rivals) put(r);
  if (Cop) put(Cop);
  put(PlayerWreck);
  put(Player);                                     // 最后放，保证压在同段其他人上面
}

  setTxt('clock', fmtTime(Game.time));
  const kmh = Math.round(P.speed / 60);
  setTxt('spdNum', String(kmh));
  const sn = $('spdNum'), r = P.speed / P.maxSpeed;
  const cls = r > .93 ? 'red' : r > .72 ? 'fast' : '';
  if (sn.className !== cls) sn.className = cls;
  setTxt('gear', 'GEAR ' + (Game.gear || 1));
  const nf = Math.round(P.nitro), ready = P.nitro >= NITRO_COST, on = P.boostT > 0;
  if (hudCache.nitro !== nf) { hudCache.nitro = nf; $('nitroFill').style.width = nf + '%'; }
  const ncls = (ready ? 'ready' : '') + (on ? ' on' : '');
  if (hudCache.ncls !== ncls) { hudCache.ncls = ncls; $('nitroBar').className = ncls; const k = $('kNitro'); if (k) k.classList.toggle('ready', ready); }
}

function update(dt) {
  readInput();

  if (Game.state === 'pre') {
    const before = Math.ceil(Game.pre - .4);
    Game.pre -= dt;
    const after = Math.ceil(Game.pre - .4);
    if (after !== before) {
      if (after >= 1 && after <= 3) { toast(String(after)); sfx('beep'); }
      else if (after <= 0) { toast('冲！'); sfx('go'); }
    }
    if (Game.pre <= 0) { Game.state = 'race'; }
    Player.speed = 0;
    // 起跑前对手在原地热身
    for (const r of Rivals) { r.lean = Math.sin(frameCount * .1 + r.z) * .2; }
  } else if (Game.state === 'race') {
    Game.time += dt;
    if (Game.catchT > 0 && Player.state === 'ride') Game.catchT -= dt;
    if (Game.tauntCd > 0) Game.tauntCd -= dt;
    if (BOSSES[Game.track] && Game.time - dt < 1.6 && Game.time >= 1.6) {
      const B = BOSSES[Game.track];
      toast('悬赏 ★' + B.pal.nm + ' $' + Math.round(B.bounty * Diff().pay));
    }
    Player.zPrev = Player.z;

    if (Input.atkL) doAttack(Player, -1);
    if (Input.atkR) doAttack(Player, 1);
    if (Input.nitro) fireNitro();

    updatePlayer(dt);
    for (let i = 0; i < Rivals.length; i++) updateRival(Rivals[i], dt, i);
    updateTraffic(dt);
    maybeSpawnCop(dt);
    updateCop(dt);
    checkCollisions(dt);

    // 冲线
    for (const r of Rivals) if (!r.done && r.z >= Road.finishZ) { r.done = true; r.doneT = Game.time; }
    computeRank();
    if (!Player.done && Player.z >= Road.finishZ) { finishRace(); }
    updateHud();
  } else if (Game.state === 'busted') {
    Player.downT += dt; Player.speed = approach(Player.speed, 0, 3, dt);
  }

  /* 相机横向跟随。
     直接 approach(Cam.x, Player.x) 有个不明显的毛病：一阶滞后的稳态误差正比于
     横向速度（满速约 0.16 条路宽）。换向时这段误差得先被"走完"相机才肯反向 ——
     实测按下反方向键后，车 0.03 秒就往回走了，画面要 0.22 秒才跟着反，
     手感上就是"打了方向没反应"。调快跟随只是把它按比例缩小，还是有。
     加一项速度前馈把稳态误差抵掉，再故意留一个封顶的横滑当手感：
     稳态下相机落后玩家 CAM_SLIDE（跟速度无关），换向时前馈项瞬间翻号，画面立刻反。 */
  const vxLag = (Player.vx || 0) / CAM_RATE;
  const slide = clamp(vxLag, -CAM_SLIDE, CAM_SLIDE);
  Cam.x = approach(Cam.x, clamp(Player.x, -1.4, 1.4) + vxLag - slide, CAM_RATE, dt);
  updateLook(dt);
  // 远景视差
  const seg = segAt(Player.z);
  Road.bgX += seg.curve * (Player.speed * dt / SEG_LEN) * 2.4;

  // 挡位跟音频无关，单独算 —— 静音了也得显示
  Game.gear = Math.min(GEARS, Math.floor(clamp(Player.speed / Player.maxSpeed, 0, 1) * GEARS) + 1);
  for (let i = Pickups.length - 1; i >= 0; i--)      // 甩在身后老远的就别留着了
    if (Pickups[i].z < Player.z - 20000) Pickups.splice(i, 1);
  updateFx(dt);
  updateWeather(dt);
  updateEngine(dt);
  if (flash > 0) flash = Math.max(0, flash - dt * 3.2);
  bucketActors();
}

/* ==========================================================================
   26. 主循环
   ========================================================================== */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000;
  if (!last) { last = now; return; }
  let dt = Math.min(.05, now - last);
  last = now;
  musicTick();
  if (Game.paused) { render(); clearEdges(); return; }
  if (freezeT > 0) { freezeT -= dt; dt = 0; }      // 命中顿帧：画面还在，逻辑停一下
  update(dt);
  render();
  clearEdges();
}

/* ==========================================================================
   27. 启动
   ========================================================================== */
function boot() {
  loadSave();
  layout();
  // 标题页背后也要有画面：先摆一条市中心的路
  buildTrack(0); prepFog();
  Road.bgX = 0; Road.starRng = new Float32Array(92);
  { const r = makeRng(77); for (let i = 0; i < 92; i++) Road.starRng[i] = r(); }
  Road.finishZ = (Road.segs.length - 60) * SEG_LEN;
  resetPlayerForRace();
  spawnRivals(0); spawnTraffic(0);
  Player.speed = 6200;
  if (TOUCH) { padEl.classList.add('on'); document.body.classList.add('touch'); }
  showTitle();
  requestAnimationFrame(frame);
}

// 标题页让画面自己往前滑，别是一张死图
const _origUpdate = update;
update = function (dt) {
  if (Game.state === 'title' || Game.state === 'shop' || Game.state === 'results') {
    Player.z += 6200 * dt;
    Player.x = Math.sin(Player.z * .000018) * .45;
    Player.speed = 6200;
    Player.hp = Player.maxHp; Player.state = 'ride'; Player.stun = 0;
    riderGravity(Player, dt);
    for (const r of Rivals) updateRival(r, dt, 0);
    updateTraffic(dt);
    Cam.x = approach(Cam.x, Player.x, 8, dt);
    const seg = segAt(Player.z);
    Road.bgX += seg.curve * (Player.speed * dt / SEG_LEN) * 2.4;
    if (Player.z > Road.finishZ) Player.z = 3000;
    Game.gear = 4;
    updateFx(dt); updateWeather(dt); updateEngine(dt);
    bucketActors();
    return;
  }
  _origUpdate(dt);
};

boot();
</script>
