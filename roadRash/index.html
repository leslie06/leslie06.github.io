/* 远景天际线：一张宽图，按视角横向滚动 */
function bakeSkyline(theme, seed) {
  const rng = makeRng(seed);
  const w = 768, h = 144, { c, g } = mkCanvas(w, h);
  const night = theme.night;
  if (theme.bg === 'river') {
    for (let i = 0; i < 7; i++) {                              // 远山
      const cx = rng() * w, hh = rint(rng, 40, 88), ww = rint(rng, 90, 195);
      const col = i & 1 ? '#6a86a8' : '#5c7898';
      for (let x = -ww; x <= ww; x++) {
        const y = h - hh * (1 - Math.abs(x) / ww);
        const xx = ((cx + x) % w + w) % w;
        g.fillStyle = col; g.fillRect(xx | 0, y | 0, 1, h - y);
      }
    }
  } else if (theme.bg === 'mount') {
    // 三层山脊由远及近，最远那层顶上一点残雪
    for (const [n, lo, hi, col, snow] of [[5, 74, 136, '#7a6a9a', true], [7, 44, 96, '#5a4c78', false], [9, 18, 54, '#3e3558', false]]) {
      for (let i = 0; i < n; i++) {
        const cx = rng() * w, hh = rint(rng, lo, hi), ww = rint(rng, 60, 150);
        for (let x = -ww; x <= ww; x++) {
          const jag = Math.sin((cx + x) * .21) * 2.5 + Math.sin((cx + x) * .057) * 4.5;
          const y = Math.max(0, h - hh * (1 - Math.abs(x) / ww) + jag);
          const xx = ((cx + x) % w + w) % w;
          g.fillStyle = col; g.fillRect(xx | 0, y | 0, 1, h - y);
          const line2 = h - hh * .74;
          if (snow && y < line2) { g.fillStyle = '#e4d8e8'; g.fillRect(xx | 0, y | 0, 1, Math.min(line2 - y, 9)); }
        }
      }
    }
  } else if (theme.bg === 'port') {
    box(g, 0, h - 10, w, 10, '#6a7a86');                         // 海平线
    for (let i = 0; i < 6; i++) {                                 // 远处的货轮
      const x = rng() * w, sw = rint(rng, 70, 130), sh = rint(rng, 10, 16);
      box(g, x, h - 10 - sh, sw, sh, '#56626e');
      const k = rint(rng, 3, 6);
      for (let j = 0; j < k; j++) box(g, x + 6 + j * 13, h - 10 - sh - 7, 11, 7, pick(rng, ['#8a5a50', '#5a7088', '#6a8070']));
      box(g, x + sw - 20, h - 10 - sh - 22, 14, 22, '#66727c');
    }
    for (let i = 0; i < 9; i++) {                                 // 岸桥剪影
      const x = rng() * w, ch = rint(rng, 60, 110);
      box(g, x, h - ch, 3, ch, '#54606c'); box(g, x + 24, h - ch, 3, ch, '#54606c');
      box(g, x - 22, h - ch - 4, 70, 4, '#54606c');
      line(g, x + 12, h - ch - 18, x - 20, h - ch - 4, 1, '#54606c'); line(g, x + 12, h - ch - 18, x + 46, h - ch - 4, 1, '#54606c');
    }
  } else if (theme.bg === 'indu') {
    for (let i = 0; i < 34; i++) {
      const x = rng() * w, ww = rint(rng, 21, 60), hh = rint(rng, 30, 93);
      box(g, x, h - hh, ww, hh, rng() < .5 ? '#4a4450' : '#544c56');
      if (rng() < .4) box(g, x + ww * .4, h - hh - 21, 7, 21, '#5a5058');
    }
  } else {
    for (let i = 0; i < 46; i++) {                             // 城市剪影
      const x = rng() * w, ww = rint(rng, 24, 69), hh = rint(rng, 36, 132);
      const col = night ? (rng() < .5 ? '#161a30' : '#1c1c34') : (rng() < .5 ? '#7a86a0' : '#8a94ac');
      box(g, x, h - hh, ww, hh, col);
      if (night) for (let k = 0; k < 18; k++)
        if (rng() < .5) box(g, x + 3 + rint(rng, 0, ww - 7), h - hh + 4 + rint(rng, 0, hh - 12), 3, 3,
                            pick(rng, ['#ffd870','#a8d8ff','#ffb040']));
      if (rng() < .18) box(g, x + ww / 2 - 2, h - hh - 18, 3, 18, col);
    }
  }
  return { c, w, h };
}

/* 按主题现烤一批街景，返回带权重的候选池 */
function buildScenery(theme, seed) {
  const rng = makeRng(seed), night = theme.night, pool = [];
  const add = (sp, wgt, tag) => { sp.tag = tag; for (let i = 0; i < wgt; i++) pool.push(sp); };
  const m = theme.mix, N = 100;
  const mk = {
    tower:   () => bakeTower(rng, night),
    shop:    () => bakeShop(rng, night),
    neon:    () => bakeNeon(rng),
    lamp:    () => null,                                    // 路灯按侧生成，单独处理
    traffic: () => bakeTraffic(night),
    pole:    () => bakePole(rng, night),
    tree:    () => bakeTree(rng),
    palm:    () => bakePalm(rng),
    billboard:() => bakeBillboard(rng, night),
    chimney: () => bakeChimney(rng),
    tank:    () => bakeTank(rng),
    crane:   () => bakeCrane(rng),
    crowd:   () => bakeCrowd(rng),
    guard:   () => bakeGuard(rng),
    barrier: () => bakeBarrier(rng),
    cone:    () => bakeCone(),
    pine:    () => bakePine(rng),
    crag:    () => bakeCrag(rng),
    box:     () => bakeBoxes(rng),
    portcrane:() => bakePortCrane(rng),
    fence:   () => bakeFence(rng),
    flood:   () => bakeFlood(night),
  };
  for (const k in m) {
    if (k === 'lamp') continue;
    const n = Math.max(1, Math.round(m[k] * N / 8));         // 每类烤几个变体
    for (let i = 0; i < n; i++) { const sp = mk[k](); if (sp) add(sp, Math.round(m[k] * N), k); }
  }
  for (const sp of pool) if (!sp.mips) mipify(sp);
  const lampL = mipify(bakeLamp(-1, night)), lampR = mipify(bakeLamp(1, night));
  const HB = { barrier: () => bakeBarrier(rng), cone: () => bakeCone(), rock: () => bakeBoulder(rng),
               oil: () => bakeOil(), puddle: () => bakePuddle() };
  const tagged = (sp, tag) => { sp.tag = tag; return mipify(sp); };
  return {
    pool,
    lampL, lampR,
    lampRate: m.lamp || (theme.lampEvery ? 1 : 0),
    skyline: bakeSkyline(theme, seed ^ 0x9e37),
    hazards: (theme.haz || ['barrier', 'cone', 'cone', 'barrier']).map(tag => tagged(HB[tag](), tag)),
    chevL: theme.chevron ? tagged(bakeChevron(-1), 'sign') : null,
    chevR: theme.chevron ? tagged(bakeChevron(1), 'sign') : null,
    gantry: theme.gantry ? tagged(bakeGantry(night), 'gantry') : null,
  };
}

/* ==========================================================================
   9. 赛道几何
   ========================================================================== */
const SEG_LEN = 200, RUMBLE_LEN = 3, ROAD_W = 2000, DRAW_DIST = 560;
/* 视距是两件事的乘积：几何上画多少段，以及雾在多远处把它糊掉。
   原来 340 段 = 4.7 秒，但雾在 2.5 秒处就已经不透了 —— 后面那 2 秒白画。
   段数拉到 560（7.7 秒），同时把雾整体调稀，让"看得清"的那一段真正变长。
   代价由远处的合并色带补回来（见 drawRun），段数涨了但填充量没涨。 */
const FOG_SCALE = .72;
const MERGE_PX = 2.4;                  // 明暗带窄到这个像素数以下就不再交替（见 drawRun）
const UNITS_PER_KM = 216000;                                  // 12000 u/s = 200 km/h

const Road = {
  segs: [], length: 0, theme: null, scenery: null, name: '', idx: 0,
};
const CURVE = { none:0, easy:2, med:4, hard:6, evil:8 };
const HILL  = { none:0, low:20, med:42, high:70, huge:100 };

function lastY() { const s = Road.segs; return s.length ? s[s.length - 1].p2.y : 0; }
function addSegment(curve, y) {
  const n = Road.segs.length;
  Road.segs.push({
    i: n, curve,
    p1: { y: lastY(), z: n * SEG_LEN, cx:0, cy:0, cz:0, sx:0, sy:0, sw:0, scale:0 },
    p2: { y,          z: (n + 1) * SEG_LEN, cx:0, cy:0, cz:0, sx:0, sy:0, sw:0, scale:0 },
    dark: Math.floor(n / RUMBLE_LEN) % 2 === 0,
    sprites: [], actors: [], tunnel: false, clip: 0,
  });
}
function addRoad(enter, hold, leave, curve, y) {
  const startY = lastY(), endY = startY + (y || 0) * SEG_LEN;
  const total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter),     easeInOut(startY, endY, n / total));
  for (let n = 0; n < hold;  n++) addSegment(curve,                          easeInOut(startY, endY, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave),  easeInOut(startY, endY, (enter + hold + n) / total));
}
const ROAD_S = 25, ROAD_M = 50, ROAD_L = 100;
const straight = n => addRoad(n, n, n, 0, 0);
const curve    = (n, c, h) => addRoad(n, n, n, c, h || 0);
const hill     = (n, h) => addRoad(n, n, n, 0, h);
const sCurve   = n => { addRoad(n, n, n, -CURVE.easy, HILL.none); addRoad(n, n, n, CURVE.med, HILL.med);
                        addRoad(n, n, n, CURVE.easy, -HILL.low); addRoad(n, n, n, -CURVE.med, HILL.med); };
const bumps    = () => { for (const h of [3,-1,-3,5,3,-4,3,-1]) addRoad(10, 10, 10, 0, h); };
/* 跳台：26 段之内拉起来又立刻放平，路面掉得比重力快，人就飞出去了 */
const ramp     = (h) => { addRoad(12, 6, 8, 0, h == null ? 6 : h); addRoad(8, 8, 14, 0, -(h == null ? 6 : h) * .5); };

/* 八条赛道的路形，各有性格 */
function buildTrackGeometry(idx, rng) {
  Road.segs.length = 0;
  addRoad(30, 30, 30, 0, 0);                                   // 起跑直道
  const L = ROAD_L, M = ROAD_M, S = ROAD_S;
  if (idx === 0) {                                             // 市中心：宽缓，认路用
    straight(L); curve(M, CURVE.med); straight(S); curve(M, -CURVE.med, HILL.low);
    hill(M, HILL.med); straight(M); ramp(5); curve(L, CURVE.easy, -HILL.low);
    sCurve(S); straight(M); curve(M, -CURVE.hard); hill(M, -HILL.med);
    straight(L); curve(M, CURVE.med, HILL.med); sCurve(M); ramp(6); straight(M);
    curve(L, -CURVE.easy); hill(L, HILL.low); straight(L);
  } else if (idx === 1) {                                      // 旧城：窄弯连着来
    curve(S, CURVE.hard); curve(S, -CURVE.hard); straight(S);
    sCurve(S); curve(M, CURVE.evil, HILL.low); straight(S); ramp(5);
    curve(S, -CURVE.evil); hill(S, HILL.high); curve(M, CURVE.hard, -HILL.med);
    sCurve(S); straight(M); curve(S, -CURVE.hard, HILL.med); bumps();
    curve(M, CURVE.med); sCurve(S); curve(S, -CURVE.evil); straight(M); ramp(7);
    curve(M, CURVE.hard, -HILL.low); sCurve(S); straight(M);
    curve(M, -CURVE.med, HILL.low); sCurve(S); bumps(); curve(S, CURVE.evil);
    straight(M); curve(M, -CURVE.hard); sCurve(S); straight(L);
  } else if (idx === 2) {                                      // 滨江：长弯大坡，飙速
    straight(L); curve(L, CURVE.easy, HILL.med); straight(L);
    curve(L, -CURVE.med, -HILL.med); hill(L, HILL.high); ramp(7); straight(M);
    curve(L, CURVE.med, HILL.low); straight(L); curve(M, -CURVE.hard);
    hill(L, -HILL.high); straight(L); curve(L, CURVE.easy, HILL.med);
    sCurve(M); straight(L); curve(L, -CURVE.easy, -HILL.low); straight(L);
  } else if (idx === 3) {                                      // 工业：颠、急、脏
    bumps(); curve(S, CURVE.evil); straight(S); curve(S, -CURVE.evil, HILL.med);
    bumps(); sCurve(S); curve(M, CURVE.hard, -HILL.med); straight(S); ramp(8);
    curve(S, -CURVE.hard, HILL.high); bumps(); curve(M, CURVE.evil);
    straight(M); sCurve(S); curve(S, -CURVE.evil, -HILL.med); bumps();
    curve(M, CURVE.med, HILL.low); straight(M); curve(S, -CURVE.hard); ramp(6);
    straight(M); curve(M, CURVE.hard, HILL.med); sCurve(S);
    curve(S, -CURVE.evil); straight(M); bumps(); curve(M, CURVE.med); straight(L);
  } else if (idx === 4) {                                      // 夜战：全都来一遍
    straight(M); curve(M, CURVE.hard, HILL.med); sCurve(S);
    curve(L, -CURVE.med, -HILL.med); straight(L); curve(S, CURVE.evil);
    hill(M, HILL.high); curve(M, -CURVE.hard, -HILL.low); bumps();
    straight(L); sCurve(S); curve(L, CURVE.med, HILL.med); straight(M);
    curve(S, -CURVE.evil); hill(M, -HILL.high); ramp(7); curve(M, CURVE.hard); straight(M);
    sCurve(M); curve(L, -CURVE.easy, HILL.low); straight(L);
  } else if (idx === 5) {                                      // 盘山：一路爬上去、发夹弯、再一路冲下来
    straight(M); curve(M, CURVE.hard, HILL.high); straight(S); curve(S, -CURVE.evil, HILL.med);
    straight(S); curve(M, CURVE.evil, HILL.high); hill(S, -HILL.low); curve(M, -CURVE.evil, HILL.med);
    straight(M); ramp(6); curve(L, CURVE.med, -HILL.high); sCurve(S);
    curve(M, -CURVE.hard, HILL.huge); straight(S); curve(S, CURVE.evil); curve(S, -CURVE.evil, -HILL.med);
    straight(M); curve(L, CURVE.hard, -HILL.huge); bumps(); straight(M);
    curve(M, -CURVE.med, HILL.high); curve(S, CURVE.evil, HILL.low); sCurve(S); curve(M, -CURVE.evil, -HILL.high);
    straight(L); curve(M, CURVE.hard, -HILL.med); ramp(7); straight(L);
  } else if (idx === 6) {                                      // 港口：直角弯接长直道，过铁轨一路颠
    straight(L); curve(S, CURVE.evil); straight(M); bumps(); curve(S, -CURVE.evil); straight(L);
    ramp(7); curve(M, CURVE.hard); sCurve(S); straight(M); curve(S, -CURVE.evil); bumps();
    straight(L); curve(M, CURVE.med, HILL.low); hill(M, -HILL.low); curve(S, CURVE.evil); straight(M); ramp(8);
    curve(S, -CURVE.hard); bumps(); straight(L); sCurve(M); curve(S, CURVE.evil); straight(M);
    curve(M, -CURVE.hard); straight(L);
  } else {                                                     // 暴雨高架：长弯高速，匝道一起一伏
    straight(L); curve(L, CURVE.med, HILL.med); straight(M); curve(L, -CURVE.hard, -HILL.med);
    straight(L); hill(M, HILL.high); curve(M, CURVE.hard); hill(M, -HILL.high); straight(M);
    sCurve(M); straight(L); curve(L, -CURVE.med, HILL.low); ramp(6); curve(M, CURVE.evil); straight(M);
    curve(L, CURVE.easy, -HILL.low); sCurve(S); straight(L); curve(M, -CURVE.hard, HILL.med); straight(M);
    curve(L, CURVE.med, -HILL.med); straight(L);
  }
  addRoad(40, 40, 40, 0, 0);                                   // 冲线直道
  Road.length = Road.segs.length * SEG_LEN;
}

/* 隧道：夜战和市中心各挖一段 */
function addTunnels(idx, rng) {
  const n = Road.segs.length;
  const spans = idx === 4 ? [[.30, .38], [.66, .74]] : idx === 0 ? [[.52, .58]] : idx === 3 ? [[.44, .49]]
              : idx === 5 ? [[.58, .63]] : idx === 7 ? [[.40, .45]] : [];
  for (const [a, b] of spans)
    for (let i = Math.floor(n * a); i < Math.floor(n * b); i++) Road.segs[i].tunnel = true;
}

/* 各类街景离路中心多远：体量越大站得越远，不然一栋楼能糊掉半个屏幕 */
const BIG = { tower:1, shop:1, chimney:1, tank:1, crane:1, box:1, portcrane:1 };
function OFF_BAND(tag, rng) {
  // 视野收窄之后近处的东西被放大一倍，楼必须往外挪，否则两堵墙把整条街夹死、天也看不见
  if (BIG[tag])                                   return 2.55 + rng() * 1.55;   // 楼：退到人行道之外
  if (tag === 'tree' || tag === 'palm' || tag === 'pine') return 1.70 + rng() * .70;
  if (tag === 'crag')                             return 1.80 + rng() * 1.1;
  if (tag === 'flood')                            return 1.40 + rng() * .30;
  if (tag === 'billboard' || tag === 'neon')      return 1.75 + rng() * .85;
  if (tag === 'pole' || tag === 'traffic')        return 1.32 + rng() * .26;
  return 1.12 + rng() * .20;                                                    // 人群、护栏、锥筒
}

/* 沿路撒街景与路障 */
function decorate(idx, theme, sc, rng) {
  const segs = Road.segs, n = segs.length, wl = theme.wall;
  const lampN = theme.lampEvery || 34;
  // 有护墙的街，贴路肩的小东西一律挪到墙外面去，不然看着像长在墙里
  const outside = off => wl && Math.abs(off) < wl.x + .06 ? sign(off) * (wl.x + .08 + (Math.abs(off) - 1.1) * .3) : off;
  for (let i = 40; i < n - 60; i++) {
    const s = segs[i];
    // 弯道提示牌：立在弯的外侧，隧道里也要有
    if (sc.chevL && i % 12 === 0 && Math.abs(s.curve) >= CURVE.med)
      s.sprites.push({ sp: s.curve > 0 ? sc.chevR : sc.chevL, off: -sign(s.curve) * ((wl ? wl.x : 1.1) + .14) });
    if (s.tunnel) continue;
    // 龙门架路牌
    if (sc.gantry && i % 240 === 120) s.sprites.push({ sp: sc.gantry, off: 0 });
    // 路灯：等间距，交替两侧
    if (sc.lampRate > 0 && i % lampN === 0) {
      const side = (i / lampN) % 2 === 0 ? -1 : 1;
      s.sprites.push({ sp: side < 0 ? sc.lampL : sc.lampR, off: side * 1.32, tall: true });
    }
    // 近景：按体量分档站位 —— 楼退到人行道外面去，贴路肩的只能是小东西
    if (rng() < .34) {
      const sp = pick(rng, sc.pool);
      const side = rng() < .5 ? -1 : 1;
      s.sprites.push({ sp, off: outside(side * OFF_BAND(sp.tag, rng)) });
    }
    // 远景：楼群往纵深里铺，撑起街道两侧的墙（山里是林子和岩壁）
    if (rng() < .20) {
      const sp = pick(rng, sc.pool);
      if (BIG[sp.tag] || (theme.far && theme.far.includes(sp.tag))) s.sprites.push({ sp, off: (rng() < .5 ? -1 : 1) * (4.2 + rng() * 5.4) });
    }
    // 路面障碍：在车道内，撞上就摔
    if (i > 120 && rng() < theme.hazard * .06) {
      const sp = pick(rng, sc.hazards);
      s.sprites.push({ sp, off: (rng() * 1.5 - .75), hazard: true });
    }
  }
}

/* 八条街按出场顺序排。存档里只记下标，所以新街道只能往后加，不能往中间插 */
const TRACK_KEYS = ['city', 'old', 'river', 'indu', 'night', 'mount', 'port', 'storm'];
const TRACK_N = TRACK_KEYS.length;
function buildTrack(idx) {
  const theme = THEMES[TRACK_KEYS[idx]];
  const seed = 0x5eed + idx * 7717;
  const rng = makeRng(seed);
  Road.idx = idx; Road.theme = theme; Road.name = theme.name;
  buildTrackGeometry(idx, rng);
  addTunnels(idx, rng);
  Road.scenery = buildScenery(theme, seed);
  decorate(idx, theme, Road.scenery, rng);
}

/* 查段 / 求路面高度 */
function segAt(z) {
  const s = Road.segs;
  return s[Math.floor(((z % Road.length) + Road.length) % Road.length / SEG_LEN) % s.length];
}
function roadY(seg, z) {
  const p = (z - seg.p1.z) / SEG_LEN;
  return lerp(seg.p1.y, seg.p2.y, clamp(p, 0, 1));
}
/* ==========================================================================
   10. 雾色查表：远处的路面直接查预混好的颜色，不做逐帧字符串解析
   ========================================================================== */
const FOG_STEPS = 32;
function hex2rgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const v = parseInt(h.slice(0, 6), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
function mixHex(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  const r = Math.round(lerp(A[0], B[0], t)), g = Math.round(lerp(A[1], B[1], t)), bl = Math.round(lerp(A[2], B[2], t));
  // 回吐十六进制而不是 rgb()：混出来的颜色还要再喂给 hex2rgb 混第二轮（中间色带 → 雾）
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
function fogRamp(col, fogCol) {
  const out = new Array(FOG_STEPS);
  for (let i = 0; i < FOG_STEPS; i++) out[i] = mixHex(col, fogCol, i / (FOG_STEPS - 1));
  return out;
}
const SKY_BANDS = 16;
function prepFog() {
  const t = Road.theme, f = t.fog;
  Road.sky = [];
  for (let i = 0; i < SKY_BANDS; i++) Road.sky[i] = mixHex(t.sky[0], t.sky[1], i / (SKY_BANDS - 1));
  // 第 3 档 = 明暗带的中间色。远处一条色带不到两个像素时，明暗交替就不再是花纹
  // 而是噪声：高速下每秒二十几条带子扫过去，整条路看着在抖。那里换成中间色。
  const mid = p => mixHex(p[0], p[1], .5);
  Road.LUT = {
    off:  [fogRamp(t.off[0], f),   fogRamp(t.off[1], f),   fogRamp(mid(t.off), f)],
    rum:  [fogRamp(t.rumble[0], f),fogRamp(t.rumble[1], f),fogRamp(mid(t.rumble), f)],
    road: [fogRamp(t.road[0], f),  fogRamp(t.road[1], f),  fogRamp(mid(t.road), f)],
    lane: fogRamp(t.lane, f),
    tun:  fogRamp(t.night ? '#0a0a12' : '#1a1a22', f),
    tunW: fogRamp(t.night ? '#22222c' : '#3a3a46', f),
  };
  if (t.wall) Object.assign(Road.LUT, { wall: fogRamp(t.wall.col, f), wallTop: fogRamp(t.wall.top, f), wallDk: fogRamp(t.wall.dk, f) });
  Road.skyGrad = null;
}

/* ==========================================================================
   11. 相机与投影
   ========================================================================== */
/* 视野收窄 = 远处一切放大，而且玩家自己的大小和路面宽度完全不变 ——
   因为 PLAYER_Z 正比于 camDepth，两处的 camDepth 约掉了。
   100° → 76° 白得 1.53 倍，零填充开销。代价是路面收敛变慢，前进的速度感略降。 */
const FOV = 76;
const camDepth = 1 / Math.tan((FOV / 2) * PI / 180);
const CAM_H = 1250;
const PLAYER_Z = CAM_H * camDepth * 1.20;   // 比标准值再退一点，车整个露出来

const Cam = { x: 0, z: 0, y: 0, shake: 0, shakeT: 0, shakeP: 0, roll: 0, dip: 0, look: 0 };

function project(p, camX, camY, camZ) {
  p.cx = -camX;                 // 路面中心线恒在世界 x=0，弯道由 camX 累加体现
  p.cy = p.y - camY;
  p.cz = (p.z - camZ) || .0001;
  p.scale = camDepth / p.cz;
  // Cam.look 是「往弯里转头」：跟深度无关的整体平移，所以远近一起挪，弯道不会被掰直
  p.sx = (W / 2) + (p.scale * p.cx * W / 2) - Cam.look * W;
  p.sy = (H / 2) - (p.scale * p.cy * H / 2) + Cam.dip;
  p.sw = (p.scale * ROAD_W * W / 2);
}

/* ==========================================================================
   12. 渲染
   ========================================================================== */
let horizonY = H * .5;

function renderSky(theme, baseSeg, playerY) {
  // 天空：分档色带，不用连续渐变，保住复古味
  const hy = clamp(horizonY, 0, H);
  // 相机转头了，天上的东西也得跟着转 —— 它们在无穷远，平移量就是整幅画面的平移量
  const pan = Cam.look * W;
  for (let i = 0; i < SKY_BANDS; i++) {
    const y0 = Math.round(i * hy / SKY_BANDS), y1 = Math.round((i + 1) * hy / SKY_BANDS);
    ctx.fillStyle = Road.sky[i];
    ctx.fillRect(0, y0, W, Math.max(1, y1 - y0));
  }
  if (Weather.bolt > 0) {                         // 闪电：整片天一白，天际线反倒成了剪影
    const b = Weather.bolt, on = b > .7 || ((Weather.t * 24) | 0) % 3 !== 1;
    ctx.fillStyle = 'rgba(190,200,255,' + (on ? b * .75 : b * .2).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, hy);
  }
  if (theme.sun) {
    const sx = W * .5 - Road.bgX * .35 - pan, sy = hy - 26;
    const px2 = ((sx % (W * 2)) + W * 2) % (W * 2) - W * .5;
    ellipse(ctx, px2, sy, 15 * PX, 15 * PX, theme.sun);
    ellipse(ctx, px2, sy, 22 * PX, 22 * PX, 'rgba(255,224,150,.16)');
  }
  if (theme.night) {                               // 星星
    const r = Road.starRng;
    for (let i = 0; i < 46; i++) {
      const x = (r[i * 2] * W * 1.4 - Road.bgX * .12 - pan) % W;
      ctx.fillStyle = i % 5 ? '#c8c8e0' : '#f4f0e4';
      ctx.fillRect(((x % W) + W) % W | 0, r[i * 2 + 1] * hy * .8 | 0, PX, PX);
    }
  }
  // 天际线
  const sk = Road.scenery.skyline;
  const skH = Math.round(sk.h * (H / 360) * .9);
  const skY = Math.round(hy - skH + 2);
  let ox = ((-Road.bgX * .5 - pan) % sk.w + sk.w) % sk.w;
  for (let x = -ox; x < W; x += sk.w) ctx.drawImage(sk.c, 0, 0, sk.w, sk.h, x | 0, skY, sk.w, skH);
  // 地平线雾带
  const g = ctx.createLinearGradient(0, skY, 0, hy + 10);
  g.addColorStop(0, theme.fog + '00'); g.addColorStop(.65, theme.fog + 'cc'); g.addColorStop(1, theme.fog);
  ctx.fillStyle = g; ctx.fillRect(0, skY, W, hy + 10 - skY);
}

/* 路面：把连续可见、同一色带的若干段并成一段「路带」，一次路径填出来。
   逐行 fillRect 的老做法在 1080p 上要一千多次调用，而且边缘只能是硬台阶；
   路径填充带抗锯齿，弯道边沿是光的，调用数还少一个数量级。 */
function edgeAt(seg, y) {
  const t = clamp((y - seg.p2.sy) / ((seg.p1.sy - seg.p2.sy) || 1), 0, 1);
  return { y, cx: lerp(seg.p2.sx, seg.p1.sx, t), w: lerp(seg.p2.sw, seg.p1.sw, t) };
}
/* 沿路带的两条边描一圈：off 是相对半宽的偏移，a→b 之间那条带子 */
function ribbon(pts, oa, ob) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], x = p.cx + p.w * oa;
    if (i === 0) ctx.moveTo(x, p.y); else ctx.lineTo(x, p.y);
  }
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    ctx.lineTo(p.cx + p.w * ob, p.y);
  }
  ctx.closePath();
  ctx.fill();
}
function drawRun(r) {
  const L = Road.LUT, d = r.band, f = r.fogI, pts = r.pts;
  if (pts.length < 2) return;
  const yBot = pts[0].y, yTop = pts[pts.length - 1].y;
  // 路肩（或隧道地面）：整条横带。相邻两段共用同一个边界值，两端都取整就能严丝合缝 ——
  // 之前往下多画 1px 想补缝，结果把远处那段的颜色刷进了近处那段，反而出来一条横线
  const y0 = Math.round(yTop), y1 = Math.round(yBot);
  ctx.fillStyle = r.tun ? L.tun[f] : L.off[d][f];
  if (y1 > y0) ctx.fillRect(0, y0, W, y1 - y0);
  if (r.tun) { ctx.fillStyle = L.tunW[f]; ribbon(pts, -1.5, -1.16); ribbon(pts, 1.16, 1.5); }
  ctx.fillStyle = L.rum[d][f];
  ribbon(pts, -1.16, -1); ribbon(pts, 1, 1.16);      // 路缘石
  ctx.fillStyle = L.road[d][f];
  ribbon(pts, -1, 1);
  // 虚线车道只画在浅色带上；到了合并区，虚线本来就分辨不出来了，改成连续两条细线 ——
  // 远处那两条收敛线是弯道方向最直接的提示，比闪烁的虚线管用
  if (d === 1 || d === 2) {
    ctx.fillStyle = L.lane[f];
    ribbon(pts, -.355, -.311); ribbon(pts, .311, .355);
  }
}

/* ---------- 护墙 ----------
   盘山的波形护栏、高架的混凝土防撞墙。连续的一长条，不用一格一格的精灵去拼：
   每一侧沿路收一串点，底边近→远、顶边远→近围成一个多边形，按雾分几档各填一次。
   被坡顶挡住的部分靠「每个点的 y 不低于它那一段的遮挡线」压扁 —— 遮挡线是一条
   水平线，逐点压就是精确的裁剪。画在路面之后、街景和车之前。 */
const WALL_SEGS = 300, WALL_BUCKETS = 4;
const WallPts = { x: new Float32Array(WALL_SEGS), yb: new Float32Array(WALL_SEGS), yt: new Float32Array(WALL_SEGS),
                  ym: new Float32Array(WALL_SEGS), yh: new Float32Array(WALL_SEGS), pw: new Float32Array(WALL_SEGS), f: new Int8Array(WALL_SEGS) };
function wallBand(i0, i1, lo, hi) {                // lo/hi 是 [底, 中, 顶, 高光线] 里的哪两条
  const A = WallPts, rows = [A.yb, A.ym, A.yt, A.yh];
  const a = rows[lo], b = rows[hi];
  ctx.beginPath();
  ctx.moveTo(A.x[i0], a[i0]);
  for (let i = i0 + 1; i <= i1; i++) ctx.lineTo(A.x[i], a[i]);
  for (let i = i1; i >= i0; i--) ctx.lineTo(A.x[i], b[i]);
  ctx.closePath(); ctx.fill();
}
function renderWalls(baseIdx) {
  const wl = Road.theme.wall, L = Road.LUT, segs = Road.segs, N = segs.length, A = WallPts;
  const rail = wl.kind === 'rail';
  for (const side of [-1, 1]) {
    let n = 0, lx = 1e9, ly = 1e9, lf = -1;
    for (let k = 0; k < WALL_SEGS - 1 && n < WALL_SEGS; k++) {
      const seg = segs[(baseIdx + k) % N], nxt = segs[(baseIdx + k + 1) % N];
      const clip = nxt.clip, p = seg.p2;
      if (clip <= 0) break;                                   // 再往后已经整段被挡住了
      if (p.cz <= camDepth || p.scale <= 0) continue;
      const x = p.sx + side * p.sw * wl.x, hh = p.scale * wl.h * H / 2;
      const yb = Math.min(p.sy, clip), f = (seg.fogI * WALL_BUCKETS / FOG_STEPS) | 0;
      // 远处一段只挪零点几个像素，逐段落点纯属浪费（雾档切换的那个点必须留）
      if (f === lf && Math.abs(yb - ly) < .6 && Math.abs(x - lx) < 2 && k < WALL_SEGS - 2) continue;
      A.x[n] = x; A.yb[n] = yb; A.yt[n] = Math.min(p.sy - hh, clip);
      A.ym[n] = Math.min(p.sy - hh * (rail ? .5 : .16), clip);
      A.yh[n] = Math.min(p.sy - hh * (rail ? .85 : .86), clip);
      A.pw[n] = p.scale * 34 * W / 2; A.f[n] = f;
      lx = x; ly = yb; lf = f; n++;
    }
    if (n < 2) continue;
    // 按雾档切成几段，相邻两段共用交界那个点，接缝处不漏
    let i0 = 0;
    for (let i = 1; i <= n; i++) {
      if (i < n && A.f[i] === A.f[i0]) continue;
      const i1 = Math.min(i, n - 1), fi = Math.round((A.f[i0] + .5) * FOG_STEPS / WALL_BUCKETS) | 0;
      const fogI = Math.min(FOG_STEPS - 1, fi);
      if (i1 > i0) {
        if (rail) {
          // 立柱：只画近处，一段一根，攒成一条路径
          ctx.fillStyle = L.wallDk[fogI]; ctx.beginPath();
          for (let j = i0; j <= i1; j++) {
            if (A.pw[j] < .8 || A.yb[j] - A.ym[j] < .5) continue;
            ctx.rect(A.x[j] - A.pw[j] / 2, A.ym[j], A.pw[j], A.yb[j] - A.ym[j]);
          }
          ctx.fill();
          ctx.fillStyle = L.wall[fogI];    wallBand(i0, i1, 1, 2);         // 波形梁
          ctx.fillStyle = L.wallTop[fogI]; wallBand(i0, i1, 3, 2);         // 梁上沿一道高光
        } else {
          ctx.fillStyle = L.wall[fogI];    wallBand(i0, i1, 0, 2);         // 墙面
          ctx.fillStyle = L.wallDk[fogI];  wallBand(i0, i1, 0, 1);         // 墙脚放宽的那一截
          ctx.fillStyle = L.wallTop[fogI]; wallBand(i0, i1, 3, 2);         // 墙顶压边
        }
      }
      i0 = i1;
    }
  }
}

/* 贴地的一枚扁椭圆，让车不像飘着 */
function groundShadow(cx, y, w) {
  if (w < 1.2) return;
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath();
  ctx.ellipse(cx, y, w * .5, Math.max(.6, w * .15), 0, 0, TAU);
  ctx.fill();
}

function drawSpriteAt(sp, cx, bottomY, destW, clipY, alpha) {
  const destH = destW * (sp.h / sp.w);
  if (destW < .7 || destH < .7) return;
  // 挑一档「还不小于目标尺寸」里最小的缩图：近处用原图保持锐利，远处用平均过的
  let lv = sp.mips ? sp.mips[0] : sp;
  if (sp.mips) for (let i = 1; i < sp.mips.length; i++) {
    if (sp.mips[i].w >= destW) lv = sp.mips[i]; else break;
  }
  const dx = Math.round(cx - destW / 2), dy = Math.round(bottomY - destH);
  let sh = lv.h, dh = destH;
  if (clipY != null) {
    const over = (dy + destH) - clipY;
    if (over > 0) { if (over >= destH) return; sh = lv.h * (1 - over / destH); dh = destH - over; }
  }
  if (alpha != null && alpha < 1) { ctx.globalAlpha = alpha; }
  ctx.drawImage(lv.c, 0, 0, lv.w, Math.max(1, sh), dx, dy, Math.max(1, Math.round(destW)), Math.max(1, Math.round(dh)));
  if (alpha != null && alpha < 1) ctx.globalAlpha = 1;
}

/* 平滑下限：destW 远大于 m 时几乎不动，趋近 0 时停在 m。
   透视因此略有偏差，但换来的是「远处的车不会小成一个点」 */
function softFloor(d, m) { return m * Math.pow(1 + Math.pow(d / m, 4), .25); }
const MIN_CAR_W = 7;

/* 快贴到镜头上的东西淡出去：不淡的话，一个锥筒擦身而过时会瞬间涨满整屏 */
const NEAR_FADE = PLAYER_Z * .85, NEAR_GONE = PLAYER_Z * .30;
function nearAlpha(cz) {
  if (cz >= NEAR_FADE) return 1;
  if (cz <= NEAR_GONE) return 0;
  return (cz - NEAR_GONE) / (NEAR_FADE - NEAR_GONE);
}
/* 远处的东西按雾量降透明度。背景本来就是雾色，压透明度等价于混雾，还不用改颜色。
   指数 1.7 让它比路面晚一步糊掉 —— 车是要看的，路只是背景。 */
function fogAlpha(seg) {
  const f = seg.fogI / (FOG_STEPS - 1);
  return 1 - Math.pow(f, 1.7) * .82;
}
function renderScenery(seg, item) {
  const p = seg.p1;
  if (p.scale <= 0) return;
  const a = nearAlpha(p.cz) * fogAlpha(seg);
  if (a <= .02) return;
  let destW = p.scale * (item.sp.ww || 1200) * W / 2;
  if (item.hazard) destW = softFloor(destW, MIN_CAR_W * PX);
  const cx = p.sx + p.scale * item.off * ROAD_W * W / 2;
  if (cx < -destW || cx > W + destW) return;
  drawSpriteAt(item.sp, cx, p.sy + 1, destW, seg.clip, a);
}

/* 影子：贴地的一枚扁椭圆，让车不像飘着 */
function groundShadow(cx, y, w) {
  if (w < 2) return;
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  const h = Math.max(1, w * .13);
  for (let i = 0; i < h; i++) {
    const t = (i + .5) / h, k = Math.sqrt(Math.max(0, 1 - (t * 2 - 1) * (t * 2 - 1)));
    ctx.fillRect(Math.round(cx - w * .5 * k), Math.round(y - h / 2 + i), Math.max(1, Math.round(w * k)), 1);
  }
}

/* 演员全部矢量现画：把坐标系挪到它的落地点、按目标宽度缩放，剩下的交给绘制函数。
   描边粗细要反向除掉缩放，否则近处的车一圈黑边、远处的车没有边 */
function renderActor(seg, a) {
  const p1 = seg.p1, p2 = seg.p2;
  const t = clamp((a.z - p1.z) / SEG_LEN, 0, 1);
  const scale = lerp(p1.scale, p2.scale, t);
  if (scale <= 0) return;
  const fade = nearAlpha(lerp(p1.cz, p2.cz, t)) * fogAlpha(seg);
  if (fade <= .02) return;
  const sx = lerp(p1.sx, p2.sx, t), sy = lerp(p1.sy, p2.sy, t);
  const ww = a.worldW ? a.worldW() : (a.ww || RIDER_WW);
  let destW = scale * ww * W / 2;
  if (a.kind === 'car') destW = softFloor(destW, MIN_CAR_W * PX);
  if (destW < .8) return;
  const cx = sx + scale * a.x * ROAD_W * W / 2;
  if (cx < -destW * 1.4 || cx > W + destW * 1.4) return;
  const air = (a.air || 0) * scale * H * .5;
  const bottomY = sy + air * 0 - air + (a.bob || 0) * PX + 1;
  groundShadow(cx, sy + 1, destW * .74);

  const k = destW / 100;
  const ink = destW < 16 * PX ? 0 : 1.35 * PX / k;    // 小到一定程度就不描边了
  ctx.save();
  if (seg.clip < H - .5) { ctx.beginPath(); ctx.rect(0, 0, W, seg.clip); ctx.clip(); }
  const al = Math.min(fade, a.alpha == null ? 1 : a.alpha);
  if (al < 1) ctx.globalAlpha = al;
  ctx.translate(cx, bottomY);
  ctx.scale(k, k);
  a.drawVec(ctx, ink);
  ctx.restore();
  a._sx = cx; a._sy = sy - air; a._sw = destW;         // 供打击特效定位
  if (a.kind === 'rider' && !a.isPlayer && a.state === 'ride' && Game.state === 'race' && destW > 14 * PX) {
    const dz = a.z - Player.z;
    if (dz > -250 && dz < 3200 && Math.abs(a.x - Player.x) < 1.1) Tags.push({ a, x: cx, y: bottomY, w: destW, al });
  }
}

/* ---------- 贴身对手头顶：名字、血条、出手前的感叹号 ----------
   原来够不够得着、他还剩几口血、他是不是正要打你，全靠猜。 */
const Tags = [];
function renderTags() {
  const f = Math.round(clamp(7.5 * PX, 9, 22));
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.font = '800 ' + f + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  for (const t of Tags) {
    const a = t.a, bw = clamp(t.w * .55, 26 * PX, 60 * PX), bh = Math.max(3, 3 * PX);
    const top = t.y - t.w * 1.14, x0 = t.x - bw / 2;
    ctx.globalAlpha = Math.max(.35, t.al);
    const p = clamp(a.hp / a.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(x0 - 1.5, top - 1.5, bw + 3, bh + 3);
    ctx.fillStyle = p < .3 ? '#e03c28' : p < .6 ? '#f8d038' : '#38c058';
    ctx.fillRect(x0, top, bw * p, bh);
    const nm = (a.boss ? '★' : '') + a.pal.nm + (a.wep ? ' · ' + WEPS[a.wep].nm : '');
    ctx.fillStyle = '#000'; ctx.fillText(nm, t.x + 1, top - 2 * PX + 1);
    ctx.fillStyle = a.isCop ? '#7ea8ff' : a.boss ? '#f8d038' : (a.wep ? '#f08820' : '#f4f0e4'); ctx.fillText(nm, t.x, top - 2 * PX);
    if (a.windT > 0) warnMark(t.x, top - f - 15 * PX, 1, a.armorT > 0);
  }
  ctx.globalAlpha = 1;
  Tags.length = 0;
}
/* 红底白色感叹号，一跳一跳的；hard 时外面多一圈黄，表示这一下打不断 */
function warnMark(x, y, k, hard) {
  const r = (7.5 + 1.8 * Math.sin(frameCount * .6)) * PX * k;
  // 黄圈：这一下打不断，只能躲
  if (hard) { ctx.beginPath(); ctx.arc(x, y, r + 4 * PX, 0, TAU); ctx.fillStyle = '#f8d038'; ctx.fill(); }
  ctx.beginPath(); ctx.arc(x, y, r + 1.5 * PX, 0, TAU); ctx.fillStyle = '#000'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = '#e03c28'; ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 1.3 * PX * k, y - r * .58, 2.6 * PX * k, r * .72);
  ctx.fillRect(x - 1.3 * PX * k, y + r * .28, 2.6 * PX * k, 2.6 * PX * k);
}

/* ---------- 后视镜 ----------
   身后的人看不见：挨的打里有四分之一以上来自身后。初代 Road Rash 仪表盘上就有后视镜。
   这里在距离条下面放一块小镜子：近处在下、远处在上，左右跟路面一致。
   正在蓄力要打你的人画成红圈；贴在身后正要打你的，另外在你车边上冒感叹号。 */
const MIRROR_BACK = 5200;
function renderMirror() {
  if (Game.state !== 'race') return;
  const P = Player, w = Math.min(W * .22, 132 * PX), h = 30 * PX;
  const x0 = W / 2 - w / 2, y0 = H * .155;
  ctx.globalAlpha = .9;
  ctx.fillStyle = 'rgba(8,8,16,.55)'; ctx.strokeStyle = 'rgba(244,240,228,.35)'; ctx.lineWidth = Math.max(1, PX * .8);
  ctx.beginPath(); ctx.moveTo(x0 + w * .30, y0); ctx.lineTo(x0 + w * .70, y0); ctx.lineTo(x0 + w, y0 + h); ctx.lineTo(x0, y0 + h); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(244,240,228,.6)';                         // 你自己：底边中间一个小三角
  ctx.beginPath(); ctx.moveTo(W / 2, y0 + h - 5 * PX); ctx.lineTo(W / 2 - 3.5 * PX, y0 + h - .5 * PX); ctx.lineTo(W / 2 + 3.5 * PX, y0 + h - .5 * PX); ctx.closePath(); ctx.fill();
  for (const r of allRiders()) {
    if (r === P || r.state !== 'ride') continue;
    const dz = P.z - r.z;
    if (dz < 150 || dz > MIRROR_BACK) continue;
    const t = dz / MIRROR_BACK;                                     // 0 近 → 1 远
    const half = w * .5 * (1 - t * .62);
    const x = W / 2 + clamp((r.x - P.x) / 1.3, -1, 1) * half * .9;
    const y = y0 + h - 7 * PX - t * (h - 10 * PX);
    const rad = (4.2 - 2 * t) * PX;
    if (r.windT > 0) { ctx.beginPath(); ctx.arc(x, y, rad + 3 * PX, 0, TAU); ctx.fillStyle = (frameCount & 4) ? '#ff3020' : '#ffd0c0'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU);
    ctx.fillStyle = r.isCop ? ((frameCount % 16) < 8 ? '#4a68ff' : '#ff3020') : r.pal.j; ctx.fill();
    ctx.lineWidth = Math.max(1, PX * (r.boss ? 1.8 : .9)); ctx.strokeStyle = r.boss ? '#f8d038' : '#000'; ctx.stroke();
    // 贴在身后、头顶感叹号看不见的：在你车边上另外冒一个
    if (dz >= 250 && dz < 1600 && r.windT > 0 && P._sx != null) warnMark(P._sx + sign(r.x - P.x || 1) * P._sw * .7, P._sy - P._sw * .75, .9);
  }
  ctx.globalAlpha = 1;
}

let frameCount = 0;

function render() {
  const theme = Road.theme, segs = Road.segs, N = segs.length;
  const P = Player;

  // 相机
  const camZ = P.z - PLAYER_Z;
  const baseSeg = segAt(camZ);
  const basePct = ((camZ % SEG_LEN) + SEG_LEN) % SEG_LEN / SEG_LEN;
  const pSeg = segAt(P.z);
  const camY = roadY(pSeg, P.z) + CAM_H;

  horizonY = H * .52;

  ctx.save();
  if (Cam.shakeT > 0) {
    const s = Cam.shake * Cam.shakeT * Cam.shakeT * PX, p = Cam.shakeP;
    ctx.translate(Math.sin(p * 37) * s, Math.sin(p * 23.5 + 1.1) * s);
  }

  renderSky(theme, baseSeg, camY);

  // ---- 路面：由近及远，带遮挡裁剪；连续同色带并成一条路带一次画完 ----
  let maxy = H, x = 0, dx = -(baseSeg.curve * basePct);
  const camXw = Cam.x * ROAD_W;
  let run = null;
  const flushRun = () => { if (run) { if (run.pend) run.pts.push(run.pend); drawRun(run); run = null; } };
  for (let n = 0; n < DRAW_DIST; n++) {
    const seg = segs[(baseSeg.i + n) % N];
    // 绕回赛道起点时，把相机 z 往前挪一整圈，几何本身不动
    const cz = camZ - (seg.i < baseSeg.i ? Road.length : 0);
    project(seg.p1, camXw - x,      camY, cz);
    project(seg.p2, camXw - x - dx, camY, cz);
    x += dx; dx += seg.curve;
    const q = n / DRAW_DIST;
    seg.fogI = Math.min(FOG_STEPS - 1, Math.round((1 - Math.exp(-theme.fogN * FOG_SCALE * q * q)) * (FOG_STEPS - 1)));
    seg.clip = maxy;
    if (seg.p1.cz <= camDepth || seg.p2.sy >= seg.p1.sy || seg.p2.sy >= maxy) { flushRun(); continue; }

    // 一条明暗带占 RUMBLE_LEN 段。它在屏幕上不到 MERGE_PX 高时，交替就只剩闪烁，
    // 这段之后一律走中间色（band=2）；顺带把远处几百段并进同一条路径里。
    const band = (seg.p1.sy - seg.p2.sy) * RUMBLE_LEN < MERGE_PX * PX ? 2 : (seg.dark ? 0 : 1);
    if (!run || run.band !== band || run.tun !== seg.tunnel || run.fogI !== seg.fogI) {
      flushRun();
      run = { band, tun: seg.tunnel, fogI: seg.fogI, pend: null,
              pts: [edgeAt(seg, Math.min(seg.p1.sy, maxy))] };
    }
    // 远端一段只推进零点几个像素，逐段落点纯属浪费。攒着，等够半个像素（或者横向
    // 跑开了，弯道上不能拿直线糊弄）再落一个点；剩下的尾巴在 flush 时补上。
    const pt = { y: seg.p2.sy, cx: seg.p2.sx, w: seg.p2.sw }, tail = run.pts[run.pts.length - 1];
    if (tail.y - pt.y > .5 || Math.abs(pt.cx - tail.cx) > 2) { run.pts.push(pt); run.pend = null; }
    else run.pend = pt;

    maxy = seg.p2.sy;
    if (maxy < 0) { flushRun(); for (let k = n + 1; k < DRAW_DIST; k++) segs[(baseSeg.i + k) % N].clip = 0; break; }
  }
  flushRun();
  if (theme.wall) renderWalls(baseSeg.i);

  // ---- 精灵：由远及近 ----
  for (let n = DRAW_DIST - 1; n >= 0; n--) {
    const seg = segs[(baseSeg.i + n) % N];
    const sl = seg.sprites;
    for (let i = 0; i < sl.length; i++) renderScenery(seg, sl[i]);
    const al = seg.actors;
    for (let i = 0; i < al.length; i++) renderActor(seg, al[i]);
  }

  renderTags();
  renderFx();
  ctx.restore();
  renderOverlay();
  renderMirror();
  frameCount++;
}

/* ---------- 打击 / 速度 / 伤害 等画面特效 ---------- */
const Fx = { hits: [], sparks: [], texts: [] };
function popText(x, y, txt, col) { Fx.texts.push({ x, y, txt, col: col || '#fff', t: 0 }); if (Fx.texts.length > 8) Fx.texts.shift(); }
function addHit(x, y, big) { Fx.hits.push({ x, y, t: 0, big }); }
function addSpark(x, y, n, col) { for (let i = 0; i < n; i++)
  Fx.sparks.push({ x, y, vx: (Math.random() - .5) * 90 * PX, vy: (-Math.random() * 70 - 10) * PX, t: 0, col }); }

function renderFx() {
  for (const h of Fx.hits) {
    const r = (h.big ? 13 : 8) * PX * (.4 + h.t * 5);
    const a = clamp(1 - h.t * 5, 0, 1);
    for (let i = 0; i < (h.big ? 8 : 6); i++) {
      const ang = i * TAU / (h.big ? 8 : 6) + h.t * 4;
      ctx.fillStyle = 'rgba(255,' + (200 + i * 6) + ',80,' + a + ')';
      ctx.fillRect(h.x + Math.cos(ang) * r, h.y + Math.sin(ang) * r * .6, 2 * PX, 2 * PX);
    }
    if (h.t < .05) { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(h.x - 3 * PX, h.y - 2 * PX, 6 * PX, 4 * PX); }
  }
  for (const s of Fx.sparks) {
    ctx.fillStyle = s.col; ctx.fillRect(s.x, s.y, 1.4 * PX, 1.4 * PX);
  }
  if (Fx.texts.length) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + Math.round(11 * PX) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    for (const f of Fx.texts) {
      const a = clamp(1.4 - f.t * 1.6, 0, 1), y = f.y - f.t * 22 * PX;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#000'; ctx.fillText(f.txt, f.x + 1.5 * PX, y + 1.5 * PX);
      ctx.fillStyle = f.col;  ctx.fillText(f.txt, f.x, y);
    }
    ctx.globalAlpha = 1;
  }
}

function updateFx(dt) {
  for (let i = Fx.hits.length - 1; i >= 0; i--) { Fx.hits[i].t += dt; if (Fx.hits[i].t > .22) Fx.hits.splice(i, 1); }
  for (let i = Fx.texts.length - 1; i >= 0; i--) { Fx.texts[i].t += dt; if (Fx.texts[i].t > .9) Fx.texts.splice(i, 1); }
  for (let i = Fx.sparks.length - 1; i >= 0; i--) {
    const s = Fx.sparks[i]; s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * PX * dt;
    if (s.t > .5) Fx.sparks.splice(i, 1);
  }
  if (Cam.shakeT > 0) { Cam.shakeT = Math.max(0, Cam.shakeT - dt * 4.6); Cam.shakeP += dt; }
  if (nitroFlash > 0) nitroFlash = Math.max(0, nitroFlash - dt * 2.5);
  // 俯冲量渐变过去。硬切会让每一次轻微离地都甩一下画面
  const dipT = Player.airTime > .10 ? -6 * PX : 0;
  Cam.dip = approach(Cam.dip, dipT, 7, dt);
}
/* 新的抖动只在比现有残量更强时才接管，否则连续小碰撞会不断把相位重置成满幅 */
function shake(amt) {
  const cur = Cam.shake * Cam.shakeT;
  if (amt <= cur) return;
  Cam.shake = amt; Cam.shakeT = 1; Cam.shakeP = Math.random() * 10;
}

/* ---------- 天气 ----------
   雨丝一条路径描完。每根的位置由序号散列出来、随时间往下落，不存状态，暂停时自然停住 */
const Weather = { t: 0, bolt: 0, boltT: 6 };
function updateWeather(dt) {
  Weather.t += dt;
  if (Weather.bolt > 0) Weather.bolt = Math.max(0, Weather.bolt - dt * 2.4);
  if (!Road.theme || !Road.theme.rain) return;
  Weather.boltT -= dt;
  if (Weather.boltT <= 0) {
    Weather.boltT = 5 + Math.random() * 9;
    Weather.bolt = 1; flash = Math.max(flash, .1);
    sfx('thunder', .55 + Math.random() * .45, .3 + Math.random() * 1.1);   // 光先到，雷声晚一点
  }
}
function renderRain() {
  const P = Player, sp = clamp(P.speed / P.maxSpeed, 0, 1), t = Weather.t;
  const slant = .2 + Cam.look * .8 + (P.vx || 0) * .2;
  ctx.strokeStyle = 'rgba(175,195,235,' + (.2 + Weather.bolt * .3).toFixed(3) + ')';
  ctx.lineWidth = Math.max(1, PX * .7);
  ctx.beginPath();
  for (let i = 0; i < 130; i++) {
    const a = (i * .6180339) % 1, b = (i * .7548776) % 1, c = (i * .5698403) % 1;
    const y = ((b * H * 1.2 + t * H * (1.9 + c * 1.3)) % (H * 1.2)) - H * .1;
    const x = ((a * W * 1.3 + t * W * slant * .45) % (W * 1.3)) - W * .15;
    const len = (9 + c * 15) * PX * (1 + sp * .9);
    ctx.moveTo(x, y); ctx.lineTo(x - slant * len * .6, y + len);
  }
  ctx.stroke();
}

/* 速度线 + 伤害暗角 + 闪白 */
let flash = 0;
function renderOverlay() {
  const P = Player, sp = P.speed / P.maxSpeed;
  if (sp > .55 && Game.state === 'race') {
    const n = Math.round((sp - .55) * 26);
    ctx.fillStyle = P.boostT > 0 ? 'rgba(170,230,255,' + (.16 + (sp - .55) * .3) + ')'
                                 : 'rgba(255,255,255,' + (.08 + (sp - .55) * .3) + ')';
    for (let i = 0; i < n; i++) {
      const a = (i * 2.39996 + frameCount * .35) % TAU;
      const r = H * (.30 + ((i * 7 + frameCount * 3) % 60) / 60 * .7);
      const x = W / 2 + Math.cos(a) * r * 1.5, y = horizonY + Math.sin(a) * r;
      const len = (3 + (sp - .55) * 22) * PX;
      ctx.fillRect(x, y, Math.cos(a) * len, 1.2 * PX);
    }
  }
  const hp = P.hp / P.maxHp;
  if (hp < .45 && Game.state !== 'pre') {
    const a = (1 - hp / .45) * (.22 + .12 * Math.sin(frameCount * .18));
    const g = ctx.createRadialGradient(W / 2, H / 2, H * .28, W / 2, H / 2, H * .78);
    g.addColorStop(0, 'rgba(180,20,10,0)'); g.addColorStop(1, 'rgba(180,20,10,' + a.toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (Road.theme && Road.theme.rain) renderRain();
  if (Road.theme && Road.theme.night) {
    const g = ctx.createRadialGradient(W / 2, H * .62, H * .3, W / 2, H * .62, H * .95);
    g.addColorStop(0, 'rgba(0,0,10,0)'); g.addColorStop(1, 'rgba(0,0,12,.5)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (P.boostT > 0 || nitroFlash > 0) {
    const a = Math.min(.34, (P.boostT > 0 ? .16 + .05 * Math.sin(frameCount * .5) : 0) + nitroFlash * .5);
    const g = ctx.createRadialGradient(W / 2, horizonY, H * .3, W / 2, horizonY, H * .9);
    g.addColorStop(0, 'rgba(60,190,255,0)'); g.addColorStop(1, 'rgba(60,190,255,' + a.toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash.toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
}
/* ==========================================================================
   13. 车与车手
   ========================================================================== */
const BIKES = [
  { nm:'街车 250',   sub:'STREET 250',  price:0,     top:9600,  acc:.82, hand:1.06, arm:1.0 },
  { nm:'仿赛 600',   sub:'RACER 600',   price:1200,  top:11200, acc:1.00, hand:.96, arm:1.0 },
  { nm:'公升 1000',  sub:'LITRE 1000',  price:3600,  top:12900, acc:1.18, hand:.87, arm:1.08 },
  { nm:'改装怪物',   sub:'THE BEAST',   price:9000,  top:14600, acc:1.42, hand:.79, arm:1.18 },
  { nm:'超跑 1300',  sub:'HYPER 1300',  price:20000, top:16000, acc:1.62, hand:.74, arm:1.25 },
];
/* shove：打中之后把人往外顶多远（路宽的比例）；stun：僵直多久。
   双节棍：出手最快，每一下轻，顶不动人 —— 打断蓄力最顺手。
   撬棍：够得短、出手慢，但一下最疼、顶得最远，窄路上一棍就能把人抡到护栏上。 */
const WEPS = [
  { nm:'徒手',   reach:.30, dmg:14, cd:.32, snd:'kick',    shove:.17, stun:.34 },
  { nm:'木棍',   reach:.44, dmg:24, cd:.42, snd:'club',    shove:.17, stun:.34 },
  { nm:'铁链',   reach:.56, dmg:32, cd:.50, snd:'chain',   shove:.17, stun:.34 },
  { nm:'双节棍', reach:.40, dmg:17, cd:.24, snd:'nunchuk', shove:.10, stun:.30 },
  { nm:'撬棍',   reach:.38, dmg:38, cd:.58, snd:'bar',     shove:.30, stun:.52 },
];

function makeRider(pal) {
  return {
    kind:'rider', pal,
    z:0, x:0, speed:0, maxSpeed:11000, acc:1, hand:1, arm:1,
    hp:100, maxHp:100, wep:0, wepUses:0,
    lean:0, steer:0, atkT:0, atkSide:0, atkCd:0, stun:0, hitFlash:0, windT:0, windSide:0, armorT:0, guardT:0,
    nitro:0, boostT:0, draftT:0, wallT:0, slideT:0, slideDir:0,
    y:0, vy:0, airTime:0, lastGroundY:0, air:0, bob:0,
    state:'ride', downT:0, runT:0, runFrame:0, alpha:1,
    rank:1, done:false, doneT:0, brake:false,
    worldW() { return this.state === 'down' ? 470
             : (this.state === 'run' || this.state === 'remount') ? 190 : RIDER_WW; },
    drawVec(g, ink) {
      if (this.state === 'down') { drawTumble(g, this.pal, (this.downT * 1.6) % 1, ink); return; }
      if (this.state === 'run')  { drawRunner(g, this.pal, 1 + (Math.floor(this.runFrame) % 2), ink); return; }
      if (this.state === 'remount') { drawRunner(g, this.pal, 0, ink); return; }
      drawRider(g, this.pal, {
        tilt: this.lean, wep: this.wep, brake: this.brake,
        atk: this.atkT > 0 ? this.atkSide : 0,
        wind: this.windT > 0 ? this.windSide : 0,
        nitro: this.boostT > 0,
        hit: this.hitFlash > 0 && ((frameCount >> 1) & 1) === 0,
        cop: this.isCop, flash: (frameCount % 16) < 8,
      }, ink);
    },
  };
}

const Player = makeRider(PLAYER_PAL);
Player.isPlayer = true;
const Rivals = [];
let Cop = null;
const Traffic = [];
const Pickups = [];
let PlayerWreck = null;

/* ==========================================================================
   14. 玩家物理
   ========================================================================== */
const GRAV = 13000;            // 调到「缓坡贴地、急坡起飞」的临界之下
const OFFROAD_MAX = .58;       // 冲出路面后的最高速度比例

function riderGravity(r, dt) {
  const seg = segAt(r.z), gy = roadY(seg, r.z);
  r.vy -= GRAV * (r.airTime > .32 ? 3.4 : 1) * dt;   // 起跳干脆，滞空不拖沓
  r.y += r.vy * dt;
  if (r.y <= gy) {
    if (r.airTime > .14) onLand(r);
    r.y = gy; r.vy = (gy - r.lastGroundY) / Math.max(dt, .001); r.airTime = 0;
  } else r.airTime += dt;
  r.lastGroundY = gy;
  r.air = (r.y - gy) / 900;                      // 给渲染用的抬升量
  return seg;
}
function onLand(r) {
  // 起伏路上一秒能弹好几次，小跳给小反馈，否则画面一路在震
  if (r !== Player) return;
  const hard = clamp((r.airTime - .14) / .45, 0, 1);
  shake(1.1 + hard * 3.2);
  if (hard > .12) sfx('land');
  r.speed *= 1 - .05 * hard;
}

/* 相机往弯里转一点。
   直视正前方时，急弯的路面横着滑出屏幕的位置只有 44 段（满速 0.6 秒）—— 对向车
   等于是从画面外冒出来的，而横穿整条路要 0.9~1.2 秒，怎么打都来不及。
   取前方一段路的平均曲率，把整幅画面朝弯里平移。平移量跟深度无关，所以是"转头
   看"而不是"把弯掰直"：路还是那么弯，只是弯心留在了画面里。
   代价是车会往弯外滑一点，LOOK_MAX 就是这个滑动的上限（屏宽的百分比）。 */
const LOOK_AHEAD = 60, LOOK_GAIN = .045, LOOK_MAX = .22;
// 相机横跟的速率，和它允许的横滑上限（路宽的比例）。
// CAM_SLIDE 一头是画面上车能左右滑多远，一头是反打要几帧才见效（相机得先滑过
// 这段距离才反向）：.05 两帧但偏钉，.08 三帧、滑感在，再大就重新有延迟感了。
const CAM_RATE = 11, CAM_SLIDE = .08;
function updateLook(dt) {
  const segs = Road.segs, base = segAt(Player.z).i;
  let c = 0;
  for (let k = 0; k < LOOK_AHEAD; k++) c += segs[(base + k) % segs.length].curve;
  const want = clamp(c / LOOK_AHEAD * LOOK_GAIN, -LOOK_MAX, LOOK_MAX);
  // 慢一点跟，免得连续 S 弯里画面左右甩
  Cam.look = approach(Cam.look, want, 3.2, dt);
}

function updatePlayer(dt) {
  const P = Player;
  const seg = riderGravity(P, dt);
  const sp = P.speed / P.maxSpeed;
  P.vx = 0;

  if (P.state === 'ride') {
    // 油门 / 刹车 / 氮气
    if (P.boostT > 0) { P.boostT = Math.max(0, P.boostT - dt); P.speed += BOOST_ACC * dt; }
    else if (Input.gas) { if (sp < 1) P.speed += P.acc * 5200 * dt * (1 - sp * .55); }
    else P.speed -= 2600 * dt;
    const T = Road.theme, wet = T.grip || 1;
    if (Input.brake) { P.speed -= 9000 * wet * dt; P.brake = true; P.boostT = 0; } else P.brake = false;
    updateDraft(dt);
    if (P.stun > 0) { P.speed -= 3000 * dt; P.stun -= dt; }

    /* 转向：速度越高越迟钝，空中不能转。
       高速端原来太钝：满速横穿整条路要 1.18 秒，而急弯里对向车最快 0.5 秒就到
       跟前 —— 看见了也躲不掉。放缓了一次仍嫌肉，这轮再动两处：
       一是高速端几乎不再衰减（1.85 - sp*.12），二是把手感的死区——按下到
       打满舵的那段斜坡——从 14 提到 26，反打（推反方向）时 60，基本是瞬间回中。
       满速一次变道 0.42s → 0.28s，横穿整条路 0.88s → 0.61s。 */
    // 空中几乎转不了；雨天路滑整体打折；压上油污、积水那一下基本失控
    const grip = (P.airTime > 0 ? .12 : 1) * wet * (P.slideT > 0 ? SLIDE_GRIP : 1);
    const steerPow = P.hand * (1.85 - sp * .12) * grip;
    const dir = Input.right - Input.left;            // 键盘 ±1，触屏摇杆是 -1..1 的模拟量
    // 反打远快于同向起舵：躲车基本都是"正往左走，突然要往右"，慢在这一下最难受
    P.steer = approach(P.steer, dir, dir * P.steer < 0 ? 60 : 26, dt);
    // vx 单独存一份给相机做前馈（见 update() 末尾）。只算"我想往哪打"的那部分，
    // 离心力不算 —— 弯里镜头该往弯里转（Cam.look 的事），不该被甩出去的分量带跑。
    P.vx = P.steer * steerPow * (.40 + sp * .88);
    P.x += P.vx * dt;

    if (P.slideT > 0) {                               // 打滑：往压上去那一刻的方向横着溜，越到后面越稳
      P.slideT -= dt;
      P.x += P.slideDir * SLIDE_DRIFT * sp * Math.min(1, P.slideT * 1.6) * dt;
    }
    // 离心力：过弯被甩向外侧（路滑甩得更狠）
    P.x -= seg.curve * .00060 * sp * sp * dt * 60 * (2 - wet);

    // 护墙：出不了路，但贴上去要掉速掉血
    const wl = T.wall, lim = wl ? wl.x - WALL_GAP : 0;
    if (wl && Math.abs(P.x) > lim) {
      const s = sign(P.x);
      P.x = s * lim;
      if (P.wallT <= 0 && sp > .25) {                 // 撞上去的那一下
        P.hp -= 3 + 9 * sp; P.speed *= .92; P.steer *= .2;
        shake(2.5 + 3 * sp); sfx('wall'); updateHpHud();
      }
      P.wallT = .3;
      P.speed -= (900 + 3000 * sp) * dt; P.hp -= 4 * sp * dt;
      if (frameCount % 5 === 0 && P._sx != null) addSpark(P._sx + s * P._sw * .42, P._sy - P._sw * .1, 3, '#ffd070');
      if (P.hp <= 0) wipeout(P, '撞烂在护栏上');
    } else if (P.wallT > 0) P.wallT -= dt;

    // 出界：草地/泥地拖速度
    if (Math.abs(P.x) > 1) {
      const over = Math.abs(P.x) - 1;
      P.speed = Math.min(P.speed, P.maxSpeed * OFFROAD_MAX);
      P.speed -= over * 9000 * dt;
      if (P.speed > 2000 && frameCount % 10 === 0) { shake(1.6); }
      if (Math.abs(P.x) > 1.9) { P.x = sign(P.x) * 1.9; wipeout(P, '撞出赛道'); }
    }
    P.lean = approach(P.lean, clamp(P.steer * .8 + seg.curve * .09 * sp, -1, 1), 13, dt);

  } else if (P.state === 'down') {
    P.downT += dt;
    P.speed = approach(P.speed, 0, 3.4, dt);
    if (P.downT > 1.15) { P.state = 'run'; P.runFrame = 0; P.runT = 0; }

  } else if (P.state === 'run') {
    // 徒步追车：车在前面停着，跑过去骑上。
    // 人会自己朝车跑（谁会朝反方向找自己的车），按键只是微调左右躲来车。
    P.speed = 1500; P.runT += dt;
    const dir = Input.right - Input.left;
    if (PlayerWreck) P.x = approach(P.x, PlayerWreck.x, 2.2, dt);
    P.x = clamp(P.x + dir * .7 * dt, -1.4, 1.4);
    P.runFrame += dt * 9;
    if (PlayerWreck) {
      const dz = PlayerWreck.z - P.z, dx = PlayerWreck.x - P.x;
      // 窗口放宽，再加一道保险：跑过头或跑太久都直接算够着了，
      // 不然一旦越过车就再也回不去，这一场就废在路上了
      if ((dz < 800 && dz > -1600 && Math.abs(dx) < .4) || P.runT > 6) {
        P.state = 'remount'; P.remT = 0; sfx('start');
      }
    } else { P.state = 'remount'; P.remT = 0; }
  } else if (P.state === 'remount') {
    P.remT += dt; P.speed = 1500;
    if (P.remT > .55) {
      P.state = 'ride'; P.hp = Math.max(P.hp, P.maxHp * Diff().remount);
      if (PlayerWreck) { P.x = PlayerWreck.x; P.z = PlayerWreck.z; PlayerWreck = null; }
      P.speed = 2600; P.stun = 0;
    }
  }

  // 氮气期间可以冲过车的极速；烧完之后慢慢回落，不是一下被掐回去
  const cap = P.maxSpeed * (P.boostT > 0 ? BOOST_TOP : 1);
  if (P.speed > cap) P.speed = approach(P.speed, cap, P.boostT > 0 ? 20 : 1.5, dt);
  P.speed = Math.max(0, P.speed);
  P.z += P.speed * dt;
  P.bob = P.state === 'ride' ? Math.sin(frameCount * .9) * (sp > .3 ? 1 : 0) : 0;
  if (P.atkT > 0) P.atkT -= dt;
  if (P.atkCd > 0) P.atkCd -= dt;
  if (P.hitFlash > 0) P.hitFlash -= dt;
  if (P.guardT > 0) P.guardT -= dt;
}

/* ---------- 氮气 ----------
   原来"冒险"没有任何回报：擦着来车过去、贴着对手的尾流、把人踹下车，都不会让你更快。
   现在这些都往氮气槽里充，槽满三格，一格烧 BOOST_T 秒、能冲过车的极速。
   战斗和竞速从此互相喂：打得好 → 有氮气 → 追得上 → 又贴得上人。 */
const NITRO_MAX = 100, NITRO_COST = 33;
const BOOST_T = 1.3, BOOST_TOP = 1.22, BOOST_ACC = 7000;
const NEAR_BAND = .11;               // 离车身这么近擦过去算"擦车"
let nitroFlash = 0;
function addNitro(n, label) {
  const P = Player;
  if (P.state !== 'ride' || Game.state !== 'race') return;
  const before = P.nitro;
  P.nitro = Math.min(NITRO_MAX, P.nitro + n);
  if (label) popText(P._sx != null ? P._sx : W / 2, (P._sy != null ? P._sy : H * .8) - (P._sw || 60) * .9, label, '#7ee8ff');
  if (Math.floor(before / NITRO_COST) < Math.floor(P.nitro / NITRO_COST)) sfx('charge');
}
function fireNitro() {
  const P = Player;
  if (P.state !== 'ride' || P.nitro < NITRO_COST || P.boostT > BOOST_T * 1.5) return false;
  P.nitro -= NITRO_COST; P.boostT += BOOST_T; P.brake = false;
  sfx('nitro'); shake(2.4); nitroFlash = .4;
  return true;
}
/* 尾流：贴在对手正后方一段距离，氮气慢慢涨 */
function updateDraft(dt) {
  const P = Player;
  let behind = false;
  if (P.speed > P.maxSpeed * .6) {
    for (const r of allRiders()) {
      if (r === P || r.state !== 'ride') continue;
      const dz = r.z - P.z;
      if (dz > 250 && dz < 2400 && Math.abs(r.x - P.x) < .12) { behind = true; break; }
    }
  }
  if (behind) {
    P.draftT += dt;
    if (P.draftT > .35) addNitro(16 * dt, P.draftT - dt <= .35 ? '尾流' : null);
  } else P.draftT = 0;
}

/* ==========================================================================
   15. 摔车 / 被捕
   ========================================================================== */
const CATCH_T = 12;
function wipeout(r, why) {
  if (r.state !== 'ride') return;
  r.state = 'down'; r.downT = 0; r.hp = 0; r.atkT = 0; r.windT = 0;
  if (r === Player) {
    sfx('crash'); shake(9); flash = .55; r.boostT = 0; r.draftT = 0;
    // 车往前滑一段停下
    PlayerWreck = { kind:'wreck', z: r.z + 2400 + r.speed * .22, x: clamp(r.x * .7, -.9, .9),
                    ww: 640, air:0, bob:0, drawVec: (g, ink) => drawWreck(g, PLAYER_PAL, ink) };
    Game.crashes++;
    Game.catchT = CATCH_T;                         // 摔车之后的这段时间里，落后的对手可以大步追上来
    toast(why || '摔了！', true);
  }
  if (r.wep > 0) { dropWeapon(r); r.wep = 0; if (r === Player) updateWepHud(); }
}
function dropWeapon(r) {
  Pickups.push({ kind:'pick', z: r.z - 300, x: clamp(r.x, -.9, .9), wep: r.wep, t:0, ww: 300,
                 air:0, bob:0, drawVec(g, ink) { drawPickup(g, this.wep, ink); } });
}

/* ==========================================================================
   16. 踹人
   ========================================================================== */
function allRiders() {
  const a = [Player];
  for (const r of Rivals) a.push(r);
  if (Cop) a.push(Cop);
  return a;
}
function doAttack(att, side) {
  if (att.state !== 'ride' || att.atkCd > 0 || att.stun > 0) return;
  const w = WEPS[att.wep];
  att.atkT = .26; att.atkSide = side; att.atkCd = w.cd;
  if (att === Player) sfx(w.snd);
  let landed = false;
  for (const o of allRiders()) {
    if (o === att || o.state !== 'ride') continue;
    const dz = o.z - att.z;
    if (dz > 900 || dz < -700) continue;
    const dx = o.x - att.x;
    if (sign(dx) !== side || Math.abs(dx) > w.reach * att.arm) continue;
    hitRider(o, w.dmg * (att === Player ? 1 : .82), side, att);
    landed = true;
  }
  if (!landed && att === Player) sfx('whiff');
}
/* 前摇。原来对手出脚那一帧就扣你的血，看得见也没用 —— 只能跟他比谁按得快。
   现在对手先抬手/收腿蓄一下（头上冒红色感叹号、有一声吸气），
   这段时间里你可以：闪开到他够不着的地方，让他打空；或者先下手，把他打断。 */
const WIND_RIVAL = [.46, .44, .41, .38, .36, .35, .34, .33];     // 按赛道：越往后越短（再乘难度的 wind）
const WIND_COP = .36;
function startWindup(r, side, t) {
  r.windT = Math.max(.26, t * Diff().wind); r.windSide = side;
  if (Game.state === 'race' && Math.abs(r.z - Player.z) < 3000) sfx('windup');
}
function tickWindup(r, dt) {
  if (r.windT <= 0) return;
  r.windT -= dt;
  if (r.windT <= 0) { r.windT = 0; doAttack(r, r.windSide); }
}
/* 两道保护，免得狂按踹人就能把人一直按在地上打：
   - GUARD_T：僵直过一次之后，这么久之内再挨打只掉血、不僵直。不然每 0.32 秒一脚、
     每脚僵直 0.34 秒，对手连蓄力都开始不了。
   - ARMOR_T：被打断过一次之后，这么久之内蓄力打不断（感叹号外面一圈黄）。
     他下一下你只能躲 —— 前摇是"给你反应的时间"，不是"他的死穴"。 */
const GUARD_T = .9, ARMOR_T = 1.6;
function hitRider(o, dmg, side, att) {
  const armored = o.armorT > 0 && !o.isPlayer;
  const broke = o.windT > 0 && !armored;         // 蓄力中挨打：动作被打断，伤害加成
  if (broke) { o.windT = 0; dmg *= 1.5; o.armorT = ARMOR_T; }
  o.hp -= dmg; o.hitFlash = .28;
  // 保护期内挨打只掉血：不僵直，也几乎不被顶开 —— 否则每一脚都把人踹出他自己的出手距离
  const staggered = broke || !(o.guardT > 0);
  const w = WEPS[att ? att.wep : 0] || WEPS[0];
  if (broke) { o.stun = .7; o.guardT = .7 + GUARD_T; }
  else if (staggered) { o.stun = w.stun; o.guardT = w.stun + GUARD_T; }
  if (staggered) { o.x += side * w.shove; o.speed *= .93; } else o.x += side * .03;
  // 被一下顶到护墙上：额外掉一截血、僵直更久。窄路上把人往墙上顶，比一下一下磨他快得多
  const wl = Road.theme && Road.theme.wall;
  let slam = false;
  if (wl && staggered && Math.abs(o.x) > wl.x - WALL_GAP) {
    o.x = sign(o.x) * (wl.x - WALL_GAP); slam = true;
    o.hp -= WALL_SLAM; o.stun = Math.max(o.stun, .6); o.speed *= .86;
  }
  const px = o._sx != null ? o._sx : W / 2, py = o._sy != null ? o._sy - 12 : H * .6;
  addHit(px, py, dmg > 14);
  addSpark(px, py, 5, '#ffe090');
  if (att === Player) {
    shake(dmg > 14 ? 6 : 4); freeze(dmg > 14 ? .085 : .055); sfx('hit');
    Game.hits++;
    if (broke) popText(px, py - 14 * PX, '打断！', '#ffe060');
    if (slam) { popText(px, py - (broke ? 28 : 14) * PX, '撞墙！', '#ffb040'); sfx('wall'); }
    addNitro((broke ? 12 : 4) + (slam ? 8 : 0));
    if (o.hp <= 0) {
      Game.takedowns++; addNitro(30, '撂倒 +氮气');
      if (o.boss && !o.bountyPaid) {
        o.bountyPaid = true; Game.bounty += o.boss.bounty;
        toast('悬赏到手 ★' + o.pal.nm + ' +$' + Math.round(o.boss.bounty * Diff().pay)); sfx('bounty');
      } else toast('干掉 ' + o.pal.nm + '！');
      if (!o.isCop) shout(o, SAY_HURT, true);
    }
  }
  if (o === Player) {
    shake(6); freeze(.07); sfx('hurt'); flash = .22;
    if (slam) sfx('wall');
    if (att && att.isCop) toast('警棍！', true);
    else if (att && o.hp <= 0) shout(att, att.pal.say && Math.random() < .5 ? att.pal.say : SAY_KO, true);

let freezeT = 0;
function freeze(t) { freezeT = Math.max(freezeT, t); }
const WALL_GAP = .08;              // 车身半宽：车心离墙这么近就算贴上了
const WALL_SLAM = 16;              // 被顶到墙上额外掉的血
/* 喊话：头顶冒一行字。普通的一句之后要隔几秒，force（被打下车那一下）不等 */
function shout(r, lines, force) {
  if (!lines || !lines.length || Game.state !== 'race' || r._sx == null || Math.abs(r.z - Player.z) > 3200) return;
  if (!force && Game.tauntCd > 0) return;
  Game.tauntCd = 4.5;
  popText(r._sx, r._sy - r._sw * 1.45, lines[(Math.random() * lines.length) | 0], r.boss ? '#f8d038' : '#ffc8a0');
}

/* ==========================================================================
   17. 对手 AI
   ========================================================================== */
/* 每条街对手的基准极速（实际再乘 .95~1.06）。
   原来是一条直线 9100 + diff*3700，跟车行的价格台阶对不上：就算场场第一、
   钱全砸在车上，第三场的仿赛和第五场的公升也比一半以上的对手慢。
   现在按「每场进前二、每次买得起就换车」那条进度配：那台车顶多慢过一个人。 */
/* 后三条街接着往上涨，但涨得比前五条缓：第六场按「场场第二」的进度刚好换得起改装怪物 */
const RIVAL_TOP = [9100, 9500, 10500, 11700, 12300, 12700, 13400, 13900];
/* 悬赏：第五场和最后一场各有一个头目，占掉发车最前面那个位置。
   血厚、手里有家伙、车比同场的人快一截；亲手把他打下车才给赏金（再乘难度的 pay） */
const BOSSES = {
  4: { pal:{ j:'#2a2a30', j2:'#141418', h:'#c02020', b:'#b01818', nm:'刀疤', say:['骨头挺硬啊', '这条街姓刀'] },
       spd:1.03, hp:1.9, wep:4, aggr:.95, skill:1.0, bounty:400 },
  7: { pal:{ j:'#18141c', j2:'#0a080c', h:'#f0c030', b:'#d0a020', nm:'阎王', say:['阎王要你三更死', '下辈子再跑吧'] },
       spd:1.05, hp:2.3, wep:2, aggr:1.15, skill:1.1, bounty:1000 },
};
/* 对手手里拿什么：前两条街只有棍子和铁链，往后才有双节棍、撬棍。只吃一个随机数，
   免得改了这里就把整场对手的其余属性都洗一遍 */
function rivalWeapon(rng, t) {
  const u = rng();
  if (t < 2) return u < .5 ? 1 : 2;
  if (t < 4) return u < .38 ? 1 : u < .76 ? 2 : 3;
  return u < .28 ? 1 : u < .56 ? 2 : u < .78 ? 3 : 4;
}
function spawnRivals(trackIdx) {
  Rivals.length = 0;
  const rng = makeRng(9001 + trackIdx * 31), D = Diff();
  const diff = Math.min(1, trackIdx / 4);          // 前五条街原来的那条难度线
  const late = Math.max(0, trackIdx - 4) / 3;      // 后三条街在上面再加一点
  const baseHp = (72 + diff * 46 + late * 24) * D.hp;
  /* 难度给的额外车速从第一场的 0 爬到第四场才给满：头一场谁都只有白送的街车，
     一上来就比大半对手慢，那不是难，是车速墙 */
  const spd = 1 + (D.spd - 1) * Math.min(1, trackIdx / 3);
  for (let i = 0; i < 7; i++) {
    const r = makeRider(RIDER_PAL[i]);
    r.maxSpeed = RIVAL_TOP[trackIdx] * spd * (.95 + rng() * .11);   // 对齐当场该有的车
    r.acc = .9 + rng() * .3; r.hand = 1; r.arm = 1;
    r.maxHp = r.hp = Math.round(baseHp);
    r.wep = rng() < Math.min(.92, (.12 + diff * .40 + late * .16) * D.wep) ? rivalWeapon(rng, trackIdx) : 0;
    r.aggr = (.22 + diff * .55 + late * .12 + rng() * .25) * D.aggr;      // 主动出手的意愿
    r.skill = Math.min(1.25, (.45 + diff * .4 + late * .1 + rng() * .2) * D.skill);   // 走线与避险能力
    r.laneT = 0; r.wantX = (rng() * 1.5 - .75);
    r.z = 800 + i * 420 + rng() * 200;
    r.x = (i % 2 ? 1 : -1) * (.18 + (i >> 1) * .22);
    r.speed = 3000; r.dzWas = r.z - Player.z;
    Rivals.push(r);
  }
  const B = BOSSES[trackIdx];
  if (B) {
    const r = Rivals[6];                              // 发车位最靠前的那个
    r.pal = B.pal; r.boss = B;
    r.maxSpeed = RIVAL_TOP[trackIdx] * spd * B.spd;
    r.maxHp = r.hp = Math.round(baseHp * B.hp);
    r.wep = B.wep; r.aggr = B.aggr * D.aggr; r.skill = Math.min(1.25, B.skill * D.skill);
  }
}
function updateRival(r, dt, i) {
  const seg = riderGravity(r, dt);
  if (r.state === 'down') {
    r.downT += dt; r.speed = approach(r.speed, 0, 3, dt);
    r.z += r.speed * dt;
    if (r.downT > 2.6) {                             // 爬起来接着跑
      r.state = 'ride'; r.hp = r.maxHp * .6; r.speed = 2400; r.x = clamp(r.x, -.8, .8); r.stun = 0;
    }
    return;
  }
  if (r.stun > 0) r.stun -= dt;
  if (r.atkT > 0) r.atkT -= dt;
  if (r.atkCd > 0) r.atkCd -= dt;
  if (r.hitFlash > 0) r.hitFlash -= dt;
  if (r.armorT > 0) r.armorT -= dt;
  if (r.guardT > 0) r.guardT -= dt;
  if (Game.state === 'race') tickWindup(r, dt); else r.windT = 0;

  /* 目标速度：领先太多的收一点，别让玩家摔一次就再也看不见人。
     落后的追赶原来是无条件的 ×1.14 —— 骑得好也拉不开，攒氮气冲出去几秒就被
     拉回来。现在只在玩家刚摔过车（Game.catchT）时才给大追赶，平时只给一点点，
     让"骑得好"真的能换来领先。 */
  const dzP = r.z - Player.z;
  let want = r.maxSpeed;
  if (dzP < -6000) want *= Game.catchT > 0 ? Diff().catchUp : 1.03;
  else if (dzP > 9000) want *= .90;
  if (Math.abs(r.x) > 1) want *= OFFROAD_MAX;
  r.speed = approach(r.speed, want, 1.1 * r.acc, dt);
  if (r.stun > 0) r.speed -= 2600 * dt;

  // 走线：定期挑一条车道，顺带躲开车流和路障
  r.laneT -= dt;
  if (r.laneT <= 0) { r.laneT = .8 + Math.random() * 1.2; r.wantX = (Math.random() * 1.5 - .75) * r.skill; }
  let avoid = 0;
  for (const c of Traffic) {
    const dz = c.z - r.z, look = 3000 + 6000 * r.skill;
    if (dz > -900 && dz < look) {
      const dx = c.x - r.x;
      if (Math.abs(dx) < .38) avoid -= sign(dx || 1) * (dz < 400 ? 3.2 : (1 - dz / look) * 2.6);
    }
  }
  // 路障：原来对手根本不碰路障，玩家眼看着他们从红白栏杆里穿过去。
  // 现在他们也会撞，所以也得会躲 —— 看多远由 skill 决定，技术差的照样会翻
  {
    const segs = Road.segs, look = 1500 + 4500 * r.skill;
    const i0 = Math.floor((r.z + 200) / SEG_LEN), i1 = Math.floor((r.z + look) / SEG_LEN);
    for (let i = i0; i <= i1; i++) {
      const sg = segs[((i % segs.length) + segs.length) % segs.length];
      for (const it of sg.sprites) {
        if (!it.hazard) continue;
        const dx = it.off - r.x, hz = HAZ[it.sp.tag] || HAZ.cone;
        if (Math.abs(dx) < hz.w + .13) avoid -= sign(dx || 1) * hz.dodge;
      }
    }
  }
  // 想打玩家：贴过去
  const near = Math.abs(dzP) < 1400;
  /* 贴过去的距离按自己的家伙定：拿棍子、铁链的站在你脚够不着、他够得着的地方出手，
     你想打断他就得先凑近（或者自己也抢一根）。徒手的只能贴到脚边，蓄力时会被你先踹。 */
  if (near && r.aggr > .3 && r.windT <= 0 && Math.abs(Player.x - r.x) > .12) {
    r.wantX = lerp(r.wantX, Player.x + sign(r.x - Player.x || 1) * clamp(WEPS[r.wep].reach * .8, .22, .46), .5);
  }
  const tx = clamp(r.wantX + avoid, -.95, .95);
  const d = clamp((tx - r.x) * 2.4, -1, 1);
  r.steer = approach(r.steer, r.windT > 0 ? d * .35 : d, 9, dt);    // 蓄力时基本不追着你打方向
  const T = Road.theme, wet = T.grip || 1;
  r.x += r.steer * 1.25 * dt * (.4 + r.speed / r.maxSpeed * .8) * wet * (r.slideT > 0 ? SLIDE_GRIP : 1);
  if (r.slideT > 0) { r.slideT -= dt; r.x += r.slideDir * SLIDE_DRIFT * (r.speed / r.maxSpeed) * Math.min(1, r.slideT * 1.6) * dt; }
  r.x -= seg.curve * .00055 * (r.speed / r.maxSpeed) * (r.speed / r.maxSpeed) * dt * 60 * (1 - r.skill * .55) * (2 - wet);
  if (T.wall) { const lim = T.wall.x - WALL_GAP; if (Math.abs(r.x) > lim) { r.x = sign(r.x) * lim; r.speed -= 1600 * dt; } }
  else if (Math.abs(r.x) > 1.85) { r.x = sign(r.x) * 1.85; wipeout(r); }
  // 撞车：躲不掉就跟你一样翻。技术好的容错高一点，但没人免疫
  for (const c of Traffic) {
    if (Math.abs(c.z - r.z) < 850 && Math.abs(c.x - r.x) < c.half + BIKE_HALF) {
      if (c.oncoming) { wipeout(r); }
      else { r.speed = Math.min(r.speed, c.speed + 1200); r.x += sign(r.x - c.x || 1) * 3.2 * dt; }
      break;
    }
  }
  r.lean = approach(r.lean, clamp(r.steer * .8 + seg.curve * .09, -1, 1), 9, dt);
  if (hazardHit(r, r.z, r.z + r.speed * dt)) return;

  // 从你身边超过去：偶尔回头喊一嗓子
  if (Game.state === 'race' && r.dzWas < 0 && dzP >= 0 && Math.abs(r.x - Player.x) < .8 && Player.state === 'ride' && Math.random() < .35)
    shout(r, r.pal.say && Math.random() < .6 ? r.pal.say : SAY_PASS);
  r.dzWas = dzP;
  // 出手（只在正式比赛里，标题页的背景演示不打人）
  if (near && r.atkCd <= 0 && r.stun <= 0 && r.windT <= 0 && Player.state === 'ride' && Game.state === 'race') {
    const dx = Player.x - r.x;
    if (Math.abs(dx) < WEPS[r.wep].reach && Math.abs(dzP) < 700 && Math.random() < r.aggr * dt * 4.2)
      startWindup(r, sign(dx) || 1, WIND_RIVAL[Game.track] || .4);
  }
  r.z += r.speed * dt;
}

/* 路面障碍一张表：w 多宽算压上、crash 高速撞上就摔、slow 撞上之后剩几成速度、hp 掉多少血、
   slide 压上去打滑多久（油污、积水不会被撞掉，谁压上去谁滑）、dodge 对手看见了躲多狠 */
const HAZ = {
  barrier: { w:.13, crash:true, slow:.30, hp:12, snd:'cone', why:'撞上路障', dodge:2.6 },
  rock:    { w:.14, crash:true, slow:.25, hp:16, snd:'rock', why:'撞上落石', dodge:2.8 },
  cone:    { w:.13, slow:.74, hp:6, snd:'cone', dodge:1.4 },
  oil:     { w:.18, slide:.8, drag:.93, snd:'skid', txt:'油污打滑！', dodge:1.2 },
  puddle:  { w:.20, slide:.55, drag:.88, snd:'splash', txt:'积水打滑！', dodge:.9 },
};
const SLIDE_GRIP = .4, SLIDE_DRIFT = .5;     // 打滑时方向还剩几成、自己往外溜多快（路宽/秒，满速时）
function startSlide(r, hz) {
  r.slideT = hz.slide; r.slideDir = sign(r.steer) || (Math.random() < .5 ? -1 : 1);
  r.speed *= hz.drag;
  if (r === Player) {
    sfx(hz.snd); shake(2.5);
    popText(r._sx != null ? r._sx : W / 2, (r._sy != null ? r._sy : H * .8) - (r._sw || 60) * .9, hz.txt, '#ffe060');
  }
}
/* 对手这一帧从 z0 走到 z1，扫一遍经过的路段看撞没撞上路障。摔了返回 true */
function hazardHit(r, z0, z1) {
  const segs = Road.segs;
  for (let i = Math.floor(z0 / SEG_LEN); i <= Math.floor(z1 / SEG_LEN); i++) {
    const sg = segs[i % segs.length];
    if (!sg) continue;
    for (const it of sg.sprites) {
      if (!it.hazard) continue;
      const hz = HAZ[it.sp.tag] || HAZ.cone;
      if (Math.abs(it.off - r.x) >= hz.w) continue;
      if (hz.slide) { if (r.slideT <= 0) startSlide(r, hz); continue; }
      it.hazard = false;
      if (hz.crash && r.speed > r.maxSpeed * BARRIER_SAFE) { r.z = z1; wipeout(r); return true; }
      r.speed *= hz.slow;
    }
  }
  return false;
}

/* ==========================================================================
   18. 车流
   ========================================================================== */
function spawnTraffic(idx) {
  Traffic.length = 0;
  const t = Road.theme, rng = makeRng(4242 + idx * 97);
  const n = Math.round(17 * t.cars * Diff().cars);
  // 铺在 22 万单位的纵深上：满速时大约一秒半遇上一台
  for (let i = 0; i < n; i++) addCar(rng, Player.z + 6000 + rng() * 220000, rng() < .42 * t.onc / t.cars);
}
function addCar(rng, z, oncoming) {
  const spec = pickCarSpec(rng);
  const c = {
    kind:'car', z, oncoming, spec,
    x: oncoming ? pick(rng, [-.72, -.30]) : pick(rng, [.28, .70]),
    speed: oncoming ? -(3600 + rng() * 2400) : (2800 + rng() * 3200),
    ww: spec.ww, half: spec.ww / (ROAD_W * 2) * .8, air:0, bob:0, honk:0,
    drawVec(g, ink) { drawCar(g, this.spec, this.oncoming, ink, Road.theme.night); },
  };
  Traffic.push(c); return c;
}
function updateTraffic(dt) {
  const t = Road.theme;
  for (const c of Traffic) {
    c.z += c.speed * dt;
    const rel = c.z - Player.z;
    if (rel < -8000 || rel > 240000) {                       // 回收再投
      const ahead = Player.z + 60000 + Math.random() * 170000;
      c.oncoming = Math.random() < .42 * t.onc / Math.max(.2, t.cars);
      c.spec = pickCarSpec(Math.random);
      c.ww = c.spec.ww; c.half = c.ww / (ROAD_W * 2) * .8;
      c.speed = c.oncoming ? -(3600 + Math.random() * 2400) : (2800 + Math.random() * 3200);
      c.x = c.oncoming ? (Math.random() < .5 ? -.72 : -.30) : (Math.random() < .5 ? .28 : .70);
      c.z = ahead; c.touched = false; c.relPrev = null;
    }
    if (c.oncoming && rel > 3000 && rel < 26000 && c.honk <= 0 && Math.abs(c.x - Player.x) < .35) {
      c.honk = 2.5; sfx('horn', clamp(1 - rel / 26000, .1, 1));
    }
    if (c.honk > 0) c.honk -= dt;
  }
}

/* ==========================================================================
   19. 警察
   ========================================================================== */
function maybeSpawnCop(dt) {
  if (!Road.theme.cops || Cop || Game.copDone) return;
  const prog = Player.z / Road.length;
  if (prog > (Road.theme.copAt || .42) || Game.crashes >= 3) {
    Cop = makeRider(COP_PAL);
    Cop.isCop = true;
    Cop.maxSpeed = Player.maxSpeed * Diff().copSpd;
    Cop.maxHp = Cop.hp = 150; Cop.wep = 1; Cop.arm = 1.15;
    Cop.z = Player.z - 9000; Cop.x = 0; Cop.speed = Player.speed;
    Cop.grip = 0;
    toast('警察！', true); sfx('siren');
    Game.copDone = true;
  }
}
const COP_GRIP = 4;              // 被贴住这么多秒才算被拷上
function updateCop(dt) {
  const c = Cop; if (!c) return;
  riderGravity(c, dt);
  if (c.stun > 0) c.stun -= dt;
  if (c.atkT > 0) c.atkT -= dt;
  if (c.atkCd > 0) c.atkCd -= dt;
  if (c.hitFlash > 0) c.hitFlash -= dt;
  if (c.armorT > 0) c.armorT -= dt;
  if (c.guardT > 0) c.guardT -= dt;
  if (Game.state === 'race') tickWindup(c, dt); else c.windT = 0;
  if (c.state === 'down') {
    c.downT += dt; c.speed = approach(c.speed, 0, 3, dt); c.z += c.speed * dt;
    if (c.downT > 4.5) { c.state = 'ride'; c.hp = c.maxHp * .7; c.speed = 3000; c.z = Player.z - 12000; }
    c.grip = Math.max(0, c.grip - dt * 2);
    return;
  }
  const dz = Player.z - c.z;
  let want = c.maxSpeed * (dz > 3000 ? 1.10 : dz < -2000 ? .86 : 1);
  if (c.stun > 0) want *= .6;
  c.speed = approach(c.speed, want, 1.4, dt);
  // 横向跟得比你慢一点点 —— 连续变线甩得开，但只够甩开一下
  let dodge = 0;
  for (const car of Traffic) {                       // 警察是老手，会提前让开
    const dz2 = car.z - c.z;
    if (dz2 > -900 && dz2 < 9000 && Math.abs(car.x - c.x) < .38)
      dodge -= sign(car.x - c.x || 1) * (dz2 < 400 ? 3.2 : (1 - dz2 / 9000) * 2.4);
  }
  const d = clamp((Player.x - c.x) * 2.2 + dodge, -1, 1);
  c.steer = approach(c.steer, d, 5.5, dt);
  c.x += c.steer * .82 * dt * (c.stun > 0 ? .3 : 1);
  c.x = clamp(c.x, -1.1, 1.1);
  c.lean = approach(c.lean, clamp(c.steer * .8, -1, 1), 9, dt);
  c.z += c.speed * dt;

  // 贴住玩家就开始拷人
  const close = Math.abs(dz) < 1600 && Math.abs(Player.x - c.x) < .34
                && Player.state === 'ride' && c.stun <= 0;
  const gripMax = COP_GRIP * Diff().copGrip;
  c.grip = clamp(c.grip + (close ? dt : -dt * 2.2), 0, gripMax);
  copHud(c.grip / gripMax, close);
  if (close && c.atkCd <= 0 && c.windT <= 0 && c.stun <= 0 && Math.random() < .9 * dt * 3)
    startWindup(c, sign(Player.x - c.x) || 1, WIND_COP);
  if (c.grip >= gripMax) busted();

  // 警察也要看路：撞上车流一样翻
  for (const car of Traffic) {
    if (car.oncoming && Math.abs(car.z - c.z) < 900 && Math.abs(car.x - c.x) < car.half + BIKE_HALF) {
      wipeout(c); c.grip = 0; break;
    }
  }
}

   20. 碰撞
   ========================================================================== */
const BIKE_HALF = .075;
const BARRIER_SAFE = .35;          // 低于这个速度比例撞上路障只是被顶住，不摔
function checkCollisions(dt) {
  const P = Player;
  if (P.state !== 'ride') return;
  const zPrev = P.zPrev != null ? Math.min(P.zPrev, P.z) : P.z;

  // 车流
  for (const c of Traffic) {
    const gap = c.half + BIKE_HALF, adx = Math.abs(c.x - P.x);
    // 擦车：这一帧刚从身边超过去，而且贴得够近、没真蹭上
    const relNow = c.z - P.z, relWas = c.relPrev;
    c.relPrev = relNow;
    if (relWas > 0 && relNow <= 0 && !c.touched && adx > gap && adx < gap + NEAR_BAND && P.speed > P.maxSpeed * .55)
      addNitro(c.oncoming ? 16 : 10, c.oncoming ? '擦过来车 +氮气' : '擦车 +氮气');
    if (adx > gap) continue;
    c.touched = true;
    const rel = c.z - P.z;
    const overlap = Math.abs(rel) < 900;
    if (!overlap) continue;
    if (c.oncoming) { wipeout(P, '迎头撞上！'); return; }
    const closing = P.speed - c.speed;
    if (closing > 4200) { wipeout(P, '追尾'); return; }
    // 低速蹭车：掉血掉速，同时被狠狠顶开 —— 不能让人黏在车尾出不来
    P.speed = Math.min(P.speed, c.speed + 1200);
    P.x += sign(P.x - c.x || 1) * 3.6 * dt;
    P.hp -= 9 * dt; shake(2.4);
    if (frameCount % 8 === 0) { addSpark(W / 2, H * .72, 3, '#ffd070'); sfx('scrape'); }
    if (P.hp <= 0) wipeout(P, '被撞爆');
    updateHpHud();
  }
  // 路障：把这一帧走过的每一段都扫一遍。只查当前段的话，掉帧时会直接穿过去
  const i0 = Math.floor(zPrev / SEG_LEN), i1 = Math.floor(P.z / SEG_LEN);
  for (let i = i0; i <= i1; i++) {
    const seg = Road.segs[i % Road.segs.length];
    if (!seg) continue;
    for (const it of seg.sprites) {
      if (!it.hazard) continue;
      const hz = HAZ[it.sp.tag] || HAZ.cone;
      if (Math.abs(it.off - P.x) >= hz.w) continue;
      if (hz.slide) { if (P.slideT <= 0) startSlide(P, hz); continue; }
      // 慢速蹭上去不至于摔：原来 30km/h 碰一下也是整个人飞出去
      if (hz.crash && P.speed > P.maxSpeed * BARRIER_SAFE) { wipeout(P, hz.why); return; }
      P.speed *= hz.slow; P.hp -= hz.hp; shake(hz.crash ? 5 : 4); sfx(hz.snd); it.hazard = false;
      addSpark(W / 2, H * .78, hz.crash ? 10 : 8, '#f0a030'); updateHpHud();
      if (P.hp <= 0) { wipeout(P, hz.why || '撞烂了'); return; }
    }
  }
  // 捡武器
  for (let i = Pickups.length - 1; i >= 0; i--) {
    const p = Pickups[i];
    if (Math.abs(p.z - P.z) < 1100 && Math.abs(p.x - P.x) < .16) {
      P.wep = p.wep; Pickups.splice(i, 1);
      toast('捡到' + WEPS[P.wep].nm + '！'); sfx('pickup'); updateWepHud();
    }
  }
  // 骑手互撞：贴太近会互相顶开
  for (const r of Rivals) {
    if (r.state !== 'ride') continue;
    if (Math.abs(r.z - P.z) < 700 && Math.abs(r.x - P.x) < BIKE_HALF * 2.1) {
      const d = sign(P.x - r.x || 1);
      P.x += d * 1.1 * dt; r.x -= d * 1.1 * dt;
      P.speed *= (1 - .5 * dt); r.speed *= (1 - .5 * dt);
    }
  }
}

const emptyBest = () => DIFFS.map(() => new Array(TRACK_N).fill(null));

/* ---------- 难度档 ----------

const DIFFS = [

    spd:1.065, aggr:1.7, wind:.74, hp:1.4, wep:1.8, skill:1.2, cars:1.3, copSpd:1.06, copGrip:.65, pay:1.6, pass:2, catchUp:1.18, remount:.35, lock:true },

/* 名次奖：只有冲在前面才拿得到大头。
   第二、三名原来给得太少：每场都拿第二的人，第二场只能骑着起步车去跟一群

   每场只拿第三的，中途要多跑一两场攒钱 —— 慢一点，但不会卡死。 */
const PRIZE = [ [1500,950,600,180,120,80,40,0], [2200,1400,900,260,170,110,60,0],
                [3000,1900,1200,360,240,160,80,0], [3800,2400,1500,460,300,200,100,0],
                [5000,3300,1900,600,400,260,130,0], [6000,3700,2300,720,480,310,160,0],
                [7000,4300,2700,840,560,360,180,0], [8200,5100,3200,1000,660,420,210,0] ];
const KO_PAY = 90;                 // 每撂倒一个人
/* 完赛费：只要过线就有，跟名次无关。
   没有这一档的时候，第一场跑砸就等于出局 —— 前四之外一分钱没有，换不了车，
   换不了车就永远跑不进前四，后面每一场都是 $0。那不是难，是死角。
   现在垫底也能拿一场的完赛费，跑三场就够换第二台车：输了只是慢，不是断。 */
const FINISH_FEE = [380, 480, 600, 750, 900, 1050, 1200, 1400];

/* 存档：钱、车、进度、最佳成绩、静音。原来刷新一下（或者 Safari 回收后台标签页）就全没了。
   localStorage 可能被禁用或抛异常，全部包在 try 里，读不到就当新游戏。 */
/* v2：八条街、五台车、难度档，最佳成绩按难度分开记。v1 的档读进来当「老手」接着玩 */
const SAVE_KEY = 'roadRash.save.v2', SAVE_V1 = 'roadRash.save.v1';
function saveGame() {
  try {
    window.localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 2, money: Game.money, bike: Game.bike, owned: Game.owned, track: Game.track, best: Game.best, muted: Game.muted,
      diff: Game.diff, unlocked: Game.unlocked, careerMin: Game.careerMin }));
  } catch (e) {}
}
function loadSave() {
  try {
    let d = JSON.parse(window.localStorage.getItem(SAVE_KEY) || 'null');
    if (!d || d.v !== 2) {
      const old = JSON.parse(window.localStorage.getItem(SAVE_V1) || 'null');
      if (!old || old.v !== 1) return false;
      d = Object.assign({}, old, { diff: 1, unlocked: 2, careerMin: 1, best: [null, old.best, null, null] });
    }
    const num = v => Number.isFinite(v) ? v : null;
    const owned = BIKES.map((_, i) => i === 0 || !!(d.owned && d.owned[i]));
    Game.money = Number.isFinite(d.money) ? Math.max(0, Math.floor(d.money)) : 0;
    Game.owned = owned;
    Game.bike = owned[d.bike] ? d.bike | 0 : 0;
    Game.track = clamp(d.track | 0, 0, TRACK_N - 1);
    Game.unlocked = clamp(d.unlocked | 0, 2, DIFFS.length - 1);
    Game.diff = clamp(Number.isFinite(d.diff) ? d.diff | 0 : 1, 0, Game.unlocked);
    Game.careerMin = clamp(Number.isFinite(d.careerMin) ? d.careerMin | 0 : Game.diff, 0, DIFFS.length - 1);
    Game.best = DIFFS.map((_, k) => new Array(TRACK_N).fill(null).map((_, i) => num(d.best && d.best[k] && d.best[k][i])));
    Game.muted = !!d.muted;
    return true;
  } catch (e) { return false; }
}
/* 开一轮新生涯：钱、车、进度清零，最佳成绩和解锁保留 */
function newCareer(diff) {
  Game.money = 0; Game.bike = 0; Game.owned = BIKES.map((_, i) => i === 0); Game.track = 0;
  Game.diff = clamp(diff, 0, Game.unlocked); Game.careerMin = Game.diff;

}
function hasProgress() { return Game.money > 0 || Game.track > 0 || Game.owned.some((o, i) => i > 0 && o); }
const bestOf = t => Game.best[Game.diff][t];

function computeRank() {
  const all = [Player, ...Rivals];
  all.sort((a, b) => (b.done ? 1e12 - b.doneT : b.z) - (a.done ? 1e12 - a.doneT : a.z));
  for (let i = 0; i < all.length; i++) all[i].rank = i + 1;
  return all;
}

function finishRace() {

function doAct(act, arg) {
  if (act === 'resume') { if (Game.paused) togglePause(); }
  else if (act === 'start') { if (hasProgress()) showShop(); else showDiffPick(false); }
  else if (act === 'race') { startRace(Game.track); }
  else if (act === 'retry') { Game.paused = false; musicDuck(false); startRace(Game.track); }
  else if (act === 'shop') { showShop(); }
  else if (act === 'next') { Game.track = Math.min(TRACK_N - 1, Game.track + 1); saveGame(); showShop(); }
  else if (act === 'diff') { const d = +arg; if (d <= Game.unlocked && d !== Game.diff) { Game.diff = d; saveGame(); sfx('pickup'); showShop(); } }
  else if (act === 'pickdiff') { const d = +arg; if (d <= Game.unlocked) { newCareer(d); sfx('buy'); showShop(); } }
  else if (act === 'buy') { buyBike(+arg); }
  else if (act === 'sel') { if (Game.owned[+arg]) { Game.bike = +arg; saveGame(); sfx('pickup'); showShop(); } }
  else if (act === 'title') { showTitle(); }
  else if (act === 'newgame') { showDiffPick(hasProgress()); }
  else if (act === 'mute') { toggleMute(); if (Game.paused) showPause(); }
  else if (act === 'quit') { Game.paused = false; musicDuck(false); showShop(); }
}

let AC = null, master = null, noiseBuf = null;

function makeNoise(sec) {
  const n = Math.floor(AC.sampleRate * sec), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

function audioUnlock() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = Game.muted ? 0 : .85; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = .30; musicGain.connect(master);
  sfxGain   = AC.createGain(); sfxGain.gain.value = .85;  sfxGain.connect(master);
  noiseBuf = makeNoise(2);

  // 引擎：三只失谐锯齿波 + 一枚低通，转速直接映到频率
  engGain = AC.createGain(); engGain.gain.value = 0; engGain.connect(master);
  engFilt = AC.createBiquadFilter(); engFilt.type = 'lowpass';
  engFilt.frequency.value = 700; engFilt.Q.value = 4; engFilt.connect(engGain);
  for (const d of [0, 7, -5, 12]) {
    const o = AC.createOscillator(); o.type = d === 12 ? 'square' : 'sawtooth';
    o.frequency.value = 60; o.detune.value = d * 6;
    const g = AC.createGain(); g.gain.value = d === 12 ? .18 : .34;
    o.connect(g); g.connect(engFilt); o.start();
    engA.push(o);
  }
  // 风噪
  windSrc = AC.createBufferSource(); windSrc.buffer = noiseBuf; windSrc.loop = true;
  windFilt = AC.createBiquadFilter(); windFilt.type = 'bandpass';
  windFilt.frequency.value = 700; windFilt.Q.value = .7;
  windGain = AC.createGain(); windGain.gain.value = 0;
  windSrc.connect(windFilt); windFilt.connect(windGain); windGain.connect(master);
  windSrc.start();
  // 雨声：同一段噪声走高通，只在下雨的街开
  const rainSrc = AC.createBufferSource(); rainSrc.buffer = noiseBuf; rainSrc.loop = true; rainSrc.playbackRate.value = .7;
  const rainFilt = AC.createBiquadFilter(); rainFilt.type = 'highpass'; rainFilt.frequency.value = 2400;
  rainGain = AC.createGain(); rainGain.gain.value = 0;
  rainSrc.connect(rainFilt); rainFilt.connect(rainGain); rainGain.connect(master);
  rainSrc.start();
  musicNext = AC.currentTime + .05;
}
function toggleMute() {
