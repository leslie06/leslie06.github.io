<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GUNFIGHT</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A browser first-person shooter built with three.js.">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
</style>
  <script type="module" crossorigin src="./assets/index-Claa9S31.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three-DEn-HxkP.js">
  <link rel="modulepreload" crossorigin href="./assets/postprocessing-BWwicPpR.js">
<!-- STATS_START 匿名统计，由 stats/apply.mjs 生成，不要手改 -->
<script>
(() => {
  const API = 'https://stats.fishai.asia/e', GAME = 'gun-fight';
  if (API.indexOf('STATS-ENDPOINT') >= 0 || !navigator.sendBeacon) return;
  try { if (/[?&]nostat/.test(location.search) || localStorage.getItem('nostat')) return; } catch (e) {}
  const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
  let active = 0, last = Date.now();
  for (const ev of ['pointerdown', 'keydown', 'touchstart', 'wheel'])
    addEventListener(ev, () => (last = Date.now()), { passive: true, capture: true });
  setInterval(() => {
    if (document.visibilityState === 'visible' && Date.now() - last < 30000) active++;
  }, 1000);
  const send = () => {
    try {
      navigator.sendBeacon(API, new Blob(
        [JSON.stringify({ g: GAME, s: sid, a: active, w: innerWidth, r: document.referrer })],
        { type: 'text/plain' }));   // text/plain 不触发跨域预检
    } catch (e) {}
  };
  send();
  setInterval(send, 15000);
  addEventListener('pagehide', send);
  addEventListener('visibilitychange', () => document.visibilityState === 'hidden' && send());
})();
</script>
<!-- STATS_END -->
</head>
<body>
<div id="app"></div>
</body>
</html>
