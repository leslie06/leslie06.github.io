<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>
// 国内镜像（2026-10-18，埋点：国内从 GitHub Pages 下载中位数约 70 KB/s，第一次来的玩家一半停在下载城市数据）：
// 页面还是 GitHub 上这份，在中国时区的浏览器里插一个 <base>，程序、城市数据、模型、配音这些相对地址就都从阿里云
// 服务器上的同一份构建取（scripts/deploy.mjs 用 rsync 传上去）。?cn=1 强制用镜像，?cn=0 不用。
// 程序文件取不到（镜像挂了、网络抖）时去掉 <base> 换回 GitHub 再取一次；本来就在 GitHub 上的，带个参数重取一次。
(function () {
  var CN = 'https://stats.fishai.asia/bcity/';
  var q = new URLSearchParams(location.search).get('cn'), tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { /* old browser */ }
  var use = q === '1' || (q !== '0' && /\.github\.io$/.test(location.hostname) && /^Asia\/(Shanghai|Chongqing|Chungking|Harbin|Urumqi)$/.test(tz));
  window.__host = use ? 'cn' : 'gh';
  // 构建时 Vite 注入的程序入口和 modulepreload 被收进 <template data-boot>（vite.config.ts 的 bootTagsLate），
  // 在 head 的末尾调这个把它们插回来：<base> 已经插好，相对地址按它解析
  window.__bootTags = function () {
    var t = document.querySelector('template[data-boot]');
    if (!t) return;
    var els = t.content.children;
    for (var i = 0; i < els.length; i++) {
      var e = document.createElement(els[i].tagName.toLowerCase());
      for (var j = 0; j < els[i].attributes.length; j++) e.setAttribute(els[i].attributes[j].name, els[i].attributes[j].value);
      document.head.appendChild(e);
    }
  };
  if (!use) return;
  var base = document.createElement('base');
  base.href = CN;
  document.head.appendChild(base);
  // 跨域的地址建不了 Worker：包一层同源的 blob，里面再 import 镜像上的脚本（城市分块和地图的 worker）
  var W = window.Worker;
  if (W) {
    var Wrapped = function (url, opts) {
      var u = new URL(String(url), document.baseURI);
      if (u.origin !== location.origin) {
        var src = opts && opts.type === 'module' ? 'import ' + JSON.stringify(u.href) + ';' : 'importScripts(' + JSON.stringify(u.href) + ');';
        url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      }
      return new W(url, opts);
    };
    Wrapped.prototype = W.prototype;
    window.Worker = Wrapped;
  }
})();
// 程序入口（Vite 注入的 assets/index-*.js）加载失败：镜像上的换回 GitHub，GitHub 上的带参数重取，最多两次
(function () {
  var tries = 0;
  addEventListener('error', function (ev) {
    var el = ev.target;
    if (!el || el.tagName !== 'SCRIPT' || !/assets\/index-[^/]*\.js/.test(el.src || '') || tries >= 2) return;
    tries++;
    var b = document.querySelector('base');
    if (b) { b.parentNode.removeChild(b); window.__host = 'cn>gh'; if (window.__stat) window.__stat.host = 'cn>gh'; }
    var s = document.createElement('script');
    s.type = 'module'; s.crossOrigin = 'anonymous';
    s.src = el.getAttribute('src').replace(/\?.*$/, '') + (b ? '' : '?r=' + tries);
    setTimeout(function () { document.head.appendChild(s); }, b ? 0 : 1500);
  }, true);
})();
</script>
<title>b城追车</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="b城追车: a GTA-style open world city, built with three.js.">
<style>html,body{background:#0e1113;height:100%;margin:0;font-family:PingFang SC,Microsoft YaHei,system-ui,sans-serif;overflow:hidden}#app{position:fixed;inset:0}canvas{width:100%;height:100%;display:block}#loading{color:#f4f1e8;z-index:100;background:#0e1113;place-items:center;display:grid;position:fixed;inset:0}#loading>div{text-align:center;width:min(280px,72vw)}#loading span{letter-spacing:-.03em;font:900 44px/1 system-ui,sans-serif;display:block}#loading b{letter-spacing:.3em;color:#f4f1e88c;margin-top:18px;font:700 11px/1 system-ui,sans-serif;display:block}#loading i{background:#f4f1e81f;border-radius:2px;height:4px;margin-top:22px;display:block;overflow:hidden}#loading i em{background:#f3b50f;border-radius:2px;width:0;height:100%;display:block}#loading small{color:#f4f1e899;justify-content:space-between;margin-top:10px;font:600 12px/1.2 system-ui,sans-serif;display:flex}#loading small u{text-decoration:none}#loading small q{quotes:none;font-variant-numeric:tabular-nums;color:#f4f1e8}</style>
<template data-boot><script type="module" crossorigin src="./assets/index-BMZ2BS-r.js"></script><link rel="modulepreload" crossorigin href="./assets/three-BAwznO9f.js"></template>
<script>window.__bootTags && window.__bootTags();</script>
<!-- STATS_START 匿名统计，由 stats/apply.mjs 生成，不要手改 -->
<script>
(() => {
  const API = 'https://stats.fishai.asia/e', GAME = 'bcity';
  if (API.indexOf('STATS-ENDPOINT') >= 0 || !navigator.sendBeacon) return;
  try { if (/[?&]nostat/.test(location.search) || localStorage.getItem('nostat')) return; } catch (e) {}
  const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
  let active = 0, last = Date.now();
  for (const ev of ['pointerdown', 'keydown', 'touchstart', 'wheel'])
    addEventListener(ev, () => (last = Date.now()), { passive: true, capture: true });
  setInterval(() => {
    if (document.visibilityState === 'visible' && Date.now() - last < 30000) active++;
  }, 1000);
  const send = () => {
    try {
      navigator.sendBeacon(API, new Blob(
        [JSON.stringify({ g: GAME, s: sid, a: active, w: innerWidth, r: document.referrer, m: window.__stat })],
        { type: 'text/plain' }));   // text/plain 不触发跨域预检
    } catch (e) {}
  };
  send();
  setInterval(send, 15000);
  addEventListener('pagehide', send);
  addEventListener('visibilitychange', () => document.visibilityState === 'hidden' && send());
})();
</script>
<!-- STATS_END -->
</head>
<body>
<div id="app"></div>
<div id="loading"><div><span>b城追车</span><b>LOADING</b><i><em></em></i><small><u></u><q>0%</q></small></div></div>
<script>
// The funnel (src/online/Funnel.ts; 2026-10-17, to see where players drop out): seconds since the page began loading
// at each step, sent with the site's play-stats heartbeat (stats/apply.mjs reads window.__stat). Started here, before
// the program itself downloads, so a download that fails or a page closed during it still says how far it got.
(function () {
  var s = window.__stat = { v: 1 };
  if (window.__host) s.host = window.__host;   // 从哪儿下载的：cn 国内镜像、gh GitHub、cn>gh 镜像失败换回
  try { for (var i = 0; i < localStorage.length; i++) if (/^drivecity\./.test(localStorage.key(i) || '')) { s.ret = 1; break; } } catch (e) { /* private mode */ }
  try { if (matchMedia('(pointer: coarse)').matches) s.touch = 1; } catch (e) { /* old browser */ }
  var t = function () { return Math.round(performance.now() / 100) / 10; };
  var err = function (msg) { s.err = (s.err || 0) + 1; if (!s.e) { s.e = String(msg || 'error').slice(0, 150); s.et = t(); } };
  // capture: a script or a file that failed to load fires 'error' on its element, which only capture sees
  addEventListener('error', function (ev) {
    var el = ev.target;
    if (el && el !== window && (el.src || el.href)) { s.rerr = (s.rerr || 0) + 1; if (!s.re) s.re = String(el.src || el.href).replace(/^https?:\/\/[^/]+/, '').slice(0, 150); return; }
    err(ev.message + (ev.filename ? ' @' + String(ev.filename).split('/').pop() + ':' + ev.lineno : ''));
  }, true);
  addEventListener('unhandledrejection', function (ev) { var r = ev.reason; err('promise: ' + (r && r.message ? r.message : r)); });
})();
// Boot progress (src/main.ts reports its stages through window.__boot): drawn from the first byte, so it moves while
// the program itself is still downloading. Each stage is a span of the bar [from, to]; inside it the bar creeps
// towards `to` (never reaching it), or ahead of that where the stage reports its own fraction (the city's files and
// the spawn's tiles do).
(function () {
  var el = document.getElementById('loading'), bar = el.querySelector('em'), pct = el.querySelector('q'), lab = el.querySelector('u');
  var zh = true;
  try { var q = new URLSearchParams(location.search).get('lang'), s = localStorage.getItem('drivecity.lang.v1'); var p = new URLSearchParams(location.search); zh = q ? q === 'zh' : p.has('shot') ? false : s ? s === 'zh' : /^zh/i.test(navigator.language || ''); } catch (e) { /* private mode */ }
  var st = { from: 0, to: 0.27, f: -1, t0: performance.now(), tau: 7 }, shown = 0, last = performance.now();
  lab.textContent = zh ? '下载程序' : 'Downloading the game';
  el.querySelector('b').textContent = zh ? '加载中' : 'LOADING';
  var log = [];
  function frame(now) {
    if (!el.isConnected) return;
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var span = st.to - st.from, goal;
    // the stage's own count, or the creep while a big file holds the count still, whichever is further
    goal = st.from + span * Math.max(Math.min(1, st.f), 0.92 * (1 - Math.exp(-(now - st.t0) / 1000 / st.tau)));
    if (goal > shown) shown += (goal - shown) * Math.min(1, dt * 6);
    bar.style.width = (shown * 100).toFixed(1) + '%';
    pct.textContent = Math.floor(shown * 100) + '%';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__boot = {
    log: log,
    /** A stage from `from` to `to` (0..1 of the bar), its label, how long it usually takes (s, for the creep). */
    stage: function (from, to, label, secs) { st = { from: Math.max(from, shown), to: to, f: -1, t0: performance.now(), tau: (secs || 4) / 2 }; if (label) lab.textContent = label; log.push([label, Math.round(performance.now())]); },
    /** The current stage's own progress, 0..1. */
    sub: function (f) { st.f = Math.max(st.f, f); },
  };
})();
</script>
</body>
