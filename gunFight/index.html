<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GUNFIGHT</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A browser first-person shooter built with three.js.">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  /* Boot screen. Lives here, not in the bundle: several MB of script have to arrive before any
     module runs, and until then this is the only thing that can tell the player the page is alive.
     ui/Loading.ts takes it over once it is evaluated. Colours/fonts mirror ui/theme.ts. */
  #loading{position:fixed;inset:0;z-index:30;background:#07090c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.4em;
    font-family:"Avenir Next Condensed","Bahnschrift","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-stretch:condensed;color:#f2f4f7;font-size:clamp(11px,1.45vh,32px);transition:opacity .45s;-webkit-font-smoothing:antialiased;user-select:none}
  #loading.out{opacity:0;pointer-events:none}
  #loading .n{font-size:5.4em;font-weight:800;letter-spacing:.02em;line-height:1}
  #loading .n i{font-style:normal;display:inline-block;width:.1em;height:.58em;background:#ff8a1f;margin-left:.12em}
  #loading .bar{width:min(26em,78vw);height:3px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
  #loading .bar i{position:absolute;top:0;bottom:0;left:0;width:100%;background:#f2f4f7;transform-origin:0 50%;transform:scaleX(0);transition:transform .35s ease-out}
  /* A glint that keeps travelling along the bar (compositor-driven, so it moves even while the
     main thread is busy building the level): a slow download never looks frozen. */
  #loading .bar b{position:absolute;top:0;bottom:0;left:0;width:22%;background:linear-gradient(90deg,transparent,rgba(255,138,31,.9),transparent);animation:loadglint 1.4s linear infinite}
  #loading .row{width:min(26em,78vw);display:flex;justify-content:space-between;align-items:baseline;gap:1em;margin-top:-.6em}
  #loading .l{font-size:.9em;letter-spacing:.18em;opacity:.7;font-weight:600}
  #loading .pct{font-size:1.5em;font-weight:800;font-variant-numeric:tabular-nums;color:#ff8a1f}
  #loading .by{font-size:.78em;letter-spacing:.12em;opacity:.45;min-height:1.2em;font-variant-numeric:tabular-nums;font-family:"SF Mono",Menlo,Consolas,monospace;font-stretch:normal;margin-top:-.8em}
  #loading .ft{max-width:min(34em,88vw);text-align:center;font-size:.95em;letter-spacing:.1em;line-height:1.6;opacity:.6;margin-top:1.2em}
  @keyframes loadglint{0%{transform:translateX(-100%)}100%{transform:translateX(460%)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">
  <div class="n">GUNFIGHT<i></i></div>
  <div class="bar"><i></i><b></b></div>
  <div class="row"><span class="l"></span><span class="pct">0%</span></div>
  <div class="by"></div>
  <div class="ft"></div>
</div>
<script>
// Runs before the bundle exists. Same language rule as core/I18n.ts (url, shot, saved, browser).
(function () {
  var root = document.getElementById('loading');
  var q = new URLSearchParams(location.search);
  if (q.has('shot')) { root.remove(); return; }
  var lang = q.get('lang');
  if (lang !== 'zh' && lang !== 'en') { try { lang = localStorage.getItem('gunfight.lang.v1'); } catch (e) { lang = null; } }
  if (lang !== 'zh' && lang !== 'en') lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  var zh = lang === 'zh';
  root.querySelector('.l').textContent = zh ? '正在下载游戏程序' : 'DOWNLOADING GAME';
  root.querySelector('.ft').textContent = zh ? '首次进入需要下载关卡资源，请稍候 · 之后再进几秒就能开始' : 'THE FIRST VISIT DOWNLOADS THE LEVEL · LATER VISITS START IN SECONDS';
  var fill = root.querySelector('.bar i'), pct = root.querySelector('.pct');
  var shown = 0;
  function set(p) {
    if (p <= shown) return;
    shown = p;
    fill.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    pct.textContent = Math.floor(p * 100) + '%';
  }
  // The scripts give no download events, so this share of the bar (SCRIPT_SHARE in
  // core/BootProgress.ts) eases towards its end and never reaches it; the bundle takes over from
  // wherever it got to.
  var t0 = performance.now(), live = true;
  var timer = setInterval(function () {
    if (!live) return;
    set(0.12 * (1 - Math.exp(-(performance.now() - t0) / 5000)));
  }, 200);
  window.__gfBoot = function (s) { live = false; clearInterval(timer); set(s.progress); };
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
