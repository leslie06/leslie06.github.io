<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover：让页面铺到刘海和小白条下面，再靠 env(safe-area-inset-*) 把 UI 让回来。
      不写 cover 的话 iOS 会自己留白边，横屏时左右各黑一条。
      user-scalable=no 在 iOS 10 之后被 Safari 无视了，真正拦住缩放的是
      DeviceOverlays.installGestureGuards()，这里留着是给别的浏览器看的。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1017" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>旷野杯 · 卡丁车</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #0d1017;
        /* 触屏上把浏览器的默认手势全关掉：
           touch-action  = 不滚动不缩放（摇杆要靠它才能拿到连续的 pointermove）
           overscroll    = 不要下拉刷新和边缘橡皮筋
           user-select / touch-callout = 长按不选中、不弹"拷贝"菜单 */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
    <script type="module" crossorigin src="./assets/index-BqwKnpQN.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/audio-DhH9atRp.js">
    <link rel="modulepreload" crossorigin href="./assets/three-d194qEoe.js">
    <link rel="modulepreload" crossorigin href="./assets/TrackConfig-CYY79NHM.js">
    <link rel="modulepreload" crossorigin href="./assets/BufferGeometryUtils-DyljbVMU.js">
    <link rel="modulepreload" crossorigin href="./assets/postprocessing-Bv1tOFEY.js">
  <!-- STATS_START 匿名统计，由 stats/apply.mjs 生成，不要手改 -->
<script>
(() => {
  const API = 'https://stats.fishai.asia/e', GAME = 'kart-new';
  if (API.indexOf('STATS-ENDPOINT') >= 0 || !navigator.sendBeacon) return;
  try { if (/[?&]nostat/.test(location.search) || localStorage.getItem('nostat')) return; } catch (e) {}
  const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
  let active = 0, last = Date.now();
  for (const ev of ['pointerdown', 'keydown', 'touchstart', 'wheel'])
    addEventListener(ev, () => (last = Date.now()), { passive: true, capture: true });
  setInterval(() => {
    if (document.visibilityState === 'visible' && Date.now() - last < 30000) active++;
  }, 1000);
  const send = () => {
    try {
      navigator.sendBeacon(API, new Blob(
        [JSON.stringify({ g: GAME, s: sid, a: active, w: innerWidth, r: document.referrer })],
        { type: 'text/plain' }));   // text/plain 不触发跨域预检
    } catch (e) {}
  };
  send();
  setInterval(send, 15000);
  addEventListener('pagehide', send);
  addEventListener('visibilitychange', () => document.visibilityState === 'hidden' && send());
})();
</script>
<!-- STATS_END -->
</head>
  <body>
    <div id="app"></div>
  </body>
</html>
