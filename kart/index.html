  // 闪电
  m = new Mesh();
  const bolt = [[0.06,0.62],[-0.14,0.26],[0.02,0.24],[-0.10,-0.10],[0.16,0.22],[0.0,0.24]];
  for (let i = 0; i < bolt.length - 1; i++) {
    const a = bolt[i], b = bolt[i+1];
    m.bc((a[0]+b[0])/2, 0.30 + (a[1]+b[1])/2, 0, Math.abs(a[0]-b[0])/2 + 0.055,
         Math.abs(a[1]-b[1])/2 + 0.055, 0.055, RGB(0xffe14a));
  }
  MODELS.bolt = m.upload();
}

/* ==========================================================================
   11. 车辆物理

   街机手感，不做轮胎模型：速度是个标量，沿"行进方向" head 走；
   车身朝向 yaw 可以和 head 岔开一个角度，那个角度就是漂移看上去的样子。
   ========================================================================== */
const G = 26.0;
const SPD_MAX = 27.5;            // 基准极速 m/s（约 99 km/h）
const ACCEL   = 15.0;
const BRAKE   = 30.0;
const COAST   = 6.5;
const REV_MAX = 6.0;
const TURN    = 2.35;            // 最高转向角速度 rad/s
const DRIFT_MIN = 1.05, DRIFT_RANGE = 1.55;
const KART_R  = 0.78;            // 车车碰撞半径

/* 迷你涡轮三档：蓝 / 橙 / 紫。
   t 是需要连续漂多久。这三个数直接决定整个游戏的节奏 —— 定高了弯不够长，
   一局下来只见得到蓝火；定低了随便点一下就有涡轮，漂移就不值钱了。 */
const MT = [
  { t: 0.55, dur: 0.80, pow: 1.155, col: [0.32, 0.78, 1.00], nm: '蓝火' },
  { t: 1.35, dur: 1.30, pow: 1.260, col: [1.00, 0.62, 0.16], nm: '橙火' },
  { t: 2.35, dur: 1.95, pow: 1.385, col: [0.78, 0.38, 1.00], nm: '紫火' },
];

const SURF = { ROAD: 0, CURB: 1, VERGE: 2 };
const SURF_MUL = [1.0, 0.965, 0.585];

function sDist(a, b) {              // a 到 b 沿赛道的最短有向距离
  const L = Track.L; let d = ((b - a) % L + L) % L;
  return d > L / 2 ? d - L : d;
}

function makeKart(idx, ai) {
  const d = DRIVERS[idx];
  return {
    idx, ai, nm: d.nm, def: d,
    body: null, colBody: RGB(d.body), colAcc: RGB(d.acc),
    x: 0, y: 0, z: 0, yaw: 0, head: 0,
    speed: 0, vy: 0, air: false, airT: 0,
    node: 0, s: 0, lat: 0, prevS: 0, lap: 0, prog: 0, rank: idx + 1,
    surf: SURF.ROAD, offT: 0,
    drift: 0, driftDir: 0, driftChg: 0, driftYaw: 0, hopT: 0, wantHop: false,
    boostT: 0, boostPow: 1, boostTier: -1,
    spin: 0, small: 0, starT: 0, invT: 0,
    item: null, itemQty: 0, itemRoll: 0, itemRollT: 0,
    finished: false, finishT: 0, finishRank: 0, lapTimes: [], lapStart: 0,
    in: { th: 0, br: 0, st: 0, stRaw: 0, dr: false, it: false },
    wheelSpin: 0, steerVis: 0, bodyRoll: 0, bodyPitch: 0,
    ai_line: 0, ai_skill: 1, ai_react: 0, ai_itemT: 2, ai_driftT: 0, ai_panic: 0,
    engine: null, band: 1,
  };
}

/* 车所在的路面类型 */
function surfaceOf(k, loc) {
  const a = Math.abs(loc.lat), n = loc.node;
  if (a <= n.w) return SURF.ROAD;
  if (a <= n.w + CURB_W) return SURF.CURB;
  return SURF.VERGE;
}

function updateKart(k, dt) {
  const I = k.in;
  const wasAir = k.air;

  /* ---- 失控旋转：香蕉、龟壳、闪电都走这里 */
  if (k.spin > 0) {
    k.spin -= dt;
    k.yaw += 13.5 * dt;
    k.speed = approach(k.speed, 2.0, 5.5, dt);
    k.drift = 0; k.driftChg = 0; k.boostT = 0;
    if (k.spin <= 0) { k.spin = 0; k.invT = 0.7; }
  }
  const ctrl = k.spin <= 0 && !k.finished;

  /* ---- 状态计时 */
  if (k.boostT > 0) k.boostT -= dt;
  if (k.starT  > 0) { k.starT -= dt; if (k.starT <= 0) k.starT = 0; }
  if (k.small  > 0) { k.small -= dt; if (k.small <= 0) k.small = 0; }
  if (k.invT   > 0) k.invT -= dt;

  /* ---- 路面 */
  const loc0 = locate(k.x, k.z, k.node);
  k.node = loc0.i; k.lat = loc0.lat;
  k.surf = surfaceOf(k, loc0);

  /* ---- 极速：路面 × 涡轮 × 星星 × 被闪电压小 × 橡皮筋 */
  let mul = SURF_MUL[k.surf];
  if (k.starT > 0) mul = Math.max(mul, 1.02);
  let tMax = SPD_MAX * mul * k.band;
  if (k.boostT > 0) tMax *= k.boostPow;
  if (k.starT  > 0) tMax *= 1.22;
  if (k.small  > 0) tMax *= 0.70;
  tMax = Math.min(tMax, SPD_MAX * 1.55);           // 星星 + 紫火也不许突破这条线

  /* ---- 纵向 */
  if (ctrl) {
    if (I.th > 0) {
      /* 只在上限之下才加速。少了这个判断，涡轮期间"加速"和"回落"会互相追着涨，
         速度一路飞到两倍极速去。 */
      if (k.speed < tMax) {
        const room = clamp(1 - k.speed / Math.max(tMax, 1), 0, 1);
        k.speed += ACCEL * (0.35 + 0.65 * room) * I.th * dt;
        if (k.boostT > 0) k.speed += 9 * dt;       // 涡轮起效的那一下更冲
      }
    } else {
      /* 松油门只是滑行到停，不会自己滑成倒车。倒车必须按着刹车。 */
      k.speed = k.speed > 0 ? Math.max(0, k.speed - COAST * dt)
                            : Math.min(0, k.speed + COAST * dt);
    }
    if (I.br > 0) k.speed -= BRAKE * I.br * dt;
  } else if (!k.finished) {
    k.speed = k.speed > 0 ? Math.max(0, k.speed - COAST * dt)
                          : Math.min(0, k.speed + COAST * dt);
  } else k.speed = approach(k.speed, 0, 1.2, dt);

  if (k.surf === SURF.VERGE) k.speed -= 7.0 * dt;             // 出界额外拖
  if (k.speed > tMax) k.speed = approach(k.speed, tMax, k.boostT > 0 ? 0.4 : 2.4, dt);
  k.speed = clamp(k.speed, -REV_MAX, 60);

  /* ---- 起跳 / 漂移 */
  if (ctrl && I.dr && !k.wantHop && !k.air && k.hopT <= 0) {
    k.wantHop = true; k.hopT = 0.28;
    k.vy = 3.1; k.air = true;
    if (k === Race.player) SFX.hop();
  }
  if (!I.dr) k.wantHop = false;
  if (k.hopT > 0) k.hopT -= dt;

  if (k.drift) {
    if (!I.dr || k.speed < 7 || !ctrl) {
      /* 松手结算：够档位就给涡轮 */
      let tier = -1;
      for (let t = 0; t < MT.length; t++) if (k.driftChg >= MT[t].t) tier = t;
      if (tier >= 0) {
        k.boostT = Math.max(k.boostT, MT[tier].dur);
        k.boostPow = MT[tier].pow; k.boostTier = tier;
        if (k === Race.player) SFX.turbo(tier);
        emitBurst(k, MT[tier].col, 26 + tier * 10);
      }
      k.drift = 0; k.driftChg = 0;
    } else {
      k.driftChg += dt * (0.72 + 0.28 * clamp(k.speed / SPD_MAX, 0, 1));
      if (k.surf === SURF.VERGE) k.driftChg -= dt * 0.6;
    }
  } else if (ctrl && I.dr && (k.air || k.hopT > 0) && k.speed > 8 && Math.abs(I.stRaw) > 0.22) {
    /* 起漂看的是**按键意图**（stRaw），不是平滑之后的 st。
       方向平滑要 0.28 秒才升到 0.22，而一次起跳滞空只有 0.24 秒 ——
       用平滑值的话，从直线状态按「方向 + 跳」是漂不起来的。
       窗口也从"还在空中"放宽到"这一跳还没结束"，落地那一帧不至于差之毫厘。 */
    k.drift = 1; k.driftDir = sign(I.stRaw); k.driftChg = 0;
  }

  /* ---- 转向 */
  if (ctrl) {
    // 静止转不动，中速最灵，高速变钝
    const auth = clamp(k.speed / 5.0, 0, 1) * (1 - 0.42 * clamp(k.speed / SPD_MAX, 0, 1));
    let rate;
    if (k.drift) {
      const inward = I.st * k.driftDir;                   // >0 往漂移方向再打
      rate = k.driftDir * (DRIFT_MIN + (inward > 0 ? inward : inward * 0.62) * DRIFT_RANGE);
      rate *= auth;
    } else {
      rate = I.st * TURN * auth;
    }
    if (k.air) rate *= 0.22;
    if (k.small > 0) rate *= 1.15;
    k.head += rate * dt;
    k.steerVis = approach(k.steerVis, k.drift ? k.driftDir * 0.75 : I.st, 12, dt);
  } else k.steerVis = approach(k.steerVis, 0, 8, dt);

  /* 车身相对行进方向甩出去的角度，就是"在漂"的样子 */
  const tgtYawOff = k.drift ? k.driftDir * (0.34 + 0.16 * clamp(k.driftChg / 3, 0, 1)) : 0;
  k.driftYaw = approach(k.driftYaw, tgtYawOff, 9, dt);
  if (k.spin <= 0) k.yaw = k.head + k.driftYaw;

  /* ---- 位移 */
  const fx = Math.sin(k.head), fz = Math.cos(k.head);
  k.x += fx * k.speed * dt;
  k.z += fz * k.speed * dt;

  /* ---- 垂直：地面掉得比车快就飞出去 */
  const loc = locate(k.x, k.z, k.node);
  k.node = loc.i; k.lat = loc.lat;
  const gy = surfaceY(loc);
  if (!k.air) {
    const climb = (gy - k.y) / Math.max(dt, 1e-4);
    if (climb < -13) { k.air = true; k.vy = 0; }
    else k.y = gy;
  }
  if (k.air) {
    k.airT += dt;
    k.vy -= G * dt;
    k.y += k.vy * dt;
    if (k.y <= gy) {
      k.y = gy; k.vy = 0; k.air = false;
      if (k.airT > 0.30) {
        emitDust(k, 10);
        if (k === Race.player) SFX.land();
        k.speed *= 0.985;
      }
      k.airT = 0;
    }
  }

  /* ---- 撞墙 */
  const wl = loc.node.wall - 0.55;
  if (Math.abs(k.lat) > wl) {
    const sd = sign(k.lat);
    const p = worldAt(loc.s, wl * sd);
    k.x = p[0]; k.z = p[2];
    /* 掉多少速看**入射角**：正面撞上去几乎停死，擦着墙走基本不掉速。
       没有这一条的话，贴墙的每一帧都按正面撞扣，车会被墙吸住原地不动。 */
    const inc = Math.abs(Math.sin(angDiff(k.head, loc.node.head)));
    k.speed *= 1 - 0.62 * inc;
    /* 沿墙滑：把速度方向掰回赛道切线。角度插值必须走 angDiff，
       直接 approach 的话 3.1 收敛到 -3.1 会绕一整圈，车会当场自转。 */
    const tgtH = loc.node.head + (k.speed >= 0 ? 0 : PI);
    k.head += angDiff(tgtH, k.head) * (1 - Math.exp(-14 * dt));
    if (inc > 0.25) { k.drift = 0; k.driftChg = 0; }
    if (k === Race.player && inc > 0.3 && k.speed > 4) { SFX.bump(); shake(0.35 * inc); }
  }

  /* ---- 圈数 */
  const prevS = k.prevS;
  if (k.finished) { k.prevS = loc.s; k.s = loc.s; }
  else if (prevS > Track.L * 0.75 && loc.s < Track.L * 0.25) {
    k.lap++;
    if (k.lap === 1) k.lapStart = Race.time;          // 第一次过线只是发车，不计圈速
    else {
      k.lapTimes.push(Race.time - k.lapStart);
      k.lapStart = Race.time;
      if (k === Race.player && k.lap <= Track.laps) onPlayerLap();
    }
  } else if (prevS < Track.L * 0.25 && loc.s > Track.L * 0.75) k.lap = Math.max(0, k.lap - 1);
  if (!k.finished) { k.prevS = loc.s; k.s = loc.s; }
  k.prog = k.lap * Track.L + loc.s;

  /* ---- 视觉：车身随转向侧倾、随加减速俯仰 */
  const tgtRoll = -k.steerVis * (k.drift ? 0.20 : 0.12) * clamp(k.speed / 14, 0, 1) + loc.node.bank;
  k.bodyRoll  = approach(k.bodyRoll, tgtRoll, 9, dt);
  const accel = (k.speed - (k.lastSpeed || 0)) / Math.max(dt, 1e-4);
  k.lastSpeed = k.speed;
  k.bodyPitch = approach(k.bodyPitch, clamp(-accel * 0.008, -0.09, 0.09) - loc.node.pitch * 0.9, 7, dt);
  k.wheelSpin += k.speed / WR_R * dt;

  /* ---- 出界计时（AI 用来判断要不要回正） */
  k.offT = k.surf === SURF.VERGE ? k.offT + dt : 0;

  /* ---- 特效 */
  if (k.drift && !k.air) {
    let tier = -1;
    for (let t = 0; t < MT.length; t++) if (k.driftChg >= MT[t].t) tier = t;
    if (tier >= 0) emitSpark(k, MT[tier].col, tier);
  }
  if (k.boostT > 0) emitFlame(k);
  if (k.surf === SURF.VERGE && k.speed > 6) emitDust(k, 1);
  if (k.surf === SURF.CURB && k.speed > 10 && k === Race.player) SFX.rumble(dt);
  if (k.starT > 0) emitStar(k);
}

/* 车与车相撞：互相顶开，快的把慢的挤出去一点 */
function kartCollisions(dt) {
  const K = Race.karts;
  for (let i = 0; i < K.length; i++) for (let j = i + 1; j < K.length; j++) {
    const a = K[i], b = K[j];
    const dx = b.x - a.x, dz = b.z - a.z;
    const d2 = dx*dx + dz*dz;
    const R = (KART_R * (a.small > 0 ? 0.6 : 1) + KART_R * (b.small > 0 ? 0.6 : 1));
    if (d2 > R * R || d2 < 1e-6) continue;
    const d = Math.sqrt(d2), nx = dx / d, nz = dz / d;
    const push = (R - d) * 0.5;
    a.x -= nx * push; a.z -= nz * push;
    b.x += nx * push; b.z += nz * push;
    // 星星状态撞谁谁转
    if (a.starT > 0 && b.starT <= 0 && b.invT <= 0) spinOut(b, a);
    else if (b.starT > 0 && a.starT <= 0 && a.invT <= 0) spinOut(a, b);
    else {
      const rel = a.speed - b.speed;
      a.speed -= rel * 0.10; b.speed += rel * 0.10;
      if ((a === Race.player || b === Race.player) && Math.abs(rel) > 5) { SFX.bump(); shake(0.2); }
    }
  }
}

function spinOut(k, by) {
  if (k.spin > 0 || k.invT > 0 || k.starT > 0 || k.finished) return;
  k.spin = 1.25; k.boostT = 0; k.drift = 0; k.driftChg = 0;
  emitBurst(k, [1, 0.85, 0.35], 22);
  if (k === Race.player) { SFX.spin(); shake(0.8); toast('被打中了', 'warn'); }
  else if (by === Race.player) toast('打中 ' + k.nm.trim(), 'good');
}
function squash(k) {
  if (k.starT > 0 || k.finished) return;
  k.small = 4.5; k.speed *= 0.45; k.drift = 0; k.driftChg = 0; k.boostT = 0;
  if (k === Race.player) { SFX.zap(); shake(0.6); }
}

/* ==========================================================================
   12. 道具

   抽奖按名次加权：第一名基本只摸得到香蕉，最后一名才摸得到闪电和星星。
   这不是平衡补丁，是这类游戏的核心设计 —— 没有它，一局在第一个弯就结束了。
   ========================================================================== */
const ITEM_DEF = {
  banana:   { nm: '香蕉皮',   model: 'banana',   qty: 1 },
  green:    { nm: '绿龟壳',   model: 'shellG',   qty: 1 },
  red:      { nm: '红龟壳',   model: 'shellR',   qty: 1 },
  mushroom: { nm: '蘑　菇',   model: 'mushroom', qty: 1 },
  triple:   { nm: '三连蘑菇', model: 'mushroom', qty: 3 },
  star:     { nm: '无敌星',   model: 'star',     qty: 1 },
  bolt:     { nm: '闪　电',   model: 'bolt',     qty: 1 },
};
const ITEM_KEYS = ['banana', 'green', 'red', 'mushroom', 'triple', 'star', 'bolt'];
const ITEM_ODDS = [
  [46, 34,  0, 14,  4,  2,  0],   // 第 1 名
  [32, 30, 18, 14,  4,  2,  0],
  [24, 26, 24, 16,  6,  4,  0],
  [15, 20, 25, 18, 12,  8,  2],
  [10, 16, 24, 18, 16, 12,  4],
  [ 6, 12, 20, 18, 20, 16,  8],
  [ 3,  8, 16, 16, 22, 21, 14],
  [ 2,  5, 12, 14, 22, 25, 20],   // 第 8 名
];
function rollItem(rank) {
  const row = ITEM_ODDS[clamp(rank - 1, 0, 7)];
  let tot = 0; for (const w of row) tot += w;
  let r = Math.random() * tot;
  for (let i = 0; i < row.length; i++) { r -= row[i]; if (r <= 0) return ITEM_KEYS[i]; }
  return 'banana';
}

function giveItem(k) {
  if (k.item || k.itemRollT > 0) return;
  k.itemRollT = k.ai ? 0.35 : 0.85;                 // 玩家的抽奖多转一会儿，看得见在转
  k.itemRoll = 0;
  if (k === Race.player) SFX.roll();
}
function settleItem(k) {
  const key = rollItem(k.rank);
  k.item = key; k.itemQty = ITEM_DEF[key].qty;
  if (k === Race.player) { SFX.getItem(); flashItemBox(); }
}

function useItem(k) {
  if (!k.item || k.spin > 0 || k.finished) return;
  const key = k.item;
  const L = Track.L;
  if (key === 'banana') {
    Race.items.push({ kind: 'banana', s: (k.s - 2.2 + L) % L, lat: k.lat, life: 30, owner: k, arm: 0.5, spin: Math.random() * TAU });
    SFX.drop();
  } else if (key === 'green' || key === 'red') {
    const tgt = key === 'red' ? nextAhead(k) : null;
    Race.items.push({
      kind: key, s: (k.s + 2.4) % L, lat: k.lat, latV: 0,
      spd: Math.max(k.speed, 16) + 14, life: key === 'red' ? 9 : 12,
      owner: k, arm: 0.22, target: tgt, spin: 0,
    });
    SFX.shoot();
  } else if (key === 'mushroom' || key === 'triple') {
    k.boostT = Math.max(k.boostT, 1.35); k.boostPow = 1.30; k.boostTier = 1;
    emitBurst(k, [1, 0.55, 0.25], 18);
    if (k === Race.player) SFX.turbo(1);
  } else if (key === 'star') {
    k.starT = 6.5; k.invT = 6.5;
    if (k === Race.player) { SFX.star(); toast('无敌', 'good'); }
  } else if (key === 'bolt') {
    for (const o of Race.karts) if (o !== k && o.prog > k.prog) { squash(o); spinOut(o, k); }
    if (k === Race.player) { SFX.zap(); flashScreen(0.7); toast('闪电', 'good'); }
    else if (Race.player.small > 0) toast('被闪电劈了', 'warn');
  }
  k.itemQty--;
  if (k.itemQty <= 0) k.item = null;
}

/* 红龟壳的目标：名次紧挨着领先一位的那台车 */
function nextAhead(k) {
  let best = null, bd = Infinity;
  for (const o of Race.karts) {
    if (o === k || o.finished) continue;
    const d = o.prog - k.prog;
    if (d > 0 && d < bd) { bd = d; best = o; }
  }
  return best;
}

function updateItems(dt) {
  const L = Track.L;
  /* ---- 道具箱 */
  for (const sp of Track.itemSpots) {
    if (sp.taken > 0) { sp.taken -= dt; continue; }
    const n = Track.nodes[sp.i];
    for (const k of Race.karts) {
      if (k.finished || k.item || k.itemRollT > 0) continue;
      if (Math.abs(sDist(n.s, k.s)) < 1.6 && Math.abs(k.lat - sp.lat) < 1.5) {
        sp.taken = 4.0; giveItem(k);
        if (k === Race.player) emitBurst(k, [0.5, 0.9, 1.0], 12);
        break;
      }
    }
  }
  /* ---- 抽奖动画 */
  for (const k of Race.karts) {
    if (k.itemRollT > 0) {
      k.itemRollT -= dt; k.itemRoll += dt * 22;
      if (k.itemRollT <= 0) settleItem(k);
    }
  }
  /* ---- 加速带 */
  for (const bp of Track.boostSpots) {
    const n = Track.nodes[bp.i];
    for (const k of Race.karts) {
      if (k.finished || k.air) continue;
      const d = sDist(n.s, k.s);
      if (d > -1 && d < bp.len && Math.abs(k.lat - bp.lat) < 1.9) {
        if (k.boostT < 0.9) {
          k.boostT = Math.max(k.boostT, 1.0); k.boostPow = 1.24; k.boostTier = 0;
          if (k === Race.player) SFX.pad();
          emitBurst(k, [0.4, 0.9, 1.0], 10);
        }
      }
    }
  }
  /* ---- 飞行物与地面道具 */
  for (let i = Race.items.length - 1; i >= 0; i--) {
    const p = Race.items[i];
    p.life -= dt; p.arm -= dt; p.spin += dt * 6;
    if (p.life <= 0) { Race.items.splice(i, 1); continue; }

    if (p.kind !== 'banana') {
      if (p.kind === 'red' && p.target && !p.target.finished) {
        const dl = p.target.lat - p.lat;
        p.latV = approach(p.latV, clamp(dl * 2.4, -9, 9), 6, dt);
        p.spd = approach(p.spd, Math.max(p.target.speed + 11, 20), 2.2, dt);
      } else if (p.kind === 'red') {
        p.latV = approach(p.latV, 0, 3, dt);
      }
      p.s = (p.s + p.spd * dt) % L;
      p.lat += p.latV * dt;
      const n = Track.nodes[Math.round(p.s / Track.gap) % Track.N];
      const wl = n.wall - 0.4;
      if (Math.abs(p.lat) > wl) {                       // 绿壳撞墙反弹，红壳直接没
        if (p.kind === 'green') { p.lat = clamp(p.lat, -wl, wl); p.latV = -p.latV * 0.85 - sign(p.lat) * 2; }
        else { Race.items.splice(i, 1); continue; }
      }
    }

    /* 命中判定 */
    for (const k of Race.karts) {
      if (k.finished || (p.arm > 0 && k === p.owner)) continue;
      if (Math.abs(sDist(p.s, k.s)) > 1.4 || Math.abs(p.lat - k.lat) > 1.2) continue;
      if (k.starT > 0 || k.invT > 0) { if (p.kind !== 'banana') { Race.items.splice(i, 1); } break; }
      spinOut(k, p.owner);
      Race.items.splice(i, 1);
      break;
    }
  }
}

/* ==========================================================================
   13. 人机

   赛道是一维的（沿弧长），所以不需要寻路 —— AI 要做的是：
   看多远、什么时候松油门、什么时候起漂、以及道具怎么用。
   ========================================================================== */
const AI_BRAKE = 15.0;           // 人机反推刹车点时用的减速度 m/s²
const AI_SKILL = [
  /* 三档的差别主要压在 look 和 react 上 —— 这两个是 tools/sweep 扫出来唯一
     单调有效的参数（前瞻 0.6 比 1.2 快两秒）。前瞻太远等于一路切弯，
     切出去就得回来，反而慢。
       look      瞄准点看多远（乘数）。远＝笨
       react     隔多久重新判断一次方向。长＝迟钝
       err       方向上的随机误差，八台车不会走同一条完美线
       band      橡皮筋幅度
       spd       人机的极速系数。前瞻降到 0.75 以下就没有收益了，光靠开法
                 拉不开"标准"和"困难"，所以再给一个直接的速度差 —— 这类
                 游戏通常也是这么分档的
     latAcc / hold / driftMul 三档给的是同一个值：扫下来它们对圈速的影响都在
     噪声里，分档只会让"困难"莫名其妙变慢。 */
  { latAcc: 14.5, look: 1.16, react: 0.36, err: 0.18,  band: 0.055, itemGap: 3.2, hold: 0.45, driftMul: 2.0, spd: 0.980, name: '轻松' },
  { latAcc: 14.5, look: 0.88, react: 0.20, err: 0.10,  band: 0.075, itemGap: 2.2, hold: 0.45, driftMul: 2.0, spd: 1.000, name: '标准' },
  { latAcc: 14.5, look: 0.62, react: 0.08, err: 0.03,  band: 0.090, itemGap: 1.4, hold: 0.45, driftMul: 2.0, spd: 1.032, name: '困难' },
];

function curvAt(s) {
  const { nodes, N, gap } = Track;
  return nodes[((Math.round(s / gap) % N) + N) % N].curv;
}
/* 前方 from..to 米内曲率绝对值的峰值，用来决定刹车点和起漂点 */
function peakCurv(s, from, to) {
  let m = 0, sg = 0;
  for (let d = from; d <= to; d += 5) {
    const c = curvAt(s + d);
    if (Math.abs(c) > m) { m = Math.abs(c); sg = sign(c); }
  }
  return { mag: m, sign: sg };
}

function updateAI(k, dt) {
  const I = k.in, S = AI_SKILL[Race.diff];
  if (k.finished) { I.th = 0; I.br = 0; I.st = 0; I.dr = false; return; }

  /* ---- 橡皮筋：落后的加把劲，领先的收着点。没有这一条，人机不是被甩没就是追不上。 */
  const gapM = (k.prog - Race.player.prog);
  k.band = S.spd * clamp(1 - gapM * 0.00055, 1 - S.band, 1 + S.band * 1.5);

  /* 前瞻距离：太远会切弯切过头，太近会来不及。跟速度走，但压在一个区间里 */
  const look = clamp((7.5 + k.speed * 0.58) * S.look, 6, 32);
  const ahead = peakCurv(k.s, 4, 46);

  /* ---- 目标横向位置：贴弯内侧 + 每台车自己的偏好线，免得排成一条 */
  const cNow = curvAt(k.s + look * 0.5);
  const w = Track.nodes[k.node].w;
  let tgtLat = sign(cNow) * w * 0.46 * clamp(Math.abs(cNow) * 80, 0, 1) + k.ai_line * w * 0.42;
  tgtLat = clamp(tgtLat, -w * 0.86, w * 0.86);

  /* ---- 躲香蕉：前方 34 米内挡道的，把目标线挪开 */
  for (const p of Race.items) {
    if (p.kind !== 'banana' && p.kind !== 'green') continue;
    const d = sDist(k.s, p.s);
    if (d < 2 || d > 34) continue;
    if (Math.abs(p.lat - tgtLat) < 2.2) {
      tgtLat = p.lat + (p.lat > 0 ? -3.0 : 3.0);
      tgtLat = clamp(tgtLat, -w * 0.86, w * 0.86);
    }
  }
  /* 掉出赛道就先回来 */
  if (k.offT > 0.35) tgtLat = 0;

  /* ---- 转向：瞄准前方目标点，带一点随机误差（不然八台车走同一条完美线） */
  k.ai_react -= dt;
  if (k.ai_react <= 0) {
    k.ai_react = S.react;
    k.ai_noise = (Math.random() - 0.5) * S.err * 2;
  }
  const tp = worldAt(k.s + look, tgtLat);
  const want = Math.atan2(tp[0] - k.x, tp[2] - k.z);
  const err = angDiff(want, k.head) + (k.ai_noise || 0);
  I.st = clamp(err * 3.6, -1, 1);
  I.stRaw = Math.abs(I.st) > 0.22 ? sign(I.st) : 0;    // 人机的 st 没有平滑，直接取符号

  /* ---- 油门与刹车：算刹车点

     光看"眼前弯多急"是不够的 —— 等看见弯再刹已经晚了。对前方每一个采样点
     算出那里的过弯极限速度 vc，再反推"现在最快能有多快，才刹得住"：
       v = sqrt(vc² + 2·a·d)
     取所有采样点里最小的那个，就是这一刻该有的速度上限。 */
  let vLim = 999;
  for (let d = 4; d <= 95; d += 6) {
    const c = Math.abs(curvAt(k.s + d));
    if (c < 2e-5) continue;
    const vc = Math.sqrt(S.latAcc / c);
    const v = Math.sqrt(vc * vc + 2 * AI_BRAKE * d);
    if (v < vLim) vLim = v;
  }
  const over = k.speed - vLim;
  if (over > 2.2)      { I.th = 0; I.br = clamp(over / 6, 0.35, 1); }
  else if (over > 0.4) { I.th = 0.22; I.br = 0; }
  else                 { I.th = 1; I.br = 0; }
  /* 出界了：先把车头掰回赛道，油门收一半，硬冲只会一直在雪里 */
  if (k.surf === SURF.VERGE) {
    I.th = 0.55; I.br = 0;
    I.st = clamp(I.st - sign(k.lat) * 0.55, -1, 1);
  }

  /* ---- 漂移

     漂移状态下转向有个**下限**（DRIFT_MIN），也就是说漂着的时候车拐不直。
     所以比"漂移的最小转弯半径"还缓的弯，漂进去必然冲出赛道 —— 只有够急的弯
     才值得漂。这一条判断没有的话，人机会在长弯里一路漂到雪地里去。 */
  const auth = clamp(k.speed / 5.0, 0, 1) * (1 - 0.42 * clamp(k.speed / SPD_MAX, 0, 1));
  const driftR = k.speed / Math.max(DRIFT_MIN * auth, 0.08);
  const cornerR = ahead.mag > 1e-5 ? 1 / ahead.mag : 1e9;

  if (cornerR < driftR * S.driftMul && k.speed > 13.5 && Math.abs(err) < 0.7 && k.surf !== SURF.VERGE) {
    k.ai_driftT = Math.max(k.ai_driftT, 0.5);
    if (!k.drift) {                                    // 先把方向打出去才起得来
      I.st = clamp(I.st + ahead.sign * 0.55, -1, 1);
      I.stRaw = sign(I.st);
    }
  }
  if (k.drift) {
    if (curvAt(k.s + 6) * k.driftDir < 0) k.ai_driftT = 0;               // 进反向弯了，松
    /* 弯要跑完了，但差一点点就够下一档涡轮：按住多等一下。
       愿意等多久由难度决定，这是三档之间圈速差的主要来源。 */
    else if (k.ai_driftT <= dt && k.offT === 0) {
      for (let t = MT.length - 1; t >= 0; t--) {
        const need = MT[t].t - k.driftChg;
        if (need > 0 && need <= S.hold) { k.ai_driftT = need + dt; break; }
      }
    }
    /* 但攒火不能攒到出界：按当前航向往前推一下，快到路边就立刻松手回正 */
    const lat1 = k.lat + k.speed * Math.sin(angDiff(k.head, Track.nodes[k.node].head)) * 0.85;
    if (Math.abs(lat1) > w * 0.92) k.ai_driftT = 0;
  }
  k.ai_driftT -= dt;
  I.dr = k.ai_driftT > 0;

  /* ---- 道具 */
  k.ai_itemT -= dt;
  if (k.item && k.ai_itemT <= 0) {
    const key = k.item;
    let go = false;
    if (key === 'mushroom' || key === 'triple') go = ahead.mag < 0.008 && k.speed > 15;
    else if (key === 'star') go = true;
    else if (key === 'bolt') go = k.rank > 2;
    else if (key === 'red')  { const t = nextAhead(k); go = t && (t.prog - k.prog) < 60; }
    else if (key === 'green'){ const t = nextAhead(k); go = t && (t.prog - k.prog) < 32 && ahead.mag < 0.010; }
    else if (key === 'banana') { const b = behindNear(k); go = !!b || k.rank <= 3; }
    if (go) { useItem(k); k.ai_itemT = S.itemGap; }
    else if (k.ai_itemT < -6) { useItem(k); k.ai_itemT = S.itemGap; }   // 攥太久就随便用了
  }
}
function behindNear(k) {
  for (const o of Race.karts) {
    if (o === k || o.finished) continue;
    const d = k.prog - o.prog;
    if (d > 0 && d < 26) return o;
  }
  return null;
}

/* ==========================================================================
   14. 粒子

   每帧在 CPU 上把存活的粒子拍成面向相机的片，一次传上去一次画完。
   ========================================================================== */
const Parts = [];
const PART_MAX = 850;

function addPart(x, y, z, vx, vy, vz, life, size, col, grow, fade) {
  if (Parts.length >= PART_MAX) return;
  Parts.push({ x, y, z, vx, vy, vz, t: life, life, size, col, grow: grow || 0, fade: fade || 1, drag: 2.2 });
}
/* 车后轮的位置（漂移火花、扬尘都从这儿出） */
function rearAxle(k, sd) {
  const fx = Math.sin(k.yaw), fz = Math.cos(k.yaw);
  const rx = fz, rz = -fx;
  return [k.x - fx * WB + rx * sd * (KART_W + 0.10), k.y + 0.12, k.z - fz * WB + rz * sd * (KART_W + 0.10)];
}
function emitSpark(k, col, tier) {
  if (Quality.particles < 1) return;
  const n = 1 + tier;
  for (let i = 0; i < n; i++) {
    const sd = i % 2 ? 1 : -1;
    const p = rearAxle(k, k.driftDir ? -k.driftDir : sd);
    const fx = Math.sin(k.yaw), fz = Math.cos(k.yaw);
    addPart(p[0], p[1], p[2],
      -fx * (3 + Math.random() * 5) + (Math.random()-0.5) * 4,
      1.4 + Math.random() * 2.6,
      -fz * (3 + Math.random() * 5) + (Math.random()-0.5) * 4,
      0.20 + Math.random() * 0.18, 0.10 + tier * 0.035, col, -0.10, 1.6);
  }
}
function emitFlame(k) {
  if (Quality.particles < 1) return;
  const c = k.boostTier >= 0 ? MT[k.boostTier].col : [1, 0.7, 0.3];
  for (const sd of [-1, 1]) {
    const fx = Math.sin(k.yaw), fz = Math.cos(k.yaw), rx = fz, rz = -fx;
    addPart(k.x - fx * (KART_L + 0.1) + rx * sd * 0.20, k.y + 0.42, k.z - fz * (KART_L + 0.1) + rz * sd * 0.20,
      -fx * 5 + (Math.random()-0.5) * 1.4, 0.7 + Math.random() * 1.0, -fz * 5 + (Math.random()-0.5) * 1.4,
      0.24, 0.20, c, -0.28, 1.4);
  }
}
function emitDust(k, n) {
  if (Quality.particles < 1) return;
  const c = Track.theme.verge;
  for (let i = 0; i < n; i++) {
    const p = rearAxle(k, i % 2 ? 1 : -1);
    addPart(p[0], p[1], p[2], (Math.random()-0.5)*2.4, 0.5 + Math.random()*1.4, (Math.random()-0.5)*2.4,
      0.5 + Math.random() * 0.4, 0.22, [c[0]*1.1, c[1]*1.1, c[2]*1.1], 0.7, 0.75);
  }
}
function emitBurst(k, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, e = Math.random() * 0.9;
    const sp = 3 + Math.random() * 7;
    addPart(k.x, k.y + 0.5, k.z, Math.cos(a)*sp, e*sp*0.8 + 1.5, Math.sin(a)*sp,
      0.36 + Math.random()*0.3, 0.15, col, -0.06, 1.5);
  }
}
function emitStar(k) {
  if (Quality.particles < 1 || Math.random() > 0.6) return;
  const a = Math.random() * TAU, h = ((Math.sin(Race.time * 5) + 1) / 2);
  addPart(k.x + Math.cos(a) * 0.7, k.y + 0.3 + Math.random() * 0.7, k.z + Math.sin(a) * 0.7,
    0, 1.6, 0, 0.42, 0.16, [1, 0.75 + h * 0.25, 0.25], -0.05, 1.8);
}

function updateParts(dt) {
  for (let i = Parts.length - 1; i >= 0; i--) {
    const p = Parts[i];
    p.t -= dt;
    if (p.t <= 0) { Parts.splice(i, 1); continue; }
    const d = Math.exp(-p.drag * dt);
    p.vx *= d; p.vz *= d;
    p.vy = p.vy * d - 7 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.size = Math.max(0.01, p.size + p.grow * dt);
  }
}
/* 拍成朝向相机的四边形 */
function fillFX(rx, ry, rz, ux, uy, uz) {
  let o = 0; const A = FX.arr;
  for (const p of Parts) {
    if (o + 6 * FX_VSZ > A.length) break;
    const a = clamp(p.t / p.life, 0, 1) * p.fade;
    const s = p.size;
    const c0 = p.col[0], c1 = p.col[1], c2 = p.col[2];
    const px = rx * s, py = ry * s, pz = rz * s;
    const qx = ux * s, qy = uy * s, qz = uz * s;
    const V = (dx, dy, dz) => { A[o++] = p.x + dx; A[o++] = p.y + dy; A[o++] = p.z + dz;
                                A[o++] = c0; A[o++] = c1; A[o++] = c2; A[o++] = a; };
    V(-px - qx, -py - qy, -pz - qz); V(px - qx, py - qy, pz - qz); V(px + qx, py + qy, pz + qz);
    V(-px - qx, -py - qy, -pz - qz); V(px + qx, py + qy, pz + qz); V(-px + qx, -py + qy, -pz + qz);
  }
  FX.n = o / FX_VSZ;
  if (FX.n) {
    gl.bindBuffer(gl.ARRAY_BUFFER, FX.buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, A.subarray(0, o));
  }
}

/* ==========================================================================
   15. 镜头
   ========================================================================== */
const Cam = {
  x: 0, y: 5, z: -10, lx: 0, ly: 0, lz: 0, yaw: 0,
  fov: 1.36, fovT: 1.36, shake: 0, roll: 0, dist: 5.6, high: 2.25,
};
function shake(v) { Cam.shake = Math.min(Cam.shake + v, 1.6); }

function updateCamera(dt, snap) {
  const k = Race.player;
  /* 镜头跟的是行进方向而不是车身朝向：漂移时车甩出去，镜头不跟着甩，
     所以你看得见自己在滑 —— 这一条是"漂移好看"的全部秘密。 */
  let want = k.head;
  // 稍微朝前方赛道的方向偏一点，进弯能看见弯里
  const fwd = atS(k.s + 22);
  want = k.head + angDiff(fwd.head, k.head) * 0.30;
  Cam.yaw = snap ? want : Cam.yaw + angDiff(want, Cam.yaw) * (1 - Math.exp(-7.5 * dt));

  const sp = clamp(k.speed / SPD_MAX, 0, 1.5);
  const dist = Cam.dist + sp * 0.85 + (k.boostT > 0 ? 0.5 : 0);
  const high = Cam.high + sp * 0.28;

  const fx = Math.sin(Cam.yaw), fz = Math.cos(Cam.yaw);
  const tx = k.x - fx * dist, ty = k.y + high, tz = k.z - fz * dist;
  const r = snap ? 1 : (1 - Math.exp(-11 * dt));
  Cam.x += (tx - Cam.x) * r; Cam.y += (ty - Cam.y) * r; Cam.z += (tz - Cam.z) * r;

  /* 别穿到地里 */
  const cl = locate(Cam.x, Cam.z, k.node);
  const minY = surfaceY(cl) + 0.9;
  if (Cam.y < minY) Cam.y = minY;

  Cam.lx = k.x + fx * 6.5; Cam.ly = k.y + 1.05; Cam.lz = k.z + fz * 6.5;

  /* 视场角随速度张开：速度感的一大半来自这里，而不是实际速度 */
  Cam.fovT = 1.30 + sp * 0.16 + (k.boostT > 0 ? 0.10 : 0) + (k.starT > 0 ? 0.04 : 0);
  Cam.fov = snap ? Cam.fovT : approach(Cam.fov, Cam.fovT, 6, dt);

  /* 漂移时镜头轻微侧倾 */
  Cam.roll = approach(Cam.roll, -k.driftYaw * 0.22 - k.bodyRoll * 0.10, 6, dt);
  if (Cam.shake > 0) Cam.shake = Math.max(0, Cam.shake - dt * 2.6);
}

/* ==========================================================================
   16. 声音：全部实时合成，仓库里没有音频文件
   ========================================================================== */
const Audio_ = { ctx: null, master: null, musicGain: null, sfxGain: null, on: false, muted: false };
function audioInit() {
  if (Audio_.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  Audio_.ctx = ctx;
  Audio_.master = ctx.createGain(); Audio_.master.gain.value = 0.9;
  Audio_.master.connect(ctx.destination);
  Audio_.sfxGain = ctx.createGain(); Audio_.sfxGain.gain.value = 0.85; Audio_.sfxGain.connect(Audio_.master);
  Audio_.musicGain = ctx.createGain(); Audio_.musicGain.gain.value = 0.30; Audio_.musicGain.connect(Audio_.master);
  Audio_.on = true;
  buildNoise();
  startEngine();
  startCrowd();
}
function actx() { return Audio_.ctx; }

let NOISE = null;
function buildNoise() {
  const ctx = actx(), n = ctx.sampleRate * 2;
  NOISE = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = NOISE.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
}
function noiseSrc(loop) {
  const s = actx().createBufferSource(); s.buffer = NOISE; s.loop = !!loop; return s;
}
function env(node, t0, a, d, peak) {
  const g = node.gain;
  g.setValueAtTime(0.0001, t0);
  g.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t0 + a);
  g.exponentialRampToValueAtTime(0.0001, t0 + a + d);
}
function blip(freq, t0, dur, type, peak, sweepTo) {
  if (!Audio_.on) return;
  const ctx = actx(), o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
  if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
  env(g, t0, 0.012, dur, peak === undefined ? 0.22 : peak);
  o.connect(g); g.connect(Audio_.sfxGain); o.start(t0); o.stop(t0 + dur + 0.06);
}
function noiseHit(t0, dur, peak, lp) {
  if (!Audio_.on) return;
  const ctx = actx(), s = noiseSrc(false), g = ctx.createGain(), f = ctx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.setValueAtTime(lp || 2200, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max((lp || 2200) * 0.25, 120), t0 + dur);
  env(g, t0, 0.006, dur, peak === undefined ? 0.25 : peak);
  s.connect(f); f.connect(g); g.connect(Audio_.sfxGain); s.start(t0); s.stop(t0 + dur + 0.05);
}

/* ---- 引擎：两个略微失谐的锯齿波过低通，频率跟着转速走 */
const Engine = { o1: null, o2: null, f: null, g: null, sub: null, rumbleT: 0 };
function startEngine() {
  const ctx = actx();
  Engine.g = ctx.createGain(); Engine.g.gain.value = 0.0;
  Engine.f = ctx.createBiquadFilter(); Engine.f.type = 'lowpass'; Engine.f.frequency.value = 900;
  Engine.f.Q.value = 3.2;
  Engine.o1 = ctx.createOscillator(); Engine.o1.type = 'sawtooth';
  Engine.o2 = ctx.createOscillator(); Engine.o2.type = 'square';
  Engine.sub = ctx.createGain(); Engine.sub.gain.value = 0.35;
  Engine.o1.connect(Engine.f); Engine.o2.connect(Engine.sub); Engine.sub.connect(Engine.f);
  Engine.f.connect(Engine.g); Engine.g.connect(Audio_.master);
  Engine.o1.start(); Engine.o2.start();
}
function updateEngine(dt) {
  if (!Audio_.on || !Engine.o1 || !Race.player) return;
  const k = Race.player, ctx = actx(), t = ctx.currentTime;
  const rev = clamp(Math.abs(k.speed) / SPD_MAX, 0, 1.5);
  /* 分五个"档"，过档时频率跌回去一点 —— 听上去才像在换挡而不是在拉线性扫频 */
  const gear = Math.min(4, Math.floor(rev * 5));
  const inGear = rev * 5 - gear;
  const base = 58 + gear * 9 + inGear * 62;
  const boost = k.boostT > 0 ? 1.22 : 1;
  Engine.o1.frequency.setTargetAtTime(base * boost, t, 0.05);
  Engine.o2.frequency.setTargetAtTime(base * 0.5 * boost, t, 0.05);
  Engine.f.frequency.setTargetAtTime(420 + rev * 1900 + (k.in.th > 0 ? 350 : 0), t, 0.06);
  const vol = Race.state === 'race' || Race.state === 'countdown'
    ? (0.055 + rev * 0.085) * (k.in.th > 0 ? 1 : 0.62) * (Audio_.muted ? 0 : 1) : 0;
  Engine.g.gain.setTargetAtTime(vol, t, 0.08);
}
/* ---- 看台底噪 */
function startCrowd() {
  const ctx = actx(), s = noiseSrc(true), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = 'bandpass'; f.frequency.value = 620; f.Q.value = 0.7;
  g.gain.value = 0.0;
  s.connect(f); f.connect(g); g.connect(Audio_.master); s.start();
  Audio_.crowdGain = g;
}

const SFX = {
  hop()  { const t = actx() ? actx().currentTime : 0; blip(420, t, 0.09, 'square', 0.11, 700); },
  land() { noiseHit(actx().currentTime, 0.14, 0.16, 900); },
  bump() { noiseHit(actx().currentTime, 0.2, 0.30, 700); blip(90, actx().currentTime, 0.16, 'sawtooth', 0.16, 50); },
  spin() { const t = actx().currentTime; blip(600, t, 0.5, 'sawtooth', 0.2, 120); noiseHit(t, 0.4, 0.24, 1600); },
  turbo(tier) {
    const t = actx().currentTime, f0 = [340, 400, 470][tier] || 340;
    blip(f0, t, 0.30, 'sawtooth', 0.20, f0 * 3.2);
    blip(f0 * 1.5, t + 0.02, 0.26, 'square', 0.10, f0 * 4);
    noiseHit(t, 0.24, 0.16, 3200);
  },
  pad()  { const t = actx().currentTime; blip(300, t, 0.22, 'triangle', 0.18, 1100); },
  drop() { noiseHit(actx().currentTime, 0.1, 0.14, 1200); },
  shoot(){ const t = actx().currentTime; blip(720, t, 0.16, 'square', 0.15, 300); },
  star() { const t = actx().currentTime;
           [0,1,2,3,4].forEach(i => blip(523 * Math.pow(2, i/5), t + i*0.06, 0.14, 'triangle', 0.16)); },
  zap()  { const t = actx().currentTime; noiseHit(t, 0.5, 0.34, 5200); blip(1400, t, 0.4, 'sawtooth', 0.16, 90); },
  roll() { const t = actx().currentTime;
           for (let i = 0; i < 5; i++) blip(500 + i * 40, t + i * 0.11, 0.05, 'square', 0.07); },
  getItem(){ const t = actx().currentTime; blip(660, t, 0.09, 'square', 0.14); blip(990, t+0.07, 0.12, 'square', 0.14); },
  count(n){ const t = actx().currentTime;
            if (n > 0) blip(440, t, 0.22, 'square', 0.26);
            else { blip(880, t, 0.5, 'square', 0.30); blip(1320, t + 0.01, 0.5, 'triangle', 0.18); } },
  lap()  { const t = actx().currentTime; blip(880, t, 0.1, 'triangle', 0.18); blip(1174, t+0.09, 0.16, 'triangle', 0.18); },
  finish(){ const t = actx().currentTime;
            [0, 4, 7, 12].forEach((s, i) => blip(392 * Math.pow(2, s/12), t + i*0.11, 0.34, 'triangle', 0.22)); },
  rumble(dt) {
    Engine.rumbleT -= dt;
    if (Engine.rumbleT <= 0) { Engine.rumbleT = 0.055; noiseHit(actx().currentTime, 0.05, 0.09, 1500); }
  },
};
/* 没开音频时所有音效都是空转，不用到处判空 */
for (const k in SFX) { const f = SFX[k]; SFX[k] = function () { if (Audio_.on && !Audio_.muted) try { return f.apply(SFX, arguments); } catch (e) {} }; }

/* ---- 配乐：一段简单的循环，按主题换调 */
const Music = { t: 0, step: 0, on: false, key: 0 };
const SCALE = [0, 2, 4, 7, 9];
function musicTick(dt) {
  if (!Audio_.on || Audio_.muted || !Music.on) return;
  Music.t -= dt;
  if (Music.t > 0) return;
  Music.t = 0.1875;                              // 160 BPM 的十六分音符
  const ctx = actx(), t = ctx.currentTime, st = Music.step++;
  const root = 55 * Math.pow(2, Music.key / 12);
  if (st % 4 === 0) {                            // 低音
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = root * (st % 16 < 8 ? 1 : 1.3348);
    env(g, t, 0.01, 0.22, 0.16); o.connect(g); g.connect(Audio_.musicGain);
    o.start(t); o.stop(t + 0.3);
  }
  if (st % 2 === 0) {                            // 琶音
    const deg = SCALE[(st / 2 + (st % 16 < 8 ? 0 : 2)) % 5];
    const f = root * 4 * Math.pow(2, deg / 12);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = f;
    env(g, t, 0.008, 0.13, 0.055); o.connect(g); g.connect(Audio_.musicGain);
    o.start(t); o.stop(t + 0.2);
  }
  if (st % 8 === 4) noiseHit(t, 0.07, 0.06, 5000);
}

/* ==========================================================================
   17. 比赛状态
   ========================================================================== */
const Race = {
  state: 'title',            // title | countdown | race | finished | paused
  karts: [], player: null, items: [],
  time: 0, countdown: 0, diff: 1, trackIdx: 0, charIdx: 0,
  order: [], laps: 3, qual: 0, forcePad: false,
  flash: 0, hype: 0, best: [null, null, null],
};

/* 最快单圈存本地。私密浏览、禁用站点数据都会让它读写失败，所以整块包起来。 */
const BEST_KEY = 'kart.best.v1';
function loadBest() {
  try {
    const v = JSON.parse(localStorage.getItem(BEST_KEY));
    if (Array.isArray(v)) for (let i = 0; i < Race.best.length; i++)
      if (typeof v[i] === 'number' && isFinite(v[i])) Race.best[i] = v[i];
  } catch (e) {}
}
function saveBest() { try { localStorage.setItem(BEST_KEY, JSON.stringify(Race.best)); } catch (e) {} }

/* ==========================================================================
   18. 渲染
   ========================================================================== */
const MTX = {
  vp: M4.ident(), proj: M4.ident(), view: M4.ident(), invVP: M4.ident(),
  m: M4.ident(), tmp: M4.ident(), tmp2: M4.ident(), lightVP: M4.ident(),
};

function buildLightVP() {
  const T = Track.theme, k = Race.player;
  const R = 58, sun = T.sun;
  /* 阴影框跟着玩家走，并往前偏一点（前面才是要看的地方） */
  const fx = Math.sin(Cam.yaw), fz = Math.cos(Cam.yaw);
  let cx = k.x + fx * 16, cy = k.y, cz = k.z + fz * 16;

  /* 把中心点吸附到阴影贴图的纹素格子上，不然车一动阴影边缘就会爬 */
  let ax = -sun[2], az = sun[0];                    // cross(sun, +Y) 的水平分量
  const al = Math.hypot(ax, az) || 1; ax /= al; az /= al;
  const ux = -az, uz = ax;                          // 与之垂直的另一根水平轴
  const texel = 2 * R / Shadow.size;
  const pa = Math.round((cx * ax + cz * az) / texel) * texel;
  const pb = Math.round((cx * ux + cz * uz) / texel) * texel;
  cx = pa * ax + pb * ux; cz = pa * az + pb * uz;

  M4.look(MTX.tmp, cx + sun[0] * 170, cy + sun[1] * 170, cz + sun[2] * 170, cx, cy, cz, 0, 1, 0);
  M4.ortho(MTX.tmp2, -R, R, -R, R, 1, 340);
  M4.mul(MTX.lightVP, MTX.tmp2, MTX.tmp);
  Shadow.vp = MTX.lightVP;
}

/* 一台车的车身矩阵 */
function kartMatrix(out, k) {
  const sc = k.small > 0 ? 0.55 : 1;
  return M4.trs(out, k.x, k.y, k.z, k.yaw, k.bodyRoll, k.bodyPitch, sc);
}
/* 车轮：车身矩阵 × 局部（位移 + 转向 + 滚动） */
const wheelLocal = M4.ident(), wheelOut = M4.ident();
function drawKartWheels(k, prog, isDepth) {
  const sc = k.small > 0 ? 0.55 : 1;
  kartMatrix(MTX.m, k);
  for (let i = 0; i < 4; i++) {
    const front = i < 2, sd = (i % 2) ? 1 : -1;
    const r = front ? WR_F : WR_R;
    M4.trs(wheelLocal, sd * (KART_W + 0.07), r, front ? WB : -WB,
           front ? k.steerVis * 0.42 : 0, 0, k.wheelSpin, 1);
    M4.mul(wheelOut, MTX.m, wheelLocal);
    gl.uniformMatrix4fv(prog.u.uM, false, wheelOut);
    (front ? MODELS.wheelF : MODELS.wheelR).draw();
  }
}

function drawWorld(prog, isDepth) {
  const T = Track.theme;
  /* ---- 赛道与布景 */
  gl.uniformMatrix4fv(prog.u.uM, false, M4.ident());
  for (const e of Track.meshes) {
    if (isDepth && !e.shadow) continue;
    if (!isDepth) {
      gl.uniform1f(prog.u.uMat, e.mat);
      gl.uniform1f(prog.u.uSpec, e.spec);
      gl.uniform1f(prog.u.uEmis, e.emis);
    }
    e.m.draw();
  }
  if (!isDepth) { gl.uniform1f(prog.u.uMat, 0); gl.uniform1f(prog.u.uEmis, 0); }

  /* ---- 车 */
  if (!isDepth) gl.uniform1f(prog.u.uSpec, 0.42);
  for (const k of Race.karts) {
    if (!isDepth) {
      const t = k.starT > 0 ? 1 + 0.5 * Math.sin(Race.time * 22) : 1;
      const inv = k.invT > 0 && k.starT <= 0 && Math.floor(Race.time * 14) % 2 === 0;
      gl.uniform3f(prog.u.uTint, t, t, t);
      gl.uniform1f(prog.u.uEmis, k.starT > 0 ? 0.35 + 0.3 * Math.sin(Race.time * 18) : 0);
      gl.uniform1f(prog.u.uAlpha, inv ? 0.4 : 1);
    }
    kartMatrix(MTX.m, k);
    gl.uniformMatrix4fv(prog.u.uM, false, MTX.m);
    k.body.draw();
    drawKartWheels(k, prog, isDepth);
  }
  if (!isDepth) {
    gl.uniform3f(prog.u.uTint, 1, 1, 1);
    gl.uniform1f(prog.u.uAlpha, 1);
    gl.uniform1f(prog.u.uEmis, 0);
    gl.uniform1f(prog.u.uSpec, 0);
  }

  /* ---- 道具箱：悬空慢转 */
  for (const sp of Track.itemSpots) {
    if (sp.taken > 0) continue;
    const n = Track.nodes[sp.i];
    const p = worldAt(n.s, sp.lat, 0.85);
    const sc = 1;
    M4.trs(MTX.m, p[0], p[1] + Math.sin(Race.time * 2 + sp.i) * 0.10, p[2],
           Race.time * 0.9 + sp.i, 0, Race.time * 0.55, sc);
    gl.uniformMatrix4fv(prog.u.uM, false, MTX.m);
    if (!isDepth) { gl.uniform1f(prog.u.uEmis, 0.55); gl.uniform1f(prog.u.uAlpha, 0.62); }
    MODELS.box.draw();
    if (!isDepth) { gl.uniform1f(prog.u.uEmis, 1.6); gl.uniform1f(prog.u.uAlpha, 1); }
    MODELS.boxCore.draw();
    if (!isDepth) gl.uniform1f(prog.u.uEmis, 0);
  }

  /* ---- 地上和空中的道具 */
  for (const p of Race.items) {
    const w = worldAt(p.s, p.lat, p.kind === 'banana' ? 0.06 : 0.34);
    M4.trs(MTX.m, w[0], w[1], w[2], p.spin, 0, 0, 1);
    gl.uniformMatrix4fv(prog.u.uM, false, MTX.m);
    if (!isDepth) gl.uniform1f(prog.u.uSpec, 0.35);
    MODELS[p.kind === 'banana' ? 'banana' : p.kind === 'red' ? 'shellR' : 'shellG'].draw();
    if (!isDepth) gl.uniform1f(prog.u.uSpec, 0);
  }
}

function render(dt) {
  const T = Track.theme;

  /* ---------------- 阴影 pass */
  if (Quality.shadow && Shadow.fbo) {
    buildLightVP();
    gl.bindFramebuffer(gl.FRAMEBUFFER, Shadow.fbo);
    gl.viewport(0, 0, Shadow.size, Shadow.size);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.enable(gl.CULL_FACE); gl.cullFace(gl.FRONT);      // 画背面，把痤疮推到看不见的一侧
    gl.useProgram(SH_DEPTH.p);
    gl.uniformMatrix4fv(SH_DEPTH.u.uLightVP, false, MTX.lightVP);
    drawWorld(SH_DEPTH, true);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.cullFace(gl.BACK);
    Shadow.on = true;
  } else Shadow.on = false;

  /* ---------------- 主 pass */
  gl.viewport(0, 0, View.w, View.h);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.enable(gl.CULL_FACE);
  gl.disable(gl.BLEND);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  /* 镜头抖动 */
  let sx = 0, sy = 0;
  if (Cam.shake > 0.001) {
    const a = Cam.shake * 0.20;
    sx = (Math.random() - 0.5) * a; sy = (Math.random() - 0.5) * a;
  }
  const upx = Math.sin(Cam.roll), upy = Math.cos(Cam.roll);
  M4.persp(MTX.proj, Cam.fov, View.asp, 0.22, 1400);
  M4.look(MTX.view, Cam.x + sx, Cam.y + sy, Cam.z, Cam.lx, Cam.ly + sy * 0.4, Cam.lz, upx, upy, 0);
  M4.mul(MTX.vp, MTX.proj, MTX.view);
  M4.invert(MTX.invVP, MTX.vp);

  /* ---- 天空 */
  gl.depthMask(false);
  gl.useProgram(SH_SKY.p);
  gl.uniformMatrix4fv(SH_SKY.u.uInvVP, false, MTX.invVP);
  gl.uniform3f(SH_SKY.u.uCam, Cam.x, Cam.y, Cam.z);
  gl.uniform3fv(SH_SKY.u.uSunDir, T.sun);
  gl.uniform3fv(SH_SKY.u.uZen, T.zen);
  gl.uniform3fv(SH_SKY.u.uHor, T.hor);
  gl.uniform3fv(SH_SKY.u.uFogCol, T.fog);
  gl.uniform3fv(SH_SKY.u.uSunCol, T.sunCol);
  gl.uniform3fv(SH_SKY.u.uPeak, T.peak);
  gl.uniform1f(SH_SKY.u.uTime, Race.time);
  gl.uniform1f(SH_SKY.u.uCloud, T.cloud);
  gl.uniform1f(SH_SKY.u.uHaze, T.haze);
  gl.bindVertexArray(skyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.depthMask(true);

  /* ---- 实体世界 */
  const P = SH_MAIN;
  gl.useProgram(P.p);
  gl.uniformMatrix4fv(P.u.uVP, false, MTX.vp);
  gl.uniformMatrix4fv(P.u.uLightVP, false, MTX.lightVP);
  gl.uniform3f(P.u.uCam, Cam.x, Cam.y, Cam.z);
  gl.uniform3fv(P.u.uSunDir, T.sun);
  gl.uniform3fv(P.u.uSunCol, T.sunCol);
  gl.uniform3fv(P.u.uSkyCol, T.skyAmb);
  gl.uniform3fv(P.u.uGndCol, T.gndAmb);
  gl.uniform3fv(P.u.uFogCol, T.fog);
  gl.uniform3f(P.u.uTint, 1, 1, 1);
  gl.uniform1f(P.u.uFogD, T.fogD);
  gl.uniform1f(P.u.uAlpha, 1);
  gl.uniform1f(P.u.uEmis, 0);
  gl.uniform1f(P.u.uSpec, 0);
  gl.uniform1f(P.u.uMat, 0);
  gl.uniform1f(P.u.uTime, Race.time);
  gl.uniform1f(P.u.uShadowOn, Shadow.on ? 1 : 0);
  gl.uniform1i(P.u.uShadow, 0);
  if (Shadow.tex) { gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, Shadow.tex); }
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  drawWorld(P, false);
  gl.disable(gl.BLEND);

  /* ---- 观众 */
  if (Quality.crowd && Track.crowd) {
    const C = SH_CROWD;
    gl.useProgram(C.p);
    gl.uniformMatrix4fv(C.u.uVP, false, MTX.vp);
    gl.uniform3f(C.u.uCam, Cam.x, Cam.y, Cam.z);
    gl.uniform3fv(C.u.uSunDir, T.sun);
    gl.uniform3fv(C.u.uSunCol, T.sunCol);
    gl.uniform3fv(C.u.uSkyCol, T.skyAmb);
    gl.uniform3fv(C.u.uGndCol, T.gndAmb);
    gl.uniform3fv(C.u.uFogCol, T.fog);
    gl.uniform1f(C.u.uFogD, T.fogD);
    gl.uniform1f(C.u.uTime, Race.time);
    gl.uniform1f(C.u.uHype, Race.hype);
    gl.bindVertexArray(Track.crowd.vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, Track.crowd.base.count, Track.crowd.n);
  }

  /* ---- 粒子：加色混合，不写深度 */
  if (Parts.length) {
    const rx = MTX.view[0], ry = MTX.view[4], rz = MTX.view[8];
    const ux2 = MTX.view[1], uy2 = MTX.view[5], uz2 = MTX.view[9];
    fillFX(rx, ry, rz, ux2, uy2, uz2);
    if (FX.n) {
      gl.useProgram(SH_FX.p);
      gl.uniformMatrix4fv(SH_FX.u.uVP, false, MTX.vp);
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.depthMask(false); gl.disable(gl.CULL_FACE);
      gl.bindVertexArray(FX.vao);
      gl.drawArrays(gl.TRIANGLES, 0, FX.n);
      gl.depthMask(true); gl.enable(gl.CULL_FACE); gl.disable(gl.BLEND);
    }
  }
  gl.bindVertexArray(null);
}

function drawMinimap() {
  const c = mapCtx, W = mapCv.width, H = mapCv.height;
  const pr = Track.mapProj, T = Track.theme;
  c.clearRect(0, 0, W, H);
  const mx = x => (x - pr.cx) / pr.span * W + W / 2;
  const my = z => (z - pr.cz) / pr.span * H + H / 2;

  c.beginPath();
  const N = Track.N, step = Math.max(1, Math.floor(N / 160));
  for (let i = 0; i <= N; i += step) {
    const n = Track.nodes[i % N];
    if (i === 0) c.moveTo(mx(n.x), my(n.z)); else c.lineTo(mx(n.x), my(n.z));
  }
  c.closePath();
  c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = W * 0.085; c.lineJoin = 'round'; c.stroke();
  c.strokeStyle = 'rgba(180,205,235,.55)'; c.lineWidth = W * 0.026; c.stroke();

  // 起跑线
  const s0 = Track.nodes[0];
  c.beginPath();
  c.moveTo(mx(s0.x + s0.rx * 8), my(s0.z + s0.rz * 8));
  c.lineTo(mx(s0.x - s0.rx * 8), my(s0.z - s0.rz * 8));
  c.strokeStyle = '#ffd24a'; c.lineWidth = W * 0.024; c.stroke();

  for (const k of Race.karts) {
    const me = k === Race.player;
    c.beginPath();
    c.arc(mx(k.x), my(k.z), W * (me ? 0.042 : 0.030), 0, TAU);
    c.fillStyle = me ? '#ff4d6a' : 'rgba(' + Math.round(k.colBody[0]*255) + ',' +
      Math.round(k.colBody[1]*255) + ',' + Math.round(k.colBody[2]*255) + ',.95)';
    c.fill();
    if (me) { c.strokeStyle = '#fff'; c.lineWidth = W * 0.014; c.stroke(); }
  }
}

function onPlayerLap() {

  const rows = k.lapTimes.map((t, i) => 'L' + (i + 1) + ' <b>' + fmtTime(t) + '</b>').slice(-3);
  el.innerHTML = rows.join('<br>');
  if (k.lap <= Track.laps) toast('第 ' + k.lap + ' 圈', k.lap === Track.laps ? 'good' : '');
  Race.hype = Math.min(1, Race.hype + 0.3);
}

function updateRanks() {
  const K = Race.karts;
  Race.order = K.slice().sort((a, b) => {
    if (a.finished && b.finished) return a.finishT - b.finishT;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.prog - a.prog;
  });
  for (let i = 0; i < Race.order.length; i++) Race.order[i].rank = i + 1;
}

function finishKart(k) {
  if (k.finished) return;
  k.finished = true; k.finishT = Race.time;
  updateRanks();
  k.finishRank = k.rank;
  if (k === Race.player) {
    SFX.finish();
    toast(k.rank + (ORD[k.rank-1]||'th'), k.rank <= 3 ? 'good' : '');
    Race.hype = 1;
    setTimeout(() => { if (Race.state === 'race') endRace(); }, 2600);
  }
}

const Keys = Object.create(null);
const Touch = { l: false, r: false, a: false, d: false, i: false };
let steerSmooth = 0;

window.addEventListener('keydown', e => {
  if (e.repeat) { e.preventDefault(); return; }
  Keys[e.code] = true;
  audioInit();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyR' && (Race.state === 'race' || Race.state === 'paused')) startRace();
  if (e.code === 'KeyM') { Audio_.muted = !Audio_.muted; toast(Audio_.muted ? '静音' : '有声'); }
  if (e.code === 'F3') $('fps').classList.toggle('on');
  if (e.code === 'F2') {                                // 桌面上强制显示手柄，方便调布局
    Race.forcePad = !Race.forcePad;
    padEl.classList.toggle('on', Race.forcePad && Race.state === 'race');
    if (Race.forcePad) padLayout(); else padApply([]);
    toast(Race.forcePad ? '显示触屏手柄' : '隐藏触屏手柄');
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','ShiftRight'].indexOf(e.code) >= 0)
    e.preventDefault();
});
window.addEventListener('keyup', e => { Keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in Keys) Keys[k] = false; });

/* 触屏按钮：不绑在各自的元素上，而是全局收所有触点、自己做命中判定。

   两个原因：
   1. 触摸事件永远归属于**按下时**那个元素，绑在元素上的话，手指从 ◀ 滑到 ▶
      不会切换，必须抬手重按 —— 开车的时候这非常难受。
   2. 每个触点只判给**最近的**那个按钮，所以判定范围可以放得比圆圈大一圈
      （按不准也算数），又不会出现两个方向键同时按下互相抵消。 */
const PADS = [
  { id: 'kL', prop: 'l' }, { id: 'kR', prop: 'r' },
  { id: 'kA', prop: 'a' }, { id: 'kD', prop: 'd' }, { id: 'kI', prop: 'i' },
];
for (const p of PADS) { p.el = $(p.id); p.cx = p.cy = p.r = 0; }

/* 缓存各按钮的圆心和半径。display:none 时量出来是 0，所以显示之后要再量一次。 */
function padLayout() {
  for (const p of PADS) {
    const b = p.el.getBoundingClientRect();
    if (!b.width) continue;
    p.cx = b.left + b.width / 2;
    p.cy = b.top + b.height / 2;
    p.r  = b.width / 2;
  }
}
/* 一个触点判给谁：最近的那个，且不能超出它半径的 1.35 倍 */
function padPick(x, y) {
  let best = null, bd = Infinity;
  for (const p of PADS) {
    if (!p.r) continue;
    const dx = x - p.cx, dy = y - p.cy;
    const d = Math.hypot(dx, dy);
    if (d > p.r * 1.35) continue;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
function padApply(points) {
  for (const p of PADS) p.on = false;
  for (const pt of points) { const hit = padPick(pt.x, pt.y); if (hit) hit.on = true; }
  for (const p of PADS) {
    if (Touch[p.prop] !== p.on) {
      Touch[p.prop] = p.on;
      p.el.classList.toggle('hit', p.on);
    }
  }
}
function onTouch(e) {
  if (!padEl.classList.contains('on')) return;
  audioInit();
  const pts = [];
  for (let i = 0; i < e.touches.length; i++)
    pts.push({ x: e.touches[i].clientX, y: e.touches[i].clientY });
  padApply(pts);
  if (pts.length) e.preventDefault();
}
for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel'])
  window.addEventListener(ev, onTouch, { passive: false });

/* 桌面上用鼠标也能试触屏布局（F2 开关） */
let mouseDown = false;
window.addEventListener('mousedown', e => {
  if (!padEl.classList.contains('on')) return;
  mouseDown = true; audioInit(); padApply([{ x: e.clientX, y: e.clientY }]);
});
window.addEventListener('mousemove', e => {
  if (mouseDown && padEl.classList.contains('on')) padApply([{ x: e.clientX, y: e.clientY }]);
});
window.addEventListener('mouseup', () => { mouseDown = false; padApply([]); });

let itemHeld = false;
function readInput(dt) {
  const k = Race.player, I = k.in;
  const th = Keys.ArrowUp || Keys.KeyW || Touch.a;
  const br = Keys.ArrowDown || Keys.KeyS;
  const lf = Keys.ArrowLeft || Keys.KeyA || Touch.l;
  const rt = Keys.ArrowRight || Keys.KeyD || Touch.r;
  const dr = Keys.Space || Keys.ShiftLeft || Keys.ShiftRight || Touch.d;
  const it = Keys.KeyE || Keys.KeyF || Keys.ControlLeft || Keys.ControlRight || Touch.i;

  /* 转向做一点上升沿平滑，键盘也能有模拟量的手感。

     符号注意：I.st 为正表示"让 head 增大"。这个世界里 forward=+Z、up=+Y、
     右手系，所以屏幕右边其实是 **−X**；而 head 增大是把朝向从 +Z 转向 +X，
     也就是往**屏幕左边**转。所以按右键要给负值。
     （AI 那边是拿 angDiff 直接算 I.st 的，本来就自洽，不用动。） */
  const want = (lf ? 1 : 0) - (rt ? 1 : 0);
  steerSmooth = approach(steerSmooth, want, want === 0 ? 16 : 9, dt);
  I.st = clamp(steerSmooth, -1, 1);
  I.stRaw = want;                          // 起漂用的是这个：按下就有，不等平滑

  const racing = Race.state === 'race';
  I.th = racing && th ? 1 : 0;
  I.br = racing && br ? 1 : 0;
  I.dr = racing && dr;
  if (it && !itemHeld && racing) useItem(k);
  itemHeld = it;

  /* 起步加速：倒计时最后半秒踩油门，起跑给一记涡轮；踩太早会憋火 */
  if (Race.state === 'countdown') {
    if (th && Race.startPress < 0) Race.startPress = Race.countdown;
    I.th = 0; I.br = 0;
  }
}

  else if (a === 'diff') { Race.diff = i; showTitle(); }
  else if (a === 'char') { Race.charIdx = i; showTitle(); }
  else if (a === 'qual') { Race.qual = i; applyQuality(i); showTitle(); }
  else if (a === 'start' || a === 'again') { hideSheet(); startRace(); }
  else if (a === 'resume') togglePause();
  else if (a === 'menu') showTitle();
});

/* ==========================================================================
   23. 发车
   ========================================================================== */
function startRace() {
  const def = TRACKS[Race.trackIdx];
  if (!Track.def || Track.def !== def) {
    buildTrack(def);
    buildTrackGeometry();
  } else {
    Track.rng = mulberry(def.seed);
    layoutTrackFeatures();
  }
  for (const sp of Track.itemSpots) sp.taken = 0;

  /* ---- 造车。玩家发在最后一排 —— 道具的名次权重就是为这个设计的。 */
  Race.karts = [];
  Race.items = [];
  Parts.length = 0;
  const order = [];
  for (let i = 0; i < 8; i++) if (i !== Race.charIdx) order.push(i);
  order.push(Race.charIdx);

  for (let g = 0; g < 8; g++) {
    const idx = order[g];
    const k = makeKart(idx, idx !== Race.charIdx);
    if (!KART_MESH[idx]) KART_MESH[idx] = buildKartBody(DRIVERS[idx]);
    k.body = KART_MESH[idx];
    const grid = Track.startGrid[g];
    const p = worldAt(grid.s, grid.lat);
    const a = atS(grid.s);
    k.x = p[0]; k.y = p[1]; k.z = p[2];
    k.head = a.head; k.yaw = a.head;
    const loc = locate(k.x, k.z, a.i);
    k.node = loc.i; k.s = loc.s; k.prevS = loc.s; k.lat = loc.lat;
    k.lap = 0; k.prog = loc.s - Track.L;
    k.ai_line = (Math.random() - 0.5) * 1.6;
    k.ai_itemT = 1.5 + Math.random() * 2;
    k.rank = g + 1;
    if (!k.ai) Race.player = k;
    Race.karts.push(k);
  }
  updateRanks();

  Race.state = 'countdown';
  Race.countdown = 3.6;
  Race.time = 0;
  Race.startPress = -1;
  Race.hype = 0.25;
  Race.flash = 0;
  Music.key = [0, 3, 7][Race.trackIdx] || 0;
  Music.step = 0; Music.t = 0; Music.on = true;

  lastPos = 0; toastT = 0; hudItem = null;
  $('itemIco').innerHTML = ''; $('itemQty').classList.remove('on');
  $('splits').innerHTML = '';
  hudEl.classList.add('on');
  if (IS_TOUCH || Race.forcePad) { padEl.classList.add('on'); padLayout(); }
  Cam.shake = 0;
  updateCamera(0.016, true);
  countStep = 4;
}
const KART_MESH = {};

let countStep = 4;
function tickCountdown(dt) {
  Race.countdown -= dt;
  const n = Math.ceil(Race.countdown - 0.6);
  const el = $('count');
  if (n !== countStep) {
    countStep = n;
    if (n >= 1 && n <= 3) { el.textContent = String(n); el.className = ''; el.style.opacity = '1'; SFX.count(n); }
    else if (n <= 0) { el.textContent = 'GO'; el.className = 'go'; el.style.opacity = '1'; SFX.count(0); }
  }
  if (Race.countdown <= 0) {
    Race.state = 'race';
    el.style.opacity = '0';
    /* 起步加速：最后 0.55 秒内踩下去给涡轮，踩太早憋火 */
    const p = Race.startPress;
    if (p > 0 && p < 0.55) {
      Race.player.boostT = 1.1; Race.player.boostPow = 1.30; Race.player.boostTier = 1;
      SFX.turbo(1); toast('起步加速', 'good');
      emitBurst(Race.player, MT[1].col, 24);
    } else if (p > 1.2) {
      Race.player.speed = 0; Race.player.spin = 0.55; toast('憋火了', 'warn');
    }
    /* 人机也来一发，强度按难度 */
    for (const k of Race.karts) if (k.ai && Math.random() < 0.3 + Race.diff * 0.22) {
      k.boostT = 1.0; k.boostPow = 1.26; k.boostTier = 0;
    }
  }
}

function endRace() {
  /* 没跑完的按当前进度排完 */
  for (const k of Race.karts) if (!k.finished) {
    k.finished = true;
    k.finishT = Race.time + 60 - k.prog * 1e-4;      // 靠进度分出先后，不然全撞成同一个时间
  }
  updateRanks();
  showResults();
}

/* ==========================================================================
   24. 主循环
   ========================================================================== */
const FIXED = 1 / 100;
let acc = 0, lastT = 0, fpsAcc = 0, fpsN = 0;

function step(dt) {
  if (Race.state === 'race') Race.time += dt;
  readInput(dt);
  const held = Race.state === 'countdown';
  for (const k of Race.karts) {
    if (k.ai) updateAI(k, dt);
    if (held) { k.in.th = 0; k.in.br = 0; k.in.st = 0; k.in.dr = false; }
    updateKart(k, dt);
  }
  kartCollisions(dt);
  updateItems(dt);
  updateRanks();
  for (const k of Race.karts) if (!k.finished && k.lap > Track.laps) finishKart(k);
  updateParts(dt);
  Race.hype = Math.max(0, Race.hype - dt * 0.12);
  if (Audio_.crowdGain) {
    const near = Race.player ? clamp(1 - Math.abs(Race.player.lat) / 40, 0, 1) : 0;
    Audio_.crowdGain.gain.setTargetAtTime(
      (Audio_.muted || Race.state === 'title') ? 0 : 0.012 + Race.hype * 0.03, actx().currentTime, 0.4);
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  resize();
  const dtRaw = lastT ? (now - lastT) / 1000 : 0.016;
  lastT = now;
  const dt = clamp(dtRaw, 0, 0.25);

  if (Race.state === 'countdown') tickCountdown(dt);

  if (Race.state === 'race' || Race.state === 'countdown') {
    acc += dt;
    let n = 0;
    while (acc >= FIXED && n < 8) { step(FIXED); acc -= FIXED; n++; }
    if (n === 8) acc = 0;
    updateCamera(dt, false);
    updateHUD(dt);
    musicTick(dt);
  } else if (Race.state === 'paused') {
    // 停住，但还画
  } else if (Race.state === 'title' && Race.karts.length) {
    Race.time += dt;
    updateParts(dt);
  }
  updateEngine(dt);

  if (Race.karts.length) render(dt);

  /* 屏幕闪白：闪电、被打中 */
  if (Race.flash > 0.001) {
    Race.flash = Math.max(0, Race.flash - dt * 2.2);
    flashEl.style.opacity = (Race.flash * 0.55).toFixed(3);
  } else if (flashEl.style.opacity !== '0') flashEl.style.opacity = '0';

  fpsAcc += dtRaw; fpsN++;
  if (fpsAcc >= 0.5) { $('fps').textContent = Math.round(fpsN / fpsAcc) + ' fps'; fpsAcc = 0; fpsN = 0; }
}

/* ==========================================================================
   25. 启动
   ========================================================================== */
function boot() {
  loadBest();
  Race.qual = IS_TOUCH ? 1 : 0;
  Object.assign(Quality, QUALITY[Race.qual]);
  resize();
  if (Quality.shadow) initShadow(Quality.shadowSize);
  buildItemModels();
  MODELS.wheelF = buildWheel(WR_F, 0.115);
  MODELS.wheelR = buildWheel(WR_R, 0.145);
  gl.clearColor(0.03, 0.04, 0.06, 1);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  showTitle();
  requestAnimationFrame(frame);
}
boot();
</script>
