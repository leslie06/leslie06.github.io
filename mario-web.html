<title>超级酷跑兄弟</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap">
<style>
  /* 街机机身：单一深色世界，所有颜色显式声明，不依赖宿主主题 */
  :root{
    --ground:#0b0d18; --panel:#141829; --screen:#05060c;
    --sky:#5c94fc; --coin:#ffdb4d; --brick:#c85a28;
    --text:#e8ebf7; --muted:#7d84ad; --dim:#5f668c;
    --line:rgba(124,132,173,.22);
    --arcade:"Press Start 2P","Courier New",monospace;
    --han:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
    --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{background:var(--ground);color:var(--text);font-family:var(--ui);
    overflow:hidden;touch-action:none;overscroll-behavior:none;
    display:flex;align-items:center;justify-content:center;}

  #cab{width:100%;height:100%;padding:16px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;}

  #bar{width:min(1080px,100%);display:flex;align-items:baseline;
    justify-content:space-between;gap:20px;}
  #bar .mark{margin:0;font-family:var(--han);font-weight:400;
    font-size:clamp(21px,3vw,30px);letter-spacing:2px;
    color:var(--coin);text-shadow:3px 3px 0 var(--brick);}
  #bar .eyebrow{margin:0;font-family:var(--arcade);font-size:9px;line-height:1.9;
    letter-spacing:1.4px;color:var(--muted);text-align:right;}
  #bar .eyebrow i{font-style:normal;color:var(--sky);}

  #wrap{position:relative;padding:12px;background:var(--screen);border-radius:12px;
    box-shadow:inset 0 0 0 2px rgba(92,148,252,.22),
               inset 0 0 44px rgba(92,148,252,.10),
               0 26px 70px rgba(0,0,0,.75);}
  #wrap::after{content:"";position:absolute;inset:12px;border-radius:3px;pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      rgba(3,5,12,.17) 0 1px, rgba(3,5,12,0) 1px 3px);}
  canvas{display:block;background:var(--sky);border-radius:3px;image-rendering:pixelated;}

  #legend{width:min(1080px,100%);display:flex;flex-wrap:wrap;justify-content:center;
    align-items:center;gap:9px 22px;color:var(--muted);font-size:13px;}
  #legend .grp{display:inline-flex;align-items:center;gap:7px;}
  #legend .cap{font-family:var(--arcade);font-size:9px;font-weight:400;line-height:1;
    color:#cfd6f5;background:var(--panel);border:1px solid var(--line);
    border-bottom-width:3px;border-radius:5px;padding:6px 8px;}
  #legend .hint{color:var(--dim);}

  #rotate,#pad,#pausebtn{display:none;}
  #pad{position:fixed;left:0;right:0;bottom:0;
    padding:0 20px calc(14px + env(safe-area-inset-bottom));
    justify-content:space-between;align-items:flex-end;
    user-select:none;-webkit-user-select:none;pointer-events:none;z-index:5;}
  #pad .g{display:flex;gap:14px;align-items:flex-end;}
  #pad b,#pausebtn{border-radius:50%;background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.34);color:#fff;font-weight:bold;
    align-items:center;justify-content:center;}
  #pad b{width:74px;height:74px;display:flex;font-size:24px;}
  #pad b.big{width:92px;height:92px;font-size:30px;}
  #pad b.on{background:rgba(255,255,255,.44);transform:scale(.94);}
  #pausebtn{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;
    width:46px;height:46px;font-size:15px;letter-spacing:1px;z-index:6;}

  @media (max-width:430px){
    #pad{padding-left:12px;padding-right:12px;}
    #pad .g{gap:10px;}
    #pad b{width:66px;height:66px;font-size:22px;}
    #pad b.big{width:82px;height:82px;font-size:26px;}
  }
  @media (pointer:coarse){
    #bar,#legend{display:none;}
    #pad{display:flex;}
    #pausebtn{display:flex;}
    #cab{padding:0;gap:0;}
    #wrap{padding:0;border-radius:0;box-shadow:none;}
    #wrap::after{inset:0;border-radius:0;}
    canvas{border-radius:0;}
  }
  @media (pointer:coarse) and (orientation:portrait){
    #cab{justify-content:flex-start;padding-top:14vh;}
    #rotate{display:block;margin:18px 0 0;font-size:13px;color:var(--dim);letter-spacing:1px;}
  }
  @media (pointer:coarse) and (orientation:landscape){
    #pad{padding-bottom:calc(6px + env(safe-area-inset-bottom));}
    #pad b{opacity:.82;}
  }
</style>

<div id="cab">
  <header id="bar">
    <h1 class="mark">超级酷跑兄弟</h1>
    <p class="eyebrow">SUPER RUNNER BROS<br><i>3 STAGES</i> &middot; 8-BIT PLATFORMER</p>
  </header>
  <div id="wrap"><canvas id="game" width="800" height="480"></canvas></div>
  <p id="rotate">↻ 横屏可获得更大画面</p>
  <footer id="legend">
    <span class="grp"><b class="cap">&larr;</b><b class="cap">&rarr;</b>移动</span>
    <span class="grp"><b class="cap">SPACE</b>跳跃 · 长按更高</span>
    <span class="grp"><b class="cap">SHIFT</b>加速 · 火球</span>
    <span class="grp"><b class="cap">P</b>暂停</span>
    <span class="grp"><b class="cap">R</b>重来</span>
    <span class="grp hint">先点一下画面，键盘才会生效</span>
  </footer>
</div>
<div id="pad">
  <div class="g"><b data-k="left">&#9664;</b><b data-k="right">&#9654;</b></div>
  <div class="g"><b data-k="run">B</b><b data-k="jump" class="big">A</b></div>
</div>
<b id="pausebtn">II</b>

<script>
(function(){
"use strict";

/* ======================= 基础常量 ======================= */
const TILE = 32, ROWS = 15, VIEW_W = 800, VIEW_H = 480;
const GRAVITY = 0.78, MAX_FALL = 15;
const WALK_ACC = 0.55, RUN_ACC = 0.85;
const MAX_WALK = 4.2, MAX_RUN = 6.6;
const GROUND_FRICTION = 0.78, AIR_DRAG = 0.96;
const JUMP_V = -13.6, HOLD_GRAVITY = 0.33, RELEASE_GRAVITY = 1.25;
const JUMP_BUFFER = 9, COYOTE_TIME = 6;   // 跳跃缓冲 150ms / 土狼时间 100ms

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ======================= 输入 ======================= */
const keys = {};
const latch = { jump:0, run:0 };            // 按下即记账，避免极短点按被丢帧
function latchPress(k){ if (k === 'jump' || k === 'run') latch[k] = JUMP_BUFFER; }
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyK:'jump',
  ShiftLeft:'run', ShiftRight:'run', KeyJ:'run',
  ArrowDown:'down', KeyS:'down'
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { if (!keys[k]) latchPress(k); keys[k] = true; e.preventDefault(); }
  if (e.code === 'KeyP') togglePause();
  if (e.code === 'KeyR') startGame();
  if (e.code === 'Enter' || e.code === 'Space') {
    if (game.state === 'title' || game.state === 'gameover' || game.state === 'win') startGame();
  }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
/* --- 触屏：对所有活动手指做命中测试，支持多指同按与滑动切换 --- */
const padBtns = Array.prototype.slice.call(document.querySelectorAll('#pad b'));
const pauseBtn = document.getElementById('pausebtn');
let audioReady = false;
function unlockAudio(){ const a = audio(); if (a && a.state === 'suspended') a.resume(); audioReady = true; }
function visible(el){ return el.getBoundingClientRect().width > 0; }
function hit(t, el, slop){
  const r = el.getBoundingClientRect();
  if (!r.width) return false;
  return t.clientX >= r.left - slop && t.clientX <= r.right + slop &&
         t.clientY >= r.top - slop && t.clientY <= r.bottom + slop;
}
function syncTouches(e){
  const active = {};
  for (let i = 0; i < e.touches.length; i++){
    const t = e.touches[i];
    for (const b of padBtns) if (hit(t, b, 10)) active[b.dataset.k] = true;
  }
  for (const b of padBtns){
    const k = b.dataset.k, on = !!active[k];
    if (on && !keys[k]) latchPress(k);
    keys[k] = on;
    b.classList.toggle('on', on);
  }
}
document.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!audioReady) unlockAudio();
  for (let i = 0; i < e.changedTouches.length; i++){
    if (visible(pauseBtn) && hit(e.changedTouches[i], pauseBtn, 6)){ togglePause(); return; }
  }
  if (game.state === 'title' || game.state === 'gameover' || game.state === 'win') startGame();
  syncTouches(e);
}, {passive:false});
['touchmove','touchend','touchcancel'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); syncTouches(e); }, {passive:false}));
addEventListener('keydown', unlockAudio, {once:true});
canvas.addEventListener('mousedown', () => {          // iframe 内需先聚焦才能收到键盘事件
  try { window.focus(); } catch (err) {}
  unlockAudio();
  if (game.state === 'title' || game.state === 'gameover' || game.state === 'win') startGame();
});

/* ======================= 音效（WebAudio 合成） ======================= */
let actx = null;
function audio(){ if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return actx; }
function beep(f0, f1, dur, type, vol){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f0, a.currentTime);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.06, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
const SFX = {
  jump:   () => beep(360, 760, .16, 'square', .05),
  coin:   () => { beep(988, 988, .07, 'square', .05); setTimeout(()=>beep(1319,1319,.16,'square',.05), 70); },
  stomp:  () => beep(200, 70, .12, 'square', .06),
  bump:   () => beep(160, 90, .07, 'square', .05),
  brick:  () => beep(300, 60, .14, 'sawtooth', .05),
  power:  () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,f,.1,'square',.05), i*70)); },
  fire:   () => beep(700, 260, .09, 'sawtooth', .04),
  hurt:   () => beep(400, 120, .3, 'sawtooth', .06),
  die:    () => { [523,392,262,196].forEach((f,i)=>setTimeout(()=>beep(f,f,.18,'square',.06), i*130)); },
  clear:  () => { [392,523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,f,.14,'square',.055), i*120)); },
  kick:   () => beep(520, 180, .1, 'square', .05)
};

/* ======================= 关卡构建工具 ======================= */
function newGrid(w){ const g = []; for (let r=0;r<ROWS;r++) g.push(new Array(w).fill('.')); return g; }
function put(g,c,r,ch){ if (r>=0 && r<ROWS && c>=0 && c<g[0].length) g[r][c] = ch; }
function fill(g,c0,r0,c1,r1,ch){ for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++) put(g,c,r,ch); }
function row(g,r,c0,s){ for (let i=0;i<s.length;i++) if (s[i] !== ' ') put(g,c0+i,r,s[i]); }
function ground(g,c0,c1){ fill(g,c0,13,c1,14,'#'); }
function pipe(g,c,h){ fill(g,c,13-h,c+1,12,'P'); }
function ascend(g,c0,h){ for (let i=0;i<h;i++) fill(g,c0+i,12-i,c0+i,12,'='); }
function descend(g,c0,h){ for (let i=0;i<h;i++) fill(g,c0+i,12-(h-1-i),c0+i,12,'='); }

/* 图块含义:
   #=地面 ==硬石 B=砖块 ?=问号(金币) M=问号(道具) U=已用 P=水管 T=单向平台 F=旗杆
   c=金币 g=蘑菇怪 k=乌龟 H=横向移动平台 V=纵向移动平台                                  */
const LEVELS = [
  function(){                                   /* ---- 1-1 平原 ---- */
    const W = 200, g = newGrid(W);
    ground(g,0,68); ground(g,72,108); ground(g,112,W-1);
    put(g,16,9,'?');
    row(g,9,20,'B?B?B');
    row(g,5,20,'BBMBB');
    pipe(g,32,2); pipe(g,42,3); pipe(g,52,4); pipe(g,62,4);
    [25,38,48,58].forEach(c => put(g,c,12,'g'));
    row(g,8,69,'ccc');
    [78,86].forEach(c => put(g,c,12,'g')); put(g,96,12,'k');
    row(g,9,88,'B?BB?');
    fill(g,98,7,103,7,'T'); row(g,6,98,'cccccc');
    row(g,8,109,'ccc');
    row(g,9,116,'?BB?');
    [120,128,158,162].forEach(c => put(g,c,12,'g')); put(g,136,12,'k');
    pipe(g,142,3);
    fill(g,148,8,153,8,'T'); row(g,7,148,'cccccc');
    ascend(g,168,4); descend(g,173,4);
    pipe(g,180,2);
    fill(g,188,3,188,12,'F');
    return { g, name:'1-1', flagC:188, time:400, sky:['#5c94fc','#9fd2ff'] };
  },
  function(){                                   /* ---- 1-2 空中要塞 ---- */
    const W = 220, g = newGrid(W);
    ground(g,0,40); ground(g,46,74); ground(g,80,120); ground(g,126,150); ground(g,158,W-1);
    row(g,9,12,'?BM B?');
    [18,30,52,64].forEach(c => put(g,c,12,'g'));
    put(g,26,12,'k'); put(g,70,12,'k');
    pipe(g,22,3); pipe(g,36,4);
    fill(g,41,9,45,9,'T'); row(g,8,41,'ccccc');
    fill(g,56,7,61,7,'T'); row(g,6,56,'cccccc');
    row(g,5,66,'BB?BB');
    put(g,76,8,'H');
    fill(g,84,6,88,6,'T'); row(g,5,84,'ccccc');
    row(g,9,92,'?BBB?');
    [96,104,112].forEach(c => put(g,c,12,'g'));
    put(g,100,12,'k'); put(g,116,12,'k');
    fill(g,106,7,110,7,'T');
    put(g,122,9,'H');
    pipe(g,130,4); pipe(g,140,5);
    put(g,134,12,'g'); put(g,146,12,'k');
    put(g,153,8,'H');
    row(g,9,160,'BM?B');
    [166,174,182].forEach(c => put(g,c,12,'g'));
    fill(g,170,7,175,7,'T'); row(g,6,170,'cccccc');
    ascend(g,190,5); descend(g,196,5);
    fill(g,208,3,208,12,'F');
    return { g, name:'1-2', flagC:208, time:400, sky:['#2f6bd8','#7fb4ff'] };
  },
  function(){                                   /* ---- 1-3 熔岩城堡 ---- */
    const W = 240, g = newGrid(W);
    ground(g,0,28); ground(g,34,54); ground(g,62,84); ground(g,92,104);
    ground(g,114,140); ground(g,148,168); ground(g,178,W-1);
    row(g,9,10,'?BMB?');
    [14,22,44,50].forEach(c => put(g,c,12,'g'));
    put(g,26,12,'k');
    put(g,30,9,'H');
    fill(g,36,7,40,7,'T'); row(g,6,36,'ccccc');
    pipe(g,46,4);
    put(g,57,7,'V');
    [66,74,80].forEach(c => put(g,c,12,'k'));
    row(g,5,68,'BB?BB'); row(g,9,70,'BBB');
    put(g,87,8,'H');
    fill(g,94,6,99,6,'T'); row(g,5,94,'cccccc');
    put(g,96,12,'g'); put(g,102,12,'g');
    put(g,108,9,'V');
    row(g,9,116,'?B?B?');
    [120,128,134].forEach(c => put(g,c,12,'g'));
    put(g,124,12,'k'); put(g,138,12,'k');
    fill(g,130,6,135,6,'T');
    put(g,144,8,'H');
    pipe(g,152,5); pipe(g,162,3);
    put(g,156,12,'g'); put(g,166,12,'k');
    put(g,172,7,'V');
    row(g,9,182,'BM?B');
    [188,196,204,210].forEach(c => put(g,c,12,'g'));
    put(g,192,12,'k'); put(g,200,12,'k');
    fill(g,192,6,198,6,'T'); row(g,5,192,'ccccccc');
    ascend(g,214,6); descend(g,221,6);
    fill(g,232,3,232,12,'F');
    return { g, name:'1-3', flagC:232, time:400, sky:['#7a2d5a','#ff9a6b'] };
  }
];

/* ======================= 全局状态 ======================= */
const game = { state:'title', score:0, coins:0, lives:3, level:0, time:400, tick:0, paused:false, msgT:0, msg:'' };
let level = null, player = null, ents = [], parts = [], bumps = [], deco = [], cam = { x:0 };

const SOLID = '#=B?MUP', ONEWAY = 'T';
function isSolid(ch){ return SOLID.indexOf(ch) >= 0; }
function tileAt(c,r){
  if (c < 0) return '#';
  if (r < 0 || r >= ROWS || c >= level.w) return '.';
  return level.grid[r][c];
}
function setTile(c,r,ch){ if (r>=0 && r<ROWS && c>=0 && c<level.w) level.grid[r][c] = ch; }

/* ======================= 加载关卡 ======================= */
function loadLevel(i, keepPower){
  const def = LEVELS[i]();
  const power = keepPower && player ? player.power : 0;
  level = { grid:def.g, w:def.g[0].length, name:def.name, flagC:def.flagC, sky:def.sky };
  ents = []; parts = []; bumps = []; cam.x = 0;
  game.time = def.time; game.tick = 0;

  for (let r=0;r<ROWS;r++) for (let c=0;c<level.w;c++){
    const ch = level.grid[r][c];
    if (ch === 'g') { ents.push(makeGoomba(c*TILE, r*TILE)); setTile(c,r,'.'); }
    else if (ch === 'k') { ents.push(makeKoopa(c*TILE, r*TILE - 12)); setTile(c,r,'.'); }
    else if (ch === 'c') { ents.push(makeCoin(c*TILE, r*TILE)); setTile(c,r,'.'); }
    else if (ch === 'H') { ents.push(makePlatform(c*TILE, r*TILE, 'x')); setTile(c,r,'.'); }
    else if (ch === 'V') { ents.push(makePlatform(c*TILE, r*TILE, 'y')); setTile(c,r,'.'); }
  }
  player = makePlayer(2*TILE, 11*TILE, power);
  buildDeco();
}

function buildDeco(){
  deco = [];
  let seed = level.w * 7919 + level.name.charCodeAt(2) * 31;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let x=0; x<level.w*TILE; x+=180 + rnd()*220) deco.push({ t:'cloud', x, y:40 + rnd()*110, s:.7 + rnd()*.8 });
  for (let x=0; x<level.w*TILE; x+=260 + rnd()*260) deco.push({ t:'hill',  x, y:13*TILE, s:.8 + rnd()*.9 });
  for (let x=0; x<level.w*TILE; x+=150 + rnd()*230) deco.push({ t:'bush',  x, y:13*TILE, s:.7 + rnd()*.7 });
}

/* ======================= 实体工厂 ======================= */
function makePlayer(x, y, power){
  return { type:'player', x, y, w:22, h:power?52:28, vx:0, vy:0, face:1,
           onGround:false, power:power||0, inv:0, star:0, dead:false, deadT:0, coyote:0,
           crouch:false, jumpHeld:false, animT:0, winT:0 };
}
function makeGoomba(x,y){ return { type:'goomba', x, y:y+4, w:26, h:28, vx:-1.2, vy:0, onGround:false, squash:0, dead:false }; }
function makeKoopa(x,y){  return { type:'koopa',  x, y:y+4, w:26, h:40, vx:-1.0, vy:0, onGround:false, dead:false, anim:0 }; }
function makeShell(x,y){  return { type:'shell',  x, y, w:26, h:26, vx:0, vy:0, onGround:false, dead:false, wake:0 }; }
function makeCoin(x,y){   return { type:'coin',   x:x+8, y:y+6, w:16, h:20, t:0, dead:false }; }
function makeMushroom(x,y){ return { type:'mushroom', x, y, w:26, h:26, vx:1.8, vy:-2, onGround:false, dead:false, rise:16 }; }
function makeFlower(x,y){ return { type:'flower', x, y, w:26, h:26, vx:0, vy:0, dead:false, rise:16, t:0 }; }
function makeFireball(x,y,dir){ return { type:'fireball', x, y, w:12, h:12, vx:8*dir, vy:2, life:150, dead:false, t:0 }; }
function makePop(x,y){ return { type:'pop', x, y, w:16, h:20, vy:-9, life:32, dead:false }; }
function makePlatform(x,y,axis){
  return { type:'platform', x, y, w:96, h:16, axis, ox:x, oy:y,
           range:axis === 'x' ? 128 : 112, spd:axis === 'x' ? 1.5 : 1.3, dir:1, dx:0, dy:0 };
}
function particle(x,y,vx,vy,color,life,size){ parts.push({ x, y, vx, vy, color, life, size:size||6 }); }

/* ======================= 物理与碰撞 ======================= */
function collideX(e){
  const c0 = Math.floor(e.x/TILE), c1 = Math.floor((e.x+e.w-1)/TILE);
  const r0 = Math.floor(e.y/TILE), r1 = Math.floor((e.y+e.h-1)/TILE);
  for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++){
    if (isSolid(tileAt(c,r))){
      if (e.vx > 0) e.x = c*TILE - e.w; else if (e.vx < 0) e.x = (c+1)*TILE;
      e.vx = 0; e.hitWall = true; return;
    }
  }
}
function collideY(e, prevBottom, isPlayer){
  e.onGround = false;
  const c0 = Math.floor(e.x/TILE), c1 = Math.floor((e.x+e.w-1)/TILE);
  if (e.vy >= 0){
    // 落地判定必须用真实底边：重力每帧只让实体下沉不到 1px，
    // 若沿用 (y+h-1) 取行，这点重叠会被算回上一行，onGround 就会逐帧闪烁
    const rb = Math.floor((e.y + e.h) / TILE);
    for (let c=c0;c<=c1;c++){
      const ch = tileAt(c, rb);
      if (isSolid(ch) || (ch === ONEWAY && prevBottom <= rb*TILE + 4)){
        e.y = rb*TILE - e.h; e.vy = 0; e.onGround = true; return;
      }
    }
    return;
  }
  const r0 = Math.floor(e.y/TILE), r1 = Math.floor((e.y+e.h-1)/TILE);
  for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++){
    if (isSolid(tileAt(c, r))){
      e.y = (r+1)*TILE; e.vy = 0; if (isPlayer) bumpBlock(c, r); return;
    }
  }
}
function physics(e, isPlayer){
  e.hitWall = false;
  e.x += e.vx; collideX(e);
  const prevBottom = e.y + e.h;
  e.vy = Math.min(e.vy + GRAVITY, MAX_FALL);
  e.y += e.vy; collideY(e, prevBottom, isPlayer);
  // 移动平台（只在顶部承载）
  for (const p of ents){
    if (p.type !== 'platform') continue;
    if (e.vy >= 0 && e.x + e.w > p.x + 2 && e.x < p.x + p.w - 2){
      const top = p.y;
      if (prevBottom <= top + 6 && e.y + e.h >= top && e.y + e.h <= top + 20){
        e.y = top - e.h; e.vy = 0; e.onGround = true; e.x += p.dx;
      }
    }
  }
}
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

/* ======================= 顶砖块 ======================= */
function bumpBlock(c, r){
  const ch = tileAt(c,r);
  if (ch === '?' || ch === 'M'){
    setTile(c, r, 'U');
    bumps.push({ c, r, t:0 });
    if (ch === '?'){ ents.push(makePop(c*TILE + 8, r*TILE - 12)); addScore(200); game.coins++; SFX.coin(); }
    else {
      if (player.power === 0) ents.push(makeMushroom(c*TILE + 3, r*TILE - 26));
      else ents.push(makeFlower(c*TILE + 3, r*TILE - 26));
      SFX.bump();
    }
  } else if (ch === 'B'){
    if (player.power > 0){
      setTile(c, r, '.'); SFX.brick(); addScore(50);
      for (let i=0;i<8;i++) particle(c*TILE+16, r*TILE+16, (Math.random()-.5)*7, -Math.random()*8-2, '#c0592b', 45, 7);
    } else { bumps.push({ c, r, t:0 }); SFX.bump(); }
  } else if (isSolid(ch)) { bumps.push({ c, r, t:0 }); SFX.bump(); }
}

/* ======================= 玩家更新 ======================= */
function addScore(n){ game.score += n; }

function updatePlayer(){
  const p = player;
  if (p.dead){
    p.deadT++;
    if (p.deadT > 24){ p.vy = Math.min(p.vy + 0.7, 14); p.y += p.vy; }
    if (p.deadT > 150) loseLife();
    return;
  }
  if (game.state === 'levelclear'){                      // 通关：滑杆 + 走向城堡
    p.winT++;
    if (p.y + p.h < 12*TILE){ p.y += 3.4; p.vx = 0; }
    else { p.face = 1; p.vx = 2.4; p.x += p.vx; }
    p.animT += 0.35;
    if (p.winT > 170){
      if (game.level + 1 < LEVELS.length){ game.level++; loadLevel(game.level, true); game.state = 'play'; flash('第 ' + level.name + ' 关'); }
      else { game.state = 'win'; }
    }
    return;
  }

  const run = keys.run;
  const acc = run ? RUN_ACC : WALK_ACC;
  const maxv = run ? MAX_RUN : MAX_WALK;
  p.crouch = p.power > 0 && keys.down && p.onGround;

  if (keys.left && !p.crouch){ p.vx -= acc; p.face = -1; }
  else if (keys.right && !p.crouch){ p.vx += acc; p.face = 1; }
  else p.vx *= p.onGround ? GROUND_FRICTION : AIR_DRAG;
  p.vx = Math.max(-maxv, Math.min(maxv, p.vx));
  if (Math.abs(p.vx) < 0.08) p.vx = 0;

  if (p.onGround) p.coyote = COYOTE_TIME; else if (p.coyote > 0) p.coyote--;
  if (latch.jump > 0 && (p.onGround || p.coyote > 0)){
    p.vy = JUMP_V - Math.abs(p.vx) * 0.28;
    p.jumpHeld = true; p.coyote = 0; latch.jump = 0; SFX.jump();
  }
  if (!keys.jump) p.jumpHeld = false;

  const prevBottom = p.y + p.h;
  p.hitWall = false;
  p.x += p.vx; collideX(p);
  const g = p.vy < 0 ? (p.jumpHeld ? HOLD_GRAVITY : RELEASE_GRAVITY) : GRAVITY;
  p.vy = Math.min(p.vy + g, MAX_FALL);
  p.y += p.vy; collideY(p, prevBottom, true);
  for (const pl of ents){
    if (pl.type !== 'platform') continue;
    if (p.vy >= 0 && p.x + p.w > pl.x + 2 && p.x < pl.x + pl.w - 2){
      const top = pl.y;
      if (prevBottom <= top + 6 && p.y + p.h >= top && p.y + p.h <= top + 20){
        p.y = top - p.h; p.vy = 0; p.onGround = true; p.x += pl.dx;
      }
    }
  }
  if (p.x < 0){ p.x = 0; p.vx = 0; }
  if (p.onGround && Math.abs(p.vx) > 0.2) p.animT += Math.abs(p.vx) * 0.09; else if (p.onGround) p.animT = 0;

  if (p.inv > 0) p.inv--;
  if (latch.run > 0 && p.power === 2 && ents.filter(e => e.type === 'fireball').length < 2){
    ents.push(makeFireball(p.x + (p.face > 0 ? p.w : -12), p.y + 14, p.face));
    latch.run = 0; SFX.fire();
  }
  if (p.y > VIEW_H + 200 && !p.dead) killPlayer(true);
  if (p.x + p.w > level.flagC * TILE + 10 && game.state === 'play'){
    game.state = 'levelclear'; p.winT = 0; p.vx = 0; p.vy = 0;
    p.x = level.flagC * TILE - 6; addScore(2000 + Math.ceil(game.time) * 10); SFX.clear();
  }
}

function grow(power){
  const p = player;
  if (power === 2){ p.power = 2; }
  else if (p.power === 0){ p.power = 1; const nh = 52; p.y -= (nh - p.h); p.h = nh; }
  else addScore(1000);
  if (p.power > 0 && p.h < 52){ p.y -= (52 - p.h); p.h = 52; }
  p.inv = Math.max(p.inv, 40); SFX.power(); addScore(1000);
}
function hurtPlayer(){
  const p = player;
  if (p.inv > 0 || p.dead) return;
  if (p.power > 0){
    p.power = 0; const nh = 28; p.y += (p.h - nh); p.h = nh; p.inv = 110; SFX.hurt();
  } else killPlayer(false);
}
function killPlayer(fell){
  const p = player;
  p.dead = true; p.deadT = 0; p.vy = fell ? 6 : -12; p.vx = 0; SFX.die();
}
function loseLife(){
  game.lives--;
  if (game.lives < 0) { game.state = 'gameover'; return; }
  loadLevel(game.level, false);
  game.state = 'play'; flash('剩余生命 ' + game.lives);
}
function flash(msg){ game.msg = msg; game.msgT = 110; }

/* ======================= 敌人 / 道具更新 ======================= */
function updateEntities(){
  for (const e of ents){
    if (e.dead) continue;
    switch (e.type){
      case 'platform': {
        const t = game.tick * e.spd * 0.012;
        const off = Math.sin(t) * e.range;
        if (e.axis === 'x'){ const nx = e.ox + off; e.dx = nx - e.x; e.x = nx; e.dy = 0; }
        else { const ny = e.oy + off; e.dy = ny - e.y; e.y = ny; e.dx = 0; }
        break;
      }
      case 'goomba': case 'koopa': {
        if (e.squash > 0){ e.squash--; if (e.squash === 0) e.dead = true; break; }
        if (Math.abs(e.x - player.x) > VIEW_W) break;
        const sv = e.vx || (e.type === 'goomba' ? 1.2 : 1.0);
        physics(e, false);
        if (e.hitWall || e.vx === 0) e.vx = -sv;
        e.anim = (e.anim || 0) + 0.12;
        if (e.y > VIEW_H + 200) e.dead = true;
        break;
      }
      case 'shell': {
        const sv = e.vx;
        physics(e, false);
        if (e.hitWall && sv !== 0) e.vx = -sv;
        if (e.wake > 0) e.wake--;
        if (e.y > VIEW_H + 200) e.dead = true;
        // 龟壳撞怪
        if (Math.abs(e.vx) > 1){
          for (const o of ents){
            if (o === e || o.dead || (o.type !== 'goomba' && o.type !== 'koopa')) continue;
            if (overlap(e,o)){ o.dead = true; addScore(200); SFX.stomp();
              for (let i=0;i<6;i++) particle(o.x+13,o.y+14,(Math.random()-.5)*6,-Math.random()*6,'#8b4a2b',30); }
          }
        }
        break;
      }
      case 'mushroom': {
        if (e.rise > 0){ e.rise--; e.y -= 1.6; break; }
        physics(e, false);
        if (e.hitWall) e.vx = -e.vx;
        if (e.y > VIEW_H + 200) e.dead = true;
        break;
      }
      case 'flower': {
        if (e.rise > 0){ e.rise--; e.y -= 1.6; }
        e.t += 0.15; break;
      }
      case 'fireball': {
        e.t += 0.4; e.life--;
        e.x += e.vx; 
        { const c0=Math.floor(e.x/TILE), c1=Math.floor((e.x+e.w-1)/TILE), r=Math.floor((e.y+6)/TILE);
          if (isSolid(tileAt(c0,r)) || isSolid(tileAt(c1,r))) e.dead = true; }
        e.vy = Math.min(e.vy + 0.6, 12); e.y += e.vy;
        { const r0=Math.floor(e.y/TILE), r1=Math.floor((e.y+e.h)/TILE), c=Math.floor((e.x+6)/TILE);
          if (e.vy > 0 && isSolid(tileAt(c,r1))){ e.y = r1*TILE - e.h; e.vy = -7.5; }
          else if (e.vy < 0 && isSolid(tileAt(c,r0))){ e.vy = 1; } }
        if (e.life <= 0) e.dead = true;
        for (const o of ents){
          if (o.dead || (o.type !== 'goomba' && o.type !== 'koopa')) continue;
          if (overlap(e,o)){ o.dead = true; e.dead = true; addScore(200); SFX.stomp();
            for (let i=0;i<8;i++) particle(o.x+13,o.y+14,(Math.random()-.5)*7,-Math.random()*7,'#ff9d3b',30); }
        }
        if (e.dead) for (let i=0;i<5;i++) particle(e.x+6,e.y+6,(Math.random()-.5)*4,(Math.random()-.5)*4,'#ffd36b',18,4);
        break;
      }
      case 'coin': e.t += 0.16; break;
      case 'pop': e.y += e.vy; e.vy += 0.62; e.life--; if (e.life <= 0) e.dead = true; break;
    }
  }

  // 玩家 × 实体
  const p = player;
  if (!p.dead && game.state === 'play'){
    for (const e of ents){
      if (e.dead || e.type === 'platform' || e.type === 'pop' || e.type === 'fireball') continue;
      if (!overlap(p, e)) continue;
      if (e.type === 'coin'){ e.dead = true; game.coins++; addScore(200); SFX.coin(); }
      else if (e.type === 'mushroom'){ e.dead = true; grow(1); }
      else if (e.type === 'flower'){ e.dead = true; grow(2); }
      else if (e.type === 'goomba' || e.type === 'koopa'){
        const stomping = p.vy > 0 && (p.y + p.h - p.vy) <= e.y + 12;
        if (stomping){
          p.vy = keys.jump ? -12.5 : -8.5;
          addScore(100); SFX.stomp();
          if (e.type === 'goomba'){ e.squash = 18; e.vx = 0; }
          else { e.dead = true; ents.push(makeShell(e.x, e.y + e.h - 26)); }
          for (let i=0;i<5;i++) particle(e.x+13, e.y+e.h, (Math.random()-.5)*5, -Math.random()*4, '#fff', 20, 4);
        } else hurtPlayer();
      }
      else if (e.type === 'shell'){
        const stomping = p.vy > 0 && (p.y + p.h - p.vy) <= e.y + 12;
        if (e.vx === 0){
          if (stomping){ p.vy = -8.5; }
          else { e.vx = (p.x + p.w/2 < e.x + e.w/2 ? 6 : -6); e.wake = 12; addScore(400); SFX.kick(); }
        } else {
          if (stomping){ e.vx = 0; p.vy = -8.5; SFX.stomp(); }
          else hurtPlayer();
        }
      }
    }
  }
  ents = ents.filter(e => !e.dead);
}

/* ======================= 绘制：图块 ======================= */
function drawTile(ch, x, y, c, r){
  switch (ch){
    case '#': {
      ctx.fillStyle = '#b8541f'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#e07b3a'; ctx.fillRect(x, y, TILE, 6);
      ctx.fillStyle = '#8c3a13';
      ctx.fillRect(x, y + 15, TILE, 2); ctx.fillRect(x + 15, y + 6, 2, 9); ctx.fillRect(x + 7, y + 17, 2, 15);
      ctx.fillRect(x + 23, y + 17, 2, 15);
      break;
    }
    case '=': {
      ctx.fillStyle = '#9aa3b2'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#c3cad6'; ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 8);
      ctx.fillStyle = '#6d7686'; ctx.fillRect(x, y + TILE - 4, TILE, 4);
      break;
    }
    case 'B': {
      ctx.fillStyle = '#a8471c'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#d4703b'; ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
      ctx.fillStyle = '#8a3712';
      for (let i=0;i<4;i++) ctx.fillRect(x, y + i*8 + 7, TILE, 2);
      ctx.fillRect(x + 15, y, 2, 8); ctx.fillRect(x + 7, y + 8, 2, 8);
      ctx.fillRect(x + 23, y + 8, 2, 8); ctx.fillRect(x + 15, y + 16, 2, 8); ctx.fillRect(x + 7, y + 24, 2, 8);
      break;
    }
    case '?': case 'M': {
      const blink = 0.82 + 0.18 * Math.sin(game.tick * 0.12 + c);
      ctx.fillStyle = '#d88b18'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = 'rgb(' + Math.round(230*blink+25) + ',' + Math.round(170*blink+40) + ',40)';
      ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = '#8a5407';
      ctx.fillRect(x + 2, y + 2, 4, 4); ctx.fillRect(x + TILE-6, y + 2, 4, 4);
      ctx.fillRect(x + 2, y + TILE-6, 4, 4); ctx.fillRect(x + TILE-6, y + TILE-6, 4, 4);
      ctx.fillStyle = '#6b3d05'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
      ctx.fillText('?', x + TILE/2, y + 23);
      break;
    }
    case 'U': {
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#a9743d'; ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
      break;
    }
    case 'P': {
      const capTop = tileAt(c, r-1) !== 'P';
      const leftCol = tileAt(c-1, r) !== 'P';
      const gx = capTop ? x - (leftCol ? 3 : 0) : x;
      const gw = capTop ? TILE + 3 : TILE;
      ctx.fillStyle = '#1f9e2f'; ctx.fillRect(gx, y, gw, capTop ? 16 : TILE);
      if (!capTop) { ctx.fillStyle = '#1f9e2f'; ctx.fillRect(x, y, TILE, TILE); }
      else ctx.fillRect(x, y + 14, TILE, TILE - 14);
      ctx.fillStyle = '#5ce063';
      ctx.fillRect(gx + 3, y + 2, 5, capTop ? 12 : TILE - 4);
      if (capTop) ctx.fillRect(x + 3, y + 16, 5, TILE - 16);
      ctx.fillStyle = '#0d6b1a';
      ctx.fillRect(gx + gw - 5, y, 5, capTop ? 16 : TILE);
      if (capTop) ctx.fillRect(x + TILE - 5, y + 16, 5, TILE - 16);
      break;
    }
    case 'T': {
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(x, y, TILE, 16);
      ctx.fillStyle = '#c78b46'; ctx.fillRect(x, y, TILE, 6);
      ctx.fillStyle = '#5e3a17'; ctx.fillRect(x, y + 14, TILE, 2);
      break;
    }
    case 'F': {
      ctx.fillStyle = '#d7d7d7'; ctx.fillRect(x + 14, y, 5, TILE);
      if (tileAt(c, r-1) !== 'F'){
        ctx.fillStyle = '#ffe14d'; ctx.beginPath();
        ctx.arc(x + 16, y - 4, 7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#e8422e'; ctx.beginPath();
        ctx.moveTo(x + 14, y + 6); ctx.lineTo(x - 14, y + 16); ctx.lineTo(x + 14, y + 26); ctx.closePath(); ctx.fill();
      }
      break;
    }
  }
}

/* ======================= 绘制：角色 ======================= */
function drawPlayer(){
  const p = player;
  if (p.inv > 0 && !p.dead && Math.floor(game.tick / 3) % 2) return;
  const x = Math.round(p.x - cam.x), y = Math.round(p.y);
  const big = p.power > 0, W = p.w, H = p.h;
  const skin = '#ffc39a', hat = p.power === 2 ? '#ffffff' : '#e0322a';
  const shirt = p.power === 2 ? '#e0322a' : '#2a6fd6', pants = p.power === 2 ? '#e0322a' : '#2a56b8';
  const f = p.face;

  ctx.save();
  ctx.translate(x + W/2, y);
  ctx.scale(f, 1);
  ctx.translate(-W/2, 0);
  if (p.dead) ctx.globalAlpha = 0.9;

  if (!big){
    ctx.fillStyle = hat;  ctx.fillRect(2, 0, 18, 6); ctx.fillRect(0, 4, 8, 3);
    ctx.fillStyle = skin; ctx.fillRect(4, 6, 14, 8);
    ctx.fillStyle = '#3a2a20'; ctx.fillRect(13, 8, 3, 3); ctx.fillRect(4, 11, 6, 3);
    ctx.fillStyle = shirt; ctx.fillRect(3, 14, 16, 8);
    ctx.fillStyle = skin;  ctx.fillRect(0, 15, 4, 6); ctx.fillRect(18, 15, 4, 6);
    ctx.fillStyle = pants; ctx.fillRect(4, 20, 14, 5);
    const step = p.onGround ? Math.floor(p.animT) % 2 : 0;
    ctx.fillStyle = '#5a2d12';
    if (!p.onGround){ ctx.fillRect(1, 24, 9, 4); ctx.fillRect(12, 24, 9, 4); }
    else if (step){ ctx.fillRect(0, 24, 10, 4); ctx.fillRect(13, 24, 8, 4); }
    else { ctx.fillRect(2, 24, 9, 4); ctx.fillRect(12, 24, 9, 4); }
  } else {
    const ch = p.crouch ? 34 : 52, off = p.crouch ? 18 : 0;
    ctx.fillStyle = hat;  ctx.fillRect(3, off + 0, 18, 7); ctx.fillRect(0, off + 5, 8, 4);
    ctx.fillStyle = skin; ctx.fillRect(5, off + 8, 15, 11);
    ctx.fillStyle = '#3a2a20'; ctx.fillRect(14, off + 10, 3, 4); ctx.fillRect(5, off + 15, 8, 3);
    ctx.fillStyle = shirt; ctx.fillRect(2, off + 19, 18, 9);
    ctx.fillStyle = skin;  ctx.fillRect(0, off + 20, 4, 8); ctx.fillRect(19, off + 20, 4, 8);
    ctx.fillStyle = pants; ctx.fillRect(3, off + 26, 17, ch - off - 32);
    ctx.fillStyle = shirt; ctx.fillRect(6, off + 26, 3, 4); ctx.fillRect(14, off + 26, 3, 4);
    const step = p.onGround ? Math.floor(p.animT) % 2 : 0;
    ctx.fillStyle = '#5a2d12';
    const fy = ch - 6;
    if (!p.onGround){ ctx.fillRect(1, fy, 9, 6); ctx.fillRect(13, fy, 9, 6); }
    else if (step){ ctx.fillRect(0, fy, 11, 6); ctx.fillRect(14, fy, 8, 6); }
    else { ctx.fillRect(2, fy, 9, 6); ctx.fillRect(13, fy, 9, 6); }
  }
  ctx.restore();
}

function drawEntity(e){
  const x = Math.round(e.x - cam.x), y = Math.round(e.y);
  switch (e.type){
    case 'goomba': {
      if (e.squash > 0){
        ctx.fillStyle = '#8b4a2b'; ctx.fillRect(x, y + e.h - 10, e.w, 10);
        ctx.fillStyle = '#5e2f18'; ctx.fillRect(x, y + e.h - 4, e.w, 4);
        break;
      }
      const w = Math.floor(e.anim || 0) % 2;
      ctx.fillStyle = '#8b4a2b';
      ctx.fillRect(x + 2, y + 2, e.w - 4, 16);
      ctx.fillRect(x, y + 8, e.w, 12);
      ctx.fillStyle = '#f2d7bb'; ctx.fillRect(x + 5, y + 8, 6, 7); ctx.fillRect(x + 15, y + 8, 6, 7);
      ctx.fillStyle = '#1a1208'; ctx.fillRect(x + 7, y + 9, 3, 5); ctx.fillRect(x + 16, y + 9, 3, 5);
      ctx.fillRect(x + 4, y + 4, 5, 3); ctx.fillRect(x + 17, y + 4, 5, 3);
      ctx.fillStyle = '#3a2210';
      if (w){ ctx.fillRect(x - 1, y + 20, 12, 8); ctx.fillRect(x + 15, y + 20, 12, 8); }
      else { ctx.fillRect(x + 1, y + 20, 11, 8); ctx.fillRect(x + 14, y + 20, 11, 8); }
      break;
    }
    case 'koopa': {
      const dir = e.vx < 0 ? -1 : 1, w = Math.floor(e.anim || 0) % 2;
      ctx.save(); ctx.translate(x + e.w/2, y); ctx.scale(dir, 1); ctx.translate(-e.w/2, 0);
      ctx.fillStyle = '#3fbf4a'; ctx.fillRect(6, 0, 14, 12);
      ctx.fillStyle = '#f4e06a'; ctx.fillRect(8, 3, 12, 8);
      ctx.fillStyle = '#1a1208'; ctx.fillRect(15, 5, 3, 3);
      ctx.fillStyle = '#f0a92a'; ctx.fillRect(19, 8, 5, 3);
      ctx.fillStyle = '#2f9e3a'; ctx.fillRect(2, 12, 22, 20);
      ctx.fillStyle = '#7ce06a'; ctx.fillRect(5, 15, 16, 14);
      ctx.fillStyle = '#2f9e3a'; ctx.fillRect(5, 20, 16, 3); ctx.fillRect(11, 15, 4, 14);
      ctx.fillStyle = '#f4e06a';
      if (w){ ctx.fillRect(3, 32, 10, 8); ctx.fillRect(15, 32, 9, 8); }
      else { ctx.fillRect(5, 32, 9, 8); ctx.fillRect(16, 32, 8, 8); }
      ctx.restore();
      break;
    }
    case 'shell': {
      const spin = Math.abs(e.vx) > 1 ? Math.sin(game.tick * 0.5) * 3 : 0;
      ctx.fillStyle = '#2f9e3a'; ctx.fillRect(x, y, e.w, e.h);
      ctx.fillStyle = '#7ce06a'; ctx.fillRect(x + 3 + spin, y + 3, e.w - 6, e.h - 6);
      ctx.fillStyle = '#2f9e3a'; ctx.fillRect(x + 3, y + 11, e.w - 6, 3); ctx.fillRect(x + 11 + spin, y + 3, 4, e.h - 6);
      break;
    }
    case 'mushroom': {
      ctx.fillStyle = '#e8422e'; ctx.fillRect(x + 1, y, e.w - 2, 14); ctx.fillRect(x, y + 4, e.w, 10);
      ctx.fillStyle = '#fff'; ctx.fillRect(x + 3, y + 3, 6, 6); ctx.fillRect(x + 17, y + 3, 6, 6);
      ctx.fillRect(x + 10, y + 1, 6, 5);
      ctx.fillStyle = '#f6dcb4'; ctx.fillRect(x + 4, y + 14, e.w - 8, 12);
      ctx.fillStyle = '#1a1208'; ctx.fillRect(x + 7, y + 18, 3, 3); ctx.fillRect(x + 16, y + 18, 3, 3);
      break;
    }
    case 'flower': {
      const t = e.t, sw = Math.sin(t) * 2;
      ctx.fillStyle = '#2f9e3a'; ctx.fillRect(x + 11, y + 14, 4, 12);
      ctx.fillStyle = '#7ce06a'; ctx.fillRect(x + 2, y + 18, 8, 4); ctx.fillRect(x + 16, y + 20, 8, 4);
      ctx.fillStyle = '#ff8a2b';
      ctx.fillRect(x + 4 + sw, y + 2, 18, 8); ctx.fillRect(x + 8 + sw, y - 1, 10, 14);
      ctx.fillStyle = '#ffe14d'; ctx.fillRect(x + 9 + sw, y + 3, 8, 7);
      ctx.fillStyle = '#fff'; ctx.fillRect(x + 11 + sw, y + 5, 4, 3);
      break;
    }
    case 'fireball': {
      ctx.fillStyle = '#ff7a1f';
      ctx.beginPath(); ctx.arc(x + 6, y + 6, 7, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffe14d';
      ctx.beginPath(); ctx.arc(x + 6 + Math.cos(e.t)*2, y + 6 + Math.sin(e.t)*2, 3.5, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'coin': {
      const s = Math.abs(Math.cos(e.t));
      ctx.fillStyle = '#d9a419'; ctx.fillRect(x + 8 - 8*s, y, Math.max(2, 16*s), 20);
      ctx.fillStyle = '#ffdb4d'; ctx.fillRect(x + 8 - 6*s, y + 2, Math.max(1, 12*s), 16);
      break;
    }
    case 'pop': {
      ctx.fillStyle = '#ffdb4d'; ctx.fillRect(x, y, 16, 20);
      ctx.fillStyle = '#d9a419'; ctx.fillRect(x + 5, y + 2, 6, 16);
      break;
    }
    case 'platform': {
      ctx.fillStyle = '#5a3a1a'; ctx.fillRect(x, y, e.w, e.h);
      ctx.fillStyle = '#c78b46'; ctx.fillRect(x, y, e.w, 6);
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(x + 2, y + 7, e.w - 4, 6);
      ctx.fillStyle = '#3c2610';
      for (let i = 8; i < e.w; i += 24) ctx.fillRect(x + i, y + 6, 2, e.h - 6);
      break;
    }
  }
}

/* ======================= 绘制：背景 ======================= */
function drawBackground(){
  const gr = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  gr.addColorStop(0, level.sky[0]); gr.addColorStop(1, level.sky[1]);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  for (const d of deco){
    if (d.t === 'cloud'){
      const x = d.x - cam.x * 0.35, y = d.y;
      if (x < -200 || x > VIEW_W + 200) continue;
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      const s = d.s;
      ctx.beginPath();
      ctx.arc(x, y, 16*s, 0, Math.PI*2); ctx.arc(x + 20*s, y - 8*s, 20*s, 0, Math.PI*2);
      ctx.arc(x + 44*s, y, 16*s, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(x - 2, y, 48*s, 14*s);
    }
  }
  for (const d of deco){
    if (d.t === 'hill'){
      const x = d.x - cam.x * 0.55, y = d.y, s = d.s;
      if (x < -300 || x > VIEW_W + 300) continue;
      ctx.fillStyle = '#2f9e3a';
      ctx.beginPath(); ctx.moveTo(x - 70*s, y); ctx.quadraticCurveTo(x, y - 90*s, x + 70*s, y); ctx.fill();
      ctx.fillStyle = '#248030';
      ctx.beginPath(); ctx.arc(x - 22*s, y - 30*s, 7*s, 0, Math.PI*2); ctx.arc(x + 18*s, y - 22*s, 6*s, 0, Math.PI*2); ctx.fill();
    }
  }
  for (const d of deco){
    if (d.t === 'bush'){
      const x = d.x - cam.x * 0.85, y = d.y, s = d.s;
      if (x < -200 || x > VIEW_W + 200) continue;
      ctx.fillStyle = '#31b03f';
      ctx.beginPath();
      ctx.arc(x, y - 6*s, 16*s, Math.PI, 0); ctx.arc(x + 24*s, y - 12*s, 20*s, Math.PI, 0);
      ctx.arc(x + 50*s, y - 6*s, 16*s, Math.PI, 0); ctx.fill();
      ctx.fillRect(x - 16*s, y - 8*s, 82*s, 9*s);
    }
  }
  // 终点城堡
  const cx = (level.flagC + 5) * TILE - cam.x, cy = 13*TILE;
  if (cx > -260 && cx < VIEW_W + 260){
    ctx.fillStyle = '#9c9c9c'; ctx.fillRect(cx, cy - 110, 160, 110);
    ctx.fillStyle = '#7d7d7d';
    for (let i=0;i<5;i++) ctx.fillRect(cx + i*34, cy - 128, 22, 18);
    ctx.fillStyle = '#6f6f6f'; ctx.fillRect(cx + 55, cy - 130, 50, 60);
    ctx.fillStyle = '#3a2a20'; ctx.fillRect(cx + 62, cy - 46, 36, 46);
    ctx.beginPath(); ctx.arc(cx + 80, cy - 46, 18, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(cx + 20, cy - 90, 18, 22); ctx.fillRect(cx + 122, cy - 90, 18, 22);
  }
}

/* ======================= 绘制：HUD 与界面 ======================= */
function text(s, x, y, size, color, align){
  ctx.font = 'bold ' + size + 'px "Courier New",monospace';
  ctx.textAlign = align || 'left';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
function drawHUD(){
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(0, 0, VIEW_W, 44);
  text('得分 ' + String(game.score).padStart(6, '0'), 16, 30, 18);
  ctx.fillStyle = '#d9a419'; ctx.fillRect(212, 13, 15, 19);
  ctx.fillStyle = '#ffdb4d'; ctx.fillRect(214, 15, 11, 15);
  ctx.fillStyle = '#d9a419'; ctx.fillRect(217, 18, 5, 9);
  text('x' + String(game.coins).padStart(2, '0'), 234, 30, 18, '#ffdb4d');
  text('关卡 ' + level.name, 330, 30, 18);
  text('时间 ' + Math.max(0, Math.ceil(game.time)), 470, 30, 18, game.time < 60 ? '#ff6b5c' : '#fff');
  const pw = ['小', '大', '火'][player.power];
  text('形态 ' + pw, 600, 30, 18, player.power === 2 ? '#ff9d3b' : '#fff');
  text('♥ ' + game.lives, 720, 30, 18, '#ff8a8a');
  if (game.msgT > 0){
    game.msgT--;
    ctx.globalAlpha = Math.min(1, game.msgT / 30);
    text(game.msg, VIEW_W/2, 86, 26, '#ffe14d', 'center');
    ctx.globalAlpha = 1;
  }
}
function overlayBox(){ ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }

function isTouch(){ return matchMedia('(pointer:coarse)').matches; }
function drawTitle(){
  const gr = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  gr.addColorStop(0, '#1b2a6b'); gr.addColorStop(1, '#5c94fc');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  const bob = Math.sin(game.tick * 0.05) * 6;
  text('超 级 酷 跑 兄 弟', VIEW_W/2, 150 + bob, 52, '#ffe14d', 'center');
  text('SUPER RUNNER BROS', VIEW_W/2, 190 + bob, 20, '#fff', 'center');
  if (isTouch()){
    text('◀ ▶ 移动　　A 跳跃（长按更高）　　B 加速 · 火球', VIEW_W/2, 280, 18, '#dfe6ff', 'center');
    text('右上角 II 暂停　　双指可同时按住跑和跳', VIEW_W/2, 312, 18, '#dfe6ff', 'center');
  } else {
    text('← → / A D  移动　　空格 / W  跳跃（长按更高）', VIEW_W/2, 280, 18, '#dfe6ff', 'center');
    text('Shift / J  加速 · 火球　　P 暂停　　R 重来', VIEW_W/2, 312, 18, '#dfe6ff', 'center');
  }
  text('踩扁蘑菇怪 · 顶问号砖 · 吃蘑菇变大 · 摘火花放火球', VIEW_W/2, 356, 16, '#9fd2ff', 'center');
  if (Math.floor(game.tick / 25) % 2) text(isTouch() ? '点按屏幕开始' : '按 Enter 或 空格 开始', VIEW_W/2, 420, 24, '#ffe14d', 'center');
}
function drawGameOver(){
  overlayBox();
  text('游 戏 结 束', VIEW_W/2, 210, 48, '#ff6b5c', 'center');
  text('最终得分  ' + game.score, VIEW_W/2, 265, 24, '#fff', 'center');
  if (Math.floor(game.tick / 25) % 2) text(isTouch() ? '点按屏幕重新开始' : '按 Enter 重新开始', VIEW_W/2, 330, 22, '#ffe14d', 'center');
}
function drawWin(){
  overlayBox();
  text('通 关 啦 ！', VIEW_W/2, 200, 46, '#ffe14d', 'center');
  text('总得分  ' + game.score + '　　金币 ' + game.coins, VIEW_W/2, 258, 24, '#fff', 'center');
  text('剩余生命  ' + game.lives, VIEW_W/2, 292, 20, '#ff8a8a', 'center');
  if (Math.floor(game.tick / 25) % 2) text(isTouch() ? '点按屏幕再玩一次' : '按 Enter 再玩一次', VIEW_W/2, 356, 22, '#9fd2ff', 'center');
}

/* ======================= 主循环 ======================= */
function togglePause(){ if (game.state === 'play') { game.paused = !game.paused; } }
function startGame(){
  game.score = 0; game.coins = 0; game.lives = 3; game.level = 0; game.paused = false;
  loadLevel(0, false); game.state = 'play'; flash('第 ' + level.name + ' 关  开始！');
}

function updateStep(){
  game.tick++;
  if (game.state === 'title'){ if (!level) loadLevel(0, false); return; }
  if (game.state !== 'play' && game.state !== 'levelclear') return;
  if (game.paused) return;

  updatePlayer();
  updateEntities();

  for (const b of bumps) b.t++;
  bumps = bumps.filter(b => b.t < 12);
  for (const p of parts){ p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life--; }
  parts = parts.filter(p => p.life > 0);

  if (game.state === 'play' && !player.dead){
    game.time -= 1/60;
    if (game.time <= 0){ game.time = 0; killPlayer(false); }
  }
  const target = player.x + player.w/2 - VIEW_W * 0.42;
  cam.x += (target - cam.x) * 0.12;
  cam.x = Math.max(0, Math.min(level.w * TILE - VIEW_W, cam.x));
}

function update(){
  updateStep();
  if (latch.jump > 0) latch.jump--;
  if (latch.run > 0) latch.run--;
}

function render(){
  if (game.state === 'title'){ drawTitle(); return; }
  drawBackground();

  const c0 = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const c1 = Math.min(level.w - 1, Math.ceil((cam.x + VIEW_W) / TILE) + 1);
  for (let r=0;r<ROWS;r++) for (let c=c0;c<=c1;c++){
    const ch = level.grid[r][c];
    if (ch === '.') continue;
    let oy = 0;
    const b = bumps.find(b => b.c === c && b.r === r);
    if (b) oy = -Math.sin(b.t / 12 * Math.PI) * 12;
    drawTile(ch, Math.round(c*TILE - cam.x), Math.round(r*TILE + oy), c, r);
  }
  for (const e of ents) if (e.type === 'platform') drawEntity(e);
  for (const e of ents) if (e.type !== 'platform') drawEntity(e);
  for (const p of parts){ ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x - cam.x), Math.round(p.y), p.size, p.size); }
  drawPlayer();
  drawHUD();

  if (game.paused){
    overlayBox();
    text('暂 停', VIEW_W/2, 230, 44, '#fff', 'center');
    text('按 P 继续', VIEW_W/2, 280, 20, '#9fd2ff', 'center');
  }
  if (game.state === 'gameover') drawGameOver();
  if (game.state === 'win') drawWin();
}

/* --- 自适应画布尺寸：按可用空间等比缩放，竖屏给虚拟按键留出空间 --- */
function fit(){
  const coarse = matchMedia('(pointer:coarse)').matches;
  const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
  let chromeH = 0;
  ['bar','legend','tip'].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.offsetParent !== null) chromeH += el.offsetHeight + 12;
  });
  let availH;
  if (!coarse) availH = vh - chromeH - 40;
  else availH = (vh > vw) ? vh * 0.52 : vh;
  const s = Math.min((vw - (coarse ? 0 : 28)) / VIEW_W, availH / VIEW_H);
  canvas.style.width = Math.floor(VIEW_W * s) + 'px';
  canvas.style.height = Math.floor(VIEW_H * s) + 'px';
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
let fitW = 0, fitH = 0;
function fitIfNeeded(){                    // 兜底：地址栏收起/旋转时未必收到 resize
  if (innerWidth !== fitW || innerHeight !== fitH){ fitW = innerWidth; fitH = innerHeight; fit(); }
}
fit();

let last = 0, acc = 0;
function loop(ts){
  requestAnimationFrame(loop);
  fitIfNeeded();
  if (!last) last = ts;
  acc += Math.min(ts - last, 100); last = ts;
  while (acc >= 1000/60){ update(); acc -= 1000/60; }
  render();
}
loadLevel(0, false);
requestAnimationFrame(loop);
})();
</script>
